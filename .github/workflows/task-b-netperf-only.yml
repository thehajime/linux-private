name: Task B netperf hostfs comparison

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Repetitions per TCP test and duration
        required: true
        default: "3"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  netperf-only:
    name: Host UML process versus Docker UML process
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout measurement harness
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/workflows/scripts

      - name: Download the run 381834 UML image build context
        uses: actions/download-artifact@v4
        with:
          name: uml-image-context-um-nommu-sas
          run-id: 38183419630
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/uml-image-context

      - name: Download the run 381834 SWMMU rootfs
        uses: actions/download-artifact@v4
        with:
          name: swmmu-nginx-rootfs
          run-id: 38183419630
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/swmmu-rootfs

      - name: Prepare matched kernel, rootfs, netserver, and guest init
        env:
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          set -euo pipefail
          [[ "$REPETITIONS" =~ ^[1-5]$ ]]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends netperf
          docker info >/dev/null
          mkdir -p "$RUNNER_TEMP/task-b-netperf/context" "$RUNNER_TEMP/task-b-netperf/rootfs" output
          tar -xzf "$RUNNER_TEMP/uml-image-context/uml-image-context.tar.gz" -C "$RUNNER_TEMP/task-b-netperf/context"
          tar -xzf "$RUNNER_TEMP/swmmu-rootfs/rootfs.tar.gz" -C "$RUNNER_TEMP/task-b-netperf/rootfs"
          install -m 0755 "$RUNNER_TEMP/task-b-netperf/context/vmlinux" "$RUNNER_TEMP/task-b-netperf/vmlinux"
          install -m 0755 "$RUNNER_TEMP/task-b-netperf/context/netperf" "$RUNNER_TEMP/task-b-netperf/rootfs/root/netperf"
          install -m 0755 .github/workflows/scripts/task-b-netperf-guest-init.sh "$RUNNER_TEMP/task-b-netperf/rootfs/root/iperf3.sh"
          sudo pkill -x netserver || true
          sudo netserver -4 -p 12865
          for _ in {1..20}; do
            ss -ltnH 'sport = :12865' | grep -q LISTEN && break
            sleep 1
          done
          ss -ltnH 'sport = :12865' | grep -q LISTEN
          host_ip=$(ip -4 -o addr show docker0 | awk '{split($4,a,"/"); print a[1]; exit}')
          test -n "$host_ip"
          echo "NETSERVER_IP=$host_ip" >> "$GITHUB_ENV"
          echo "REPETITIONS=$REPETITIONS" >> "$GITHUB_ENV"
          {
            echo "workflow_sha=$GITHUB_SHA"
            echo "source_run=38183419630"
            echo "kernel_source_sha=36e95ac822eb1b6638a2a4866906da21b261fe95"
            echo "kernel_file_sha256=$(sha256sum "$RUNNER_TEMP/task-b-netperf/vmlinux" | awk '{print $1}')"
            echo "netperf_sha256=$(sha256sum "$RUNNER_TEMP/task-b-netperf/context/netperf" | awk '{print $1}')"
            echo "rootfs_manifest_sha256=$(sha256sum "$RUNNER_TEMP/swmmu-rootfs/manifest.txt" | awk '{print $1}')"
            echo "host_netserver_sha256=$(sha256sum "$(command -v netserver)" | awk '{print $1}')"
            echo "host_netserver_ip=$host_ip"
            echo "repetitions=$REPETITIONS"
          } > output/manifest.txt
          cat output/manifest.txt

      - name: Run identical guest netperf cases directly and in Docker
        env:
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          set -uo pipefail
          kernel="$RUNNER_TEMP/task-b-netperf/vmlinux"
          rootfs="$RUNNER_TEMP/task-b-netperf/rootfs"
          image=alpine:3.22
          docker pull "$image"
          docker run --rm --entrypoint /bin/true "$image"
          docker_image_id=$(docker image inspect "$image" --format '{{.Id}}')
          echo "docker_base_image=$docker_image_id" >> output/manifest.txt
          docker run --rm --cap-add NET_RAW --cap-add SYS_PTRACE --cap-add DAC_OVERRIDE --cap-add SYS_RAWIO \
            -v /dev/shm:/dev/shm -v "$kernel:/root/vmlinux:ro" -v "$rootfs:/guest-root:ro" \
            --entrypoint /bin/sh "$image" -c 'test -x /root/vmlinux && test -x /guest-root/root/netperf' || exit 1

          start_monitor() {
            local label=$1
            (
              while kill -0 "$2" 2>/dev/null; do
                date -Ins
                cat /proc/loadavg
                ps -eo pid,ppid,stat,pcpu,time,wchan:24,comm,args | grep -E '(^ *PID|vmlinux|netserver)' | grep -v grep || true
                sleep 5
              done
            ) > "output/${label}-host-probe.log" 2>&1 &
            echo $!
          }

          run_direct() {
            local rc pid monitor process_rc guest_rc
            date -Ins > output/direct-start.txt
            direct_cmd="sudo timeout --foreground --signal=TERM 300s $kernel mem=2G vec0:transport=raw,ifname=docker0,depth=128,gro=1 root=/dev/root rootflags=$rootfs rootfstype=hostfs rw loglevel=7 zpoline=0 netperf_only=1 runner_mode=direct init=/root/iperf3.sh"
            script -q -e -c "$direct_cmd" /dev/null > output/direct-uml.log 2>&1 &
            pid=$!
            monitor=$(start_monitor direct "$pid")
            wait "$pid"; rc=$?
            process_rc=$rc
            kill "$monitor" 2>/dev/null || true
            wait "$monitor" 2>/dev/null || true
            if grep -q '^TASK_B_NETPERF_END status=0 ' output/direct-uml.log; then
              guest_rc=0
            else
              guest_rc=1
            fi
            echo "mode=host_direct process_status=$process_rc guest_status=$guest_rc end=$(date -Ins)" | tee output/direct-status.txt
            [ "$guest_rc" -eq 0 ] || rc=1
            return "$rc"
          }

          run_docker() {
            local rc pid monitor process_rc guest_rc
            date -Ins > output/docker-start.txt
            docker_cmd="timeout --foreground --signal=TERM 300s docker run --rm -it --cap-add NET_RAW --cap-add SYS_PTRACE --cap-add DAC_OVERRIDE --cap-add SYS_RAWIO -v /dev/shm:/dev/shm -v $kernel:/root/vmlinux:ro -v $rootfs:/guest-root --entrypoint /root/vmlinux $image mem=2G vec0:transport=raw,ifname=eth0,depth=128,gro=1 root=/dev/root rootflags=/guest-root rootfstype=hostfs rw loglevel=7 zpoline=0 netperf_only=1 runner_mode=docker init=/root/iperf3.sh"
            script -q -e -c "$docker_cmd" /dev/null > output/docker-uml.log 2>&1 &
            pid=$!
            monitor=$(start_monitor docker "$pid")
            wait "$pid"; rc=$?
            process_rc=$rc
            kill "$monitor" 2>/dev/null || true
            wait "$monitor" 2>/dev/null || true
            if grep -q '^TASK_B_NETPERF_END status=0 ' output/docker-uml.log; then
              guest_rc=0
            else
              guest_rc=1
            fi
            echo "mode=docker process_status=$process_rc guest_status=$guest_rc end=$(date -Ins)" | tee output/docker-status.txt
            [ "$guest_rc" -eq 0 ] || rc=1
            return "$rc"
          }

          echo "NETSERVER_IP=$NETSERVER_IP repetitions=$REPETITIONS durations=1,10 tests=TCP_STREAM,TCP_MAERTS size=64"
          # Repeat each mode on the same runner, UML binary, rootfs, guest client,
          # host server and test order. The raw-vector host interface is docker0
          # for the direct host process and eth0 for the Docker process.
          sed -e "s/@SERVER_IP@/$NETSERVER_IP/g" -e "s/@REPETITIONS@/$REPETITIONS/g" \
            .github/workflows/scripts/task-b-netperf-guest-init.sh > "$rootfs/root/iperf3.sh"
          chmod 0755 "$rootfs/root/iperf3.sh"
          direct_rc=0; docker_rc=0
          run_direct || direct_rc=$?
          run_docker || docker_rc=$?
          echo "host_direct_status=$direct_rc docker_status=$docker_rc" > output/summary.txt
          cat output/summary.txt
          # The host-direct path is retained as a diagnostic control; success of
          # the requested Docker-hostfs measurement determines the workflow result.
          test "$docker_rc" -eq 0

      - name: Upload netperf-only comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-b-netperf-only-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 30
