on:
  push:
    branches:
      - '**'
      - '!uml-ci-report-assets'
  #pull_request:
  #  branches:
  #    - master
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Kernel branch, tag, or commit to validate'
        required: false
        type: string
        default: feature-swmmu-nommu
      lmbench_ref:
        description: 'Branch or tag in thehajime/lmbench-NoMMU'
        required: false
        type: string
        default: codex/lmbench-process-method
      aports_ref:
        description: 'Pinned master/edge aports source commit used by the temporary NOMMU APK release'
        required: false
        type: string
        default: 3c77cb673f28eff8412759415f28a6983ff0e7de
      publish_images:
        description: 'Publish the tested UML images to GHCR'
        required: false
        type: boolean
        default: false
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: true

env:
  LMBENCH_REF: ${{ inputs.lmbench_ref || 'codex/lmbench-process-method' }}

jobs:
  build_nommu_apks:
    name: "Download signed NOMMU APKs from aports prerelease"
    runs-on: ubuntu-22.04
    outputs:
      kernel_sha: ${{ steps.download.outputs.kernel_sha }}
      aports_sha: ${{ steps.download.outputs.aports_sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout selected kernel source
        uses: actions/checkout@v6
        with:
          repository: thehajime/linux-private
          ref: ${{ inputs.kernel_ref || (github.ref_name == 'ci/uml-nommu' && 'feature-swmmu-nommu') || github.ref }}
          path: kernel-source
      - name: Checkout selected aports source revision
        uses: actions/checkout@v6
        with:
          repository: thehajime/aports
          ref: ${{ inputs.aports_ref || '3c77cb673f28eff8412759415f28a6983ff0e7de' }}
          path: aports-source
          sparse-checkout: |
            main/busybox
            main/musl
            main/openssl
            main/python3
            scripts/swmmu-profile.sh
            scripts/swmmu-cc
            scripts/swmmu-prepare.sh
      - name: Download matching prerelease APK profiles
        id: download
        run: |
          kernel_sha=$(git -C kernel-source rev-parse HEAD)
          aports_sha=$(git -C aports-source rev-parse HEAD)
          release_tag="ci-nommu-${kernel_sha}-${aports_sha}"
          mkdir -p "$RUNNER_TEMP/nommu-apks"
          curl --fail --location --retry 3 \
            "https://github.com/thehajime/aports/releases/download/${release_tag}/nommu-apks.tar.gz" \
            --output "$RUNNER_TEMP/nommu-apks.tar.gz"
          tar -xzf "$RUNNER_TEMP/nommu-apks.tar.gz" -C "$RUNNER_TEMP/nommu-apks"
          test -s "$RUNNER_TEMP/nommu-apks/manifest.txt"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'kernel_sha=%s\n' "$kernel_sha" >> "$GITHUB_OUTPUT"
          printf 'aports_sha=%s\n' "$aports_sha" >> "$GITHUB_OUTPUT"
      - name: Upload signed NOMMU APK profiles and public key
        uses: actions/upload-artifact@v4
        with:
          name: aports-nommu-apks
          path: ${{ runner.temp }}/nommu-apks
          if-no-files-found: error

  build_uml:
    needs: [build_nommu_apks]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - displayTargetName: ubuntu-22.04
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"
            kunit_opts: --kconfig_add CONFIG_KUNIT_UML_PCI=n ### XXX
            testname: um-mmu
            mode: um-mmu
            userspace_profile: alpine
            base_image: mirror.gcr.io/library/alpine:edge
          - displayTargetName: ubuntu-22.04 (time-travel)
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR" CFLAGS+="-DCONFIG_UML_TIME_TRAVEL_SUPPORT" CFLAGS+="-DCONFIG_UML_MAX_USERSPACE_ITERATIONS=100000"
            kunit_opts: --kconfig_add CONFIG_KUNIT_UML_PCI=n ### XXX
            testname: um-mmu-tt
            mode: um-mmu
            userspace_profile: alpine
            base_image: mirror.gcr.io/library/alpine:edge
          - displayTargetName: ubuntu-22.04 (nommu)
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"
            kunit_opts: --kconfig_add CONFIG_MMU=n --kconfig_add CONFIG_KUNIT_UML_PCI=n
            testname: um-nommu
            mode: um-nommu
            userspace_profile: nommu-plain
            base_image: mirror.gcr.io/library/alpine:edge
          - displayTargetName: ubuntu-22.04 (nommu-sas)
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"
            kunit_opts: --kconfig_add CONFIG_MMU=n --kconfig_add CONFIG_KUNIT_UML_PCI=n --kconfig_add CONFIG_UML_NOMMU_SAS=y
            testname: um-nommu-sas
            mode: um-nommu
            userspace_profile: nommu-swmmu
            base_image: mirror.gcr.io/library/alpine:edge
    name: "UML: build (${{ matrix.testname }})"
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1

    defaults:
       run:
         shell: ${{ matrix.shell }}

    steps:
#      - name: Setup tmate session
#        uses: mxschmitt/action-tmate@v3
#        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled }}
#        with:
#          detached: true
      - name: Set env
        shell: bash
        run: |
          printf '%s\n' \
            /usr/lib/ccache/bin \
            /usr/lib/ccache \
            "${GITHUB_WORKSPACE}/bin" >> "$GITHUB_PATH"
          echo "export PATH=/usr/lib/ccache/bin:/usr/lib/ccache:${{ github.workspace }}/bin:$PATH" >> $HOME/.bashrc
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.kernel_ref || (github.ref_name == 'ci/uml-nommu' && 'feature-swmmu-nommu') || github.ref }}
      - name: Checkout canonical CI support files
        uses: actions/checkout@v6
        with:
          ref: ci/uml-nommu
          path: ci-config
      - name: Install canonical CI support files
        run: |
          mkdir -p .github/workflows
          cp -a ci-config/.github/workflows/. .github/workflows/
      - name: Download signed NOMMU APKs
        uses: actions/download-artifact@v4
        with:
          name: aports-nommu-apks
          path: .github/workflows/aports-artifacts
      - uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.testname }}-ccache-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-${{ matrix.testname }}-ccache-build-
      - name: Install packages
        run: |
          sudo apt update -y
          sudo apt install -y ccache iperf3 netperf gdb valgrind libcap-dev libcap-ng-dev libmnl-dev libmbedtls-dev liburing-dev libnuma-dev
      - name: Verify compiler cache wrapper
        run: |
          compiler=$(command -v gcc)
          echo "gcc resolves to: $compiler"
          case "$compiler" in
            /usr/lib/ccache/*) ;;
            *) echo "gcc is not routed through the ccache wrapper" >&2; exit 1 ;;
          esac
          ccache --zero-stats
      - name: Setup latest Alpine Linux
        uses: jirutka/setup-alpine@v1
        with:
           branch: edge
           packages: >
             alpine-sdk
             doas
             libtirpc-dev
             linux-headers
             autoconf
             automake
             bash
             bison
             flex
             bc
             numactl-dev
             libcap-dev
             rsync
             coreutils
             ccache
             liburing-dev
             git
             libcap-ng-dev
             iproute2
      - name: build bench tools
        if: matrix.testname != 'um-mmu-tt'
        run: |
          git clone --depth 1 --branch "$LMBENCH_REF" https://github.com/thehajime/lmbench-NoMMU.git lmbench
          patch --forward --fuzz=0 -d lmbench -p1 < .github/workflows/patches/lmbench-lat-udp-signal-handler.patch
          git clone https://github.com/HewlettPackard/netperf
          patch --forward --fuzz=0 -d netperf -p1 < .github/workflows/patches/netperf-portable-cpu-affinity.patch
          cat > "$RUNNER_TEMP/lmbench-gcc" <<'EOF'
          #!/bin/sh
          exec gcc "$@" -ltirpc
          EOF
          chmod +x "$RUNNER_TEMP/lmbench-gcc"
          lmbench_bin="$GITHUB_WORKSPACE/lmbench/bin/x86_64-linux-gnulibc1"
          mkdir -p "$lmbench_bin"
          lmbench_cflags="-O2 -std=gnu17 -D_GNU_SOURCE -DCONFIG_NOMMU -DHAVE_socklen_t -I/usr/include/tirpc -include string.h"
          if printf '#include <stdio.h>\nint main(void) { off64_t n = 0; return (int)n; }\n' | \
            gcc -D_GNU_SOURCE -x c -fsyntax-only - >/dev/null 2>&1; then
            lmbench_cflags="$lmbench_cflags -DHAVE_off64_t"
          fi
          make -C lmbench/src OS=Linux CC="$RUNNER_TEMP/lmbench-gcc" \
            O="$lmbench_bin" BINDIR="$lmbench_bin" \
            CFLAGS="$lmbench_cflags"
          cd netperf
          sh autogen.sh
          ./configure && make -C src CFLAGS="-fcommon -D_GNU_SOURCE -std=gnu17"
          cd ..
          make -C .github/workflows/ MASTER_CC=gcc
        shell: alpine.sh {0}
      # --root {0}
      - name: Setup faketty
        uses: Yuri6037/Action-FakeTTY@v1.1
      - name: setup tap interface
        run: |
           set -x
           sudo ip tuntap add dev tap100 mode tap user ${USER}
           sudo ip add add 192.168.122.1/24 dev tap100
           sudo ip link set up dev tap100
           cp .github/workflows/gdbinit ~/.gdbinit
           iperf3 -s &
      - name: (FIXME) defconfig rewrite for nommu
        if: matrix.testname == 'um-nommu'
        run: |
          echo "# CONFIG_MMU is not set" >> arch/um/configs/x86_64_defconfig
          echo "# CONFIG_NOMMU_SWMMU_DEFAULT_ON is not set" >> arch/um/configs/x86_64_defconfig
      - name: (FIXME) defconfig rewrite for nommu-sas
        if: matrix.testname == 'um-nommu-sas'
        run: |
          echo "# CONFIG_MMU is not set" >> arch/um/configs/x86_64_defconfig
          echo "CONFIG_UML_NOMMU_SAS=y" >> arch/um/configs/x86_64_defconfig
      - name: build-0 (static)
        run: |
          curl -L -O https://raw.githubusercontent.com/thehajime/ltp/refs/heads/fix-nommu/tools/buildroot/ltp-add.config
          cat ltp-add.config >> arch/um/configs/${{ matrix.defconfig }}
          make ARCH=um ${{ matrix.defconfig }} O=build
          if [[ "${{ matrix.testname }}" == "um-nommu" ]]; then
            scripts/config --file build/.config --disable NOMMU_SWMMU_DEFAULT_ON
            scripts/config --file build/.config --disable NOMMU_SWMMU
            make ARCH=um O=build olddefconfig
            ! grep -q '^CONFIG_NOMMU_SWMMU_DEFAULT_ON=y$' build/.config
            ! grep -q '^CONFIG_NOMMU_SWMMU=y$' build/.config
            ! grep -q '^CONFIG_GCC_PLUGIN_SWMMU=y$' build/.config
          elif [[ "${{ matrix.testname }}" == "um-nommu-sas" ]]; then
            scripts/config --file build/.config --enable NOMMU_SWMMU
            scripts/config --file build/.config --enable NOMMU_SWMMU_DEFAULT_ON
            scripts/config --file build/.config --enable UML_NOMMU_SAS
            make ARCH=um O=build olddefconfig
            grep -q '^CONFIG_NOMMU_SWMMU=y$' build/.config
            grep -q '^CONFIG_UML_NOMMU_SAS=y$' build/.config
          elif [[ "${{ matrix.testname }}" == "um-mmu" ]]; then
            scripts/config --file build/.config --enable SMP --set-val NR_CPUS 4
            make ARCH=um O=build olddefconfig
            grep -q '^CONFIG_SMP=y$' build/.config
            grep -q '^CONFIG_NR_CPUS=4$' build/.config
          fi
          cat build/.config | sed "s/.*CONFIG_STATIC_LINK.*/CONFIG_STATIC_LINK=y/" > /tmp/a; mv /tmp/a build/.config
          make -j8 ARCH=um O=build ${{ matrix.add_configs }}
      - name: Report ccache statistics after build-0
        if: always()
        run: ccache --show-stats
      - name: prep for docker build
        if: matrix.testname != 'um-mmu-tt'
        run: |
           make -j8 ARCH=um O=build modules_install INSTALL_MOD_PATH=`pwd`/.github/workflows
           cp build/vmlinux .github/workflows/
           cp -rpf lmbench .github/workflows/
           cp netperf/src/netperf .github/workflows/
           ls .github/workflows/
           ls .github/workflows/lib/modules
      - name: Build and push Docker image (no push)
        if: matrix.testname != 'um-mmu-tt'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .github/workflows
          build-args: |
            MODE=${{ matrix.mode }}
            USERSPACE_PROFILE=${{ matrix.userspace_profile }}
            BASE_IMAGE=${{ matrix.base_image }}
          push: false
          load: true
          tags: |
            uml-ci/alpine:edge-${{ matrix.testname }}
      - name: Save tested UML image for downstream jobs
        if: matrix.testname != 'um-mmu-tt'
        run: docker save uml-ci/alpine:edge-${{ matrix.testname }} -o "$RUNNER_TEMP/uml-image.tar"
      - name: Upload tested UML image
        if: matrix.testname != 'um-mmu-tt'
        uses: actions/upload-artifact@v4
        with:
          name: uml-docker-image-${{ matrix.testname }}
          path: ${{ runner.temp }}/uml-image.tar
          if-no-files-found: error
      - name: image for test
        if: matrix.testname != 'um-mmu-tt'
        run: |
          docker create --name alpine-nommu uml-ci/alpine:edge-${{ matrix.testname }}
          docker start alpine-nommu
          docker wait alpine-nommu
          docker logs alpine-nommu
          docker export alpine-nommu > alpine.tar
          docker rm alpine-nommu
          mnt=$(mktemp -d)
          dd if=/dev/zero of=alpine.ext4 bs=1 count=0 seek=1G
          sudo chmod og+wr "alpine.ext4"
          yes 2>/dev/null | mkfs.ext4 "alpine.ext4" || true
          sudo mount "alpine.ext4" $mnt
          sudo tar -xf alpine.tar -C $mnt
          sudo umount $mnt
          mkdir -p rootfs
          sudo tar -xf alpine.tar -C rootfs
          sudo chown -R ${USER} rootfs
      - name: test-0 (static)
        if: matrix.testname != 'um-mmu-tt'
        run: |
          sudo sh -c "echo 0 > /proc/sys/vm/mmap_min_addr"
          set +e
          timeout --signal=TERM 30s faketty ./build/vmlinux vec0:transport=tap,ifname=tap100,depth=128,gro=1 ubd0=./alpine.ext4 rw mem=2048m loglevel=8 console=tty init=/sbin/init 2>&1 | tee /tmp/log.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [[ $rc -ne 0 && $rc -ne 124 && $rc -ne 143 ]]; then exit "$rc"; fi
          if [[ "${{ matrix.testname }}" == "um-nommu" ]]; then
            grep -q 'NOMMU_USERSPACE_READY' /tmp/log.txt
          fi
          echo "========="
          cat /tmp/log.txt
      - name: kunit test
        if: ${{ matrix.testname != 'um-mmu-tt' && github.event_name != 'workflow_dispatch' }}
        run: |
          mkdir -p output/kunit
          for config in `find . -path './ci-config' -prune -o -name .kunitconfig -print | grep -v -E "kfence|sunrpc|handshake|kcsan|gpu|damon|rust|android|sound|hid|firewire|iommu|nvme|mac80211|irqchip|spi" `; do \
            echo "==" $config "==" ; \
            result_name=$(printf '%s' "$config" | sed 's#[^A-Za-z0-9._-]#_#g'); \
            ./tools/testing/kunit/kunit.py run --json="output/kunit/kunit-${{ matrix.testname }}-${result_name}.json" --kunitconfig="$config" ${{ matrix.kunit_opts }}
          done
      - name: Upload KUnit result data
        if: ${{ always() && matrix.testname != 'um-mmu-tt' }}
        uses: actions/upload-artifact@v7
        with:
          name: kunit-results-${{ matrix.testname }}
          path: output/kunit/*.json
          if-no-files-found: warn
      - name: build-1
        run: |
          curl -L -O https://raw.githubusercontent.com/thehajime/ltp/refs/heads/fix-nommu/tools/buildroot/ltp-add.config
          cat ltp-add.config >> arch/um/configs/${{ matrix.defconfig }}
          make ARCH=um ${{ matrix.defconfig }}
          if [[ "${{ matrix.testname }}" == "um-nommu" ]]; then
            scripts/config --disable NOMMU_SWMMU_DEFAULT_ON --disable NOMMU_SWMMU
            make ARCH=um olddefconfig
            ! grep -q '^CONFIG_NOMMU_SWMMU_DEFAULT_ON=y$' .config
            ! grep -q '^CONFIG_NOMMU_SWMMU=y$' .config
            ! grep -q '^CONFIG_GCC_PLUGIN_SWMMU=y$' .config
          elif [[ "${{ matrix.testname }}" == "um-nommu-sas" ]]; then
            scripts/config --enable NOMMU_SWMMU --enable NOMMU_SWMMU_DEFAULT_ON --enable UML_NOMMU_SAS
            make ARCH=um olddefconfig
            grep -q '^CONFIG_NOMMU_SWMMU=y$' .config
            grep -q '^CONFIG_UML_NOMMU_SAS=y$' .config
          elif [[ "${{ matrix.testname }}" == "um-mmu" ]]; then
            scripts/config --enable SMP --set-val NR_CPUS 4
            make ARCH=um olddefconfig
            grep -q '^CONFIG_SMP=y$' .config
            grep -q '^CONFIG_NR_CPUS=4$' .config
          fi
          make -j8 ARCH=um ${{ matrix.add_configs }}
      - name: test-1
        if: matrix.testname != 'um-mmu-tt'
        run: |
          set +e
          timeout --signal=TERM 30s faketty ./vmlinux vec0:transport=tap,ifname=tap100,depth=128,gro=1 ubd0=./alpine.ext4 rw mem=2048m loglevel=8 console=tty init=/sbin/init 2>&1 | tee /tmp/log.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [[ $rc -ne 0 && $rc -ne 124 && $rc -ne 143 ]]; then exit "$rc"; fi
          if [[ "${{ matrix.testname }}" == "um-nommu" ]]; then
            grep -q 'NOMMU_USERSPACE_READY' /tmp/log.txt
          fi
          echo "========="
          cat /tmp/log.txt
      - name: Pack tested image context
        if: matrix.testname != 'um-mmu-tt'
        run: tar -czf "$RUNNER_TEMP/uml-image-context.tar.gz" -C .github/workflows .
      - name: Upload tested image context
        if: matrix.testname != 'um-mmu-tt'
        uses: actions/upload-artifact@v4
        with:
          name: uml-image-context-${{ matrix.testname }}
          path: ${{ runner.temp }}/uml-image-context.tar.gz
          if-no-files-found: error

  publish_uml_images:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images
    needs: [build_uml]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - testname: um-mmu
            mode: um-mmu
            userspace_profile: alpine
            base_tag: edge
          - testname: um-nommu
            mode: um-nommu
            userspace_profile: nommu-plain
            base_tag: edge
          - testname: um-nommu-sas
            mode: um-nommu
            userspace_profile: nommu-swmmu
            base_tag: edge
    steps:
      - name: Download tested image context
        uses: actions/download-artifact@v4
        with:
          name: uml-image-context-${{ matrix.testname }}
          path: ${{ runner.temp }}/image-context
      - name: Extract tested image context
        run: mkdir image-context && tar -xzf "$RUNNER_TEMP/image-context/uml-image-context.tar.gz" -C image-context
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested UML image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: image-context
          build-args: |
            MODE=${{ matrix.mode }}
            USERSPACE_PROFILE=${{ matrix.userspace_profile }}
            BASE_IMAGE=mirror.gcr.io/library/alpine:${{ matrix.base_tag }}
          push: true
          tags: ghcr.io/thehajime/alpine:${{ matrix.base_tag }}-${{ matrix.testname }}

  build_swmmu_nginx_rootfs:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Build SWMMU nginx rootfs once
    needs: [build_uml, build_nommu_apks]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out CI support files
        uses: actions/checkout@v6
      - name: Download the signed SWMMU APK package set
        uses: actions/download-artifact@v4
        with:
          name: aports-nommu-apks
          path: ${{ github.workspace }}/.swmmu-nginx/aport-artifacts
      - name: Download the built NOMMU-SAS UML image
        uses: actions/download-artifact@v4
        with:
          name: uml-docker-image-um-nommu-sas
          path: ${{ runner.temp }}/uml-image
      - name: Extract the exact UML kernel from the tested image
        run: |
          set -euo pipefail
          mkdir -p .swmmu-nginx
          docker load --input "$RUNNER_TEMP/uml-image/uml-image.tar"
          cid=$(docker create uml-ci/alpine:edge-um-nommu-sas)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/root/vmlinux" .swmmu-nginx/vmlinux
          docker rm "$cid" >/dev/null
          trap - EXIT
          chmod 0755 .swmmu-nginx/vmlinux
      - name: Set up minimal Alpine rootfs tooling
        uses: jirutka/setup-alpine@v1
        with:
          branch: edge
          packages: >
            bash
            ca-certificates
            coreutils
            openssl
            tar
      - name: Assemble one shared guest rootfs from signed SWMMU APKs
        shell: alpine.sh --root {0}
        env:
          SWMMU_APK_DIR: ${{ github.workspace }}/.swmmu-nginx/aport-artifacts
          SWMMU_KERNEL_SHA: ${{ needs.build_nommu_apks.outputs.kernel_sha }}
          SWMMU_APORTS_SHA: ${{ needs.build_nommu_apks.outputs.aports_sha }}
          SWMMU_INIT_SCRIPT: ${{ github.workspace }}/.github/workflows/swmmu-nginx-init.sh
          SWMMU_WORK: ${{ github.workspace }}/.swmmu-nginx
        run: |
          set +e
          mkdir -p "$SWMMU_WORK/logs"
          bash "$GITHUB_WORKSPACE/.github/workflows/build-swmmu-nginx-rootfs.sh" \
            > "$SWMMU_WORK/logs/rootfs-build.log" 2>&1
          build_status=$?
          cat "$SWMMU_WORK/logs/rootfs-build.log"
          exit "$build_status"
      - name: Assemble shared MMU and plain NOMMU nginx rootfses
        shell: alpine.sh --root {0}
        env:
          NGINX_APK_DIR: ${{ github.workspace }}/.swmmu-nginx/aport-artifacts
          NGINX_INIT_SCRIPT: ${{ github.workspace }}/.github/workflows/nginx-matrix-init.sh
          NGINX_WORK: ${{ github.workspace }}/.nginx-rootfs
          NGINX_KERNEL_SHA: ${{ needs.build_nommu_apks.outputs.kernel_sha }}
          NGINX_APORTS_SHA: ${{ needs.build_nommu_apks.outputs.aports_sha }}
        run: |
          set -euo pipefail
          for profile in mmu nommu; do
            NGINX_PROFILE="$profile" NGINX_WORK="$NGINX_WORK/$profile" \
              bash "$GITHUB_WORKSPACE/.github/workflows/build-generic-nginx-rootfs.sh"
          done
      - name: Restore runner ownership of SWMMU rootfs files
        if: always()
        run: |
          if [ -d .swmmu-nginx ]; then
            sudo chown -R "$(id -u):$(id -g)" .swmmu-nginx
          fi
          if [ -d .nginx-rootfs ]; then
            sudo chown -R "$(id -u):$(id -g)" .nginx-rootfs
          fi
      - name: Upload shared rootfs, signed APKs, and manifest
        uses: actions/upload-artifact@v4
        with:
          name: swmmu-nginx-rootfs
          path: .swmmu-nginx/artifact
          if-no-files-found: error
      - name: Upload shared MMU nginx rootfs
        uses: actions/upload-artifact@v4
        with:
          name: nginx-rootfs-mmu
          path: .nginx-rootfs/mmu/artifact
          if-no-files-found: error
      - name: Upload shared plain NOMMU nginx rootfs
        uses: actions/upload-artifact@v4
        with:
          name: nginx-rootfs-nommu
          path: .nginx-rootfs/nommu/artifact
          if-no-files-found: error
      - name: Upload rootfs build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swmmu-nginx-rootfs-diagnostics
          path: .swmmu-nginx/logs
          if-no-files-found: warn

  nginx_swmmu_benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "nginx: ${{ matrix.profile }}, workers ${{ matrix.workers }}, connections ${{ matrix.connections }}"
    needs: [build_uml, build_swmmu_nginx_rootfs]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 4]
        connections: [4, 16, 64]
        wrk_threads: [2]
        include:
          - profile: um-mmu
            image_name: um-mmu
            rootfs_artifact: nginx-rootfs-mmu
            kernel_args: ncpus=4
            needs_rawio: false
          - profile: um-mmu-seccomp
            image_name: um-mmu
            rootfs_artifact: nginx-rootfs-mmu
            kernel_args: ncpus=4 seccomp=on
            needs_rawio: false
          - profile: um-nommu
            image_name: um-nommu
            rootfs_artifact: nginx-rootfs-nommu
            kernel_args: ""
            needs_rawio: false
          - profile: um-nommu-seccomp
            image_name: um-nommu
            rootfs_artifact: nginx-rootfs-nommu
            kernel_args: seccomp=on
            needs_rawio: false
          - profile: um-nommu-sas-seccomp
            image_name: um-nommu-sas
            rootfs_artifact: swmmu-nginx-rootfs
            kernel_args: zpoline=0
            needs_rawio: false
          - profile: um-nommu-sas-zpoline
            image_name: um-nommu-sas
            rootfs_artifact: swmmu-nginx-rootfs
            kernel_args: zpoline=1
            needs_rawio: true
    steps:
      - name: Check out CI benchmark helpers
        uses: actions/checkout@v6
      - name: Create per-leg output directory
        run: mkdir -p "output/${{ matrix.profile }}/w${{ matrix.workers }}-c${{ matrix.connections }}"
      - name: Download the shared profile rootfs
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.rootfs_artifact }}
          path: ${{ runner.temp }}/nginx-rootfs
      - name: Download the tested UML image
        uses: actions/download-artifact@v4
        with:
          name: uml-docker-image-${{ matrix.image_name }}
          path: ${{ runner.temp }}/uml-image
      - name: Extract rootfs and kernel
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/uml-image/uml-image.tar"
          cid=$(docker create uml-ci/alpine:edge-${{ matrix.image_name }})
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/root/vmlinux" "$RUNNER_TEMP/vmlinux"
          docker rm "$cid" >/dev/null
          trap - EXIT
          chmod 0755 "$RUNNER_TEMP/vmlinux"
          mkdir -p rootfs
          tar -xzf "$RUNNER_TEMP/nginx-rootfs/rootfs.tar.gz" -C rootfs
      - name: Install UML host networking and capability tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 libcap2-bin
      - name: Run HTTP/TLS smoke tests and wrk from a separate client container
        env:
          WORKERS: ${{ matrix.workers }}
          THREADS: ${{ matrix.wrk_threads }}
          CONNECTIONS: ${{ matrix.connections }}
          PROFILE: ${{ matrix.profile }}
          KERNEL_ARGS: ${{ matrix.kernel_args }}
          NEEDS_RAWIO: ${{ matrix.needs_rawio }}
        run: |
          kernel_sha=$(sed -n 's/^kernel_sha=//p' "$RUNNER_TEMP/nginx-rootfs/manifest.txt")
          aports_sha=$(sed -n 's/^aports_sha=//p' "$RUNNER_TEMP/nginx-rootfs/manifest.txt")
          gcc_version=$(sed -n 's/^gcc_version=//p' "$RUNNER_TEMP/nginx-rootfs/manifest.txt")
          out="output/${PROFILE}/w${WORKERS}-c${CONNECTIONS}"
          .github/workflows/run-swmmu-nginx-benchmark.sh \
            --kernel "$RUNNER_TEMP/vmlinux" \
            --rootfs rootfs \
            --workers "$WORKERS" \
            --threads "$THREADS" \
            --connections "$CONNECTIONS" \
            --duration 30 \
            --profile "$PROFILE" \
            --kernel-args "$KERNEL_ARGS" \
            --needs-rawio "$NEEDS_RAWIO" \
            --kernel-sha "$kernel_sha" \
            --aports-sha "$aports_sha" \
            --gcc-version "$gcc_version" \
            --output "$out"
      - name: Ensure a structured result exists after setup failures
        if: always()
        env:
          WORKERS: ${{ matrix.workers }}
          THREADS: ${{ matrix.wrk_threads }}
          CONNECTIONS: ${{ matrix.connections }}
          PROFILE: ${{ matrix.profile }}
        run: |
          out="output/${PROFILE}/w${WORKERS}-c${CONNECTIONS}"
          if [[ ! -s "$out/measurement.json" ]]; then
            mkdir -p "$out"
            for file in capability.log host-sysctl.log tap.log kernel.log online-cpus.txt nginx.log client-setup.log client-container.log smoke-http.log smoke-tls.log wrk-warmup.log wrk.log nginx.conf; do
              touch "$out/$file"
            done
            printf 'FAIL\n' >"$out/harness.status"
            printf 'FAIL\n' >"$out/smoke-http.status"
            printf 'FAIL\n' >"$out/smoke-tls.status"
            printf '125\n' >"$out/wrk.exit-code"
            python3 .github/workflows/parse-swmmu-nginx-measurement.py \
              --output "$out" --workers "$WORKERS" --threads "$THREADS" \
              --connections "$CONNECTIONS" --duration 30 \
              --profile "$PROFILE" \
              --kernel-sha unknown --aports-sha unknown --gcc-version unknown || true
          fi
      - name: Upload this leg's raw logs and measurement JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ matrix.profile }}-w${{ matrix.workers }}-c${{ matrix.connections }}
          path: output/${{ matrix.profile }}/w${{ matrix.workers }}-c${{ matrix.connections }}
          if-no-files-found: error

  benchmark:
    runs-on: ${{ matrix.runs_on }}
    needs: [build_uml]
    strategy:
      fail-fast: false
      matrix:
        include:
          - displayTargetName: um-mmu
            image_name: um-mmu
            testname: um-mmu
            vmlinux_opt: ""
            runs_on: ubuntu-22.04
          - displayTargetName: um-mmu-s
            image_name: um-mmu
            testname: um-mmu-seccomp
            vmlinux_opt: "seccomp=on"
            runs_on: ubuntu-22.04
          - displayTargetName: um-nommu
            image_name: um-nommu
            testname: um-nommu
            vmlinux_opt: ""
            runs_on: ubuntu-22.04
            base_tag: edge
          - displayTargetName: um-nommu-s
            image_name: um-nommu
            testname: um-nommu-seccomp
            vmlinux_opt: "seccomp=on"
            runs_on: ubuntu-22.04
            base_tag: edge
          - displayTargetName: um-nommu-sas-s
            image_name: um-nommu-sas
            testname: um-nommu-sas-seccomp
            vmlinux_opt: "zpoline=0"
            runs_on: ubuntu-22.04
            base_tag: edge
          - displayTargetName: um-nommu-sas-z
            image_name: um-nommu-sas
            testname: um-nommu-sas-zpoline
            vmlinux_opt: "zpoline=1"
            runs_on: ubuntu-22.04
            base_tag: edge
    name: "UML: bench (${{ matrix.testname }}) "
    timeout-minutes: 100
    steps:
      - name: Download tested UML image
        uses: actions/download-artifact@v4
        with:
          name: uml-docker-image-${{ matrix.image_name }}
          path: ${{ runner.temp }}/uml-image
      - name: Load tested UML image
        run: docker load -i "$RUNNER_TEMP/uml-image/uml-image.tar"
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
        with:
          detached: true
      - name: Setup faketty
        uses: Yuri6037/Action-FakeTTY@v1.1
      - name: setup iperf3/netperf server
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
           set -x
           sudo apt update -y
           sudo apt install -y iperf3 netperf
           if ! ss -ltnH 'sport = :12865' | grep -q LISTEN; then
             sudo service netperf start || true
           fi
           if ! ss -ltnH 'sport = :12865' | grep -q LISTEN; then
             sudo netserver -4 -p 12865
           fi
           for attempt in {1..10}; do
             ss -ltnH 'sport = :12865' | grep -q LISTEN && break
             sleep 1
           done
           if ! ss -ltnH 'sport = :12865' | grep -q LISTEN; then
             echo "netserver did not open TCP port 12865" >&2
             sudo ss -ltnp 'sport = :12865' || true
             exit 1
           fi
           if ! ss -ltnH 'sport = :5201' | grep -q LISTEN; then
             iperf3 -s -D
           fi
           ip ad
           ps aux |grep netserver
           ps aux |grep iperf3
           cat /proc/sys/kernel/exec-shield || true
           echo 0 > /proc/sys/kernel/exec-shield || true
      - name: benchmark-1
        run: |
           mkdir -p output
           sudo sh -c "echo 0 > /proc/sys/vm/mmap_min_addr"
           docker_caps=()
           if [[ "${{ matrix.vmlinux_opt }}" == *zpoline=1* ]]; then
             docker_caps+=(--cap-add SYS_RAWIO)
           fi
           faketty docker run "${docker_caps[@]}" -it -v /dev/shm:/dev/shm --entrypoint /root/vmlinux \
              --rm uml-ci/alpine:edge-${{ matrix.image_name }} \
              mem=2G root=/dev/root rootflags=/ rootfstype=hostfs rw loglevel=8 ${{ matrix.vmlinux_opt }} \
              init=/bench.sh \
             | tee output/${{ matrix.testname }}.dat &
             sleep 100 ; exit
      - name: benchmark-2
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
           set -o pipefail
           mkdir -p output
           ## dynamic build failed at iperf -R
           echo "===========================non-static build may fail...==========================="
           docker_caps=()
           if [[ "${{ matrix.vmlinux_opt }}" == *zpoline=1* ]]; then
             docker_caps+=(--cap-add SYS_RAWIO)
           fi
           #faketty ./vmlinux vec0:transport=raw,ifname=eth0,depth=128,gro=1 mem=2048m \
           #  root=/dev/root rootflags=`pwd`/rootfs rootfstype=hostfs rw \
           #  loglevel=8 console=tty init=/root/iperf3.sh \
           #  | tee output/${{ matrix.testname }}-seccomp-iperf3.dat
           faketty docker run "${docker_caps[@]}" -it -v /dev/shm:/dev/shm --entrypoint /root/vmlinux \
              --rm uml-ci/alpine:edge-${{ matrix.image_name }} mem=2G \
              vec0:transport=raw,ifname=eth0,depth=128,gro=1  \
              root=/dev/root rootflags=/ rootfstype=hostfs rw loglevel=8 \
              ${{ matrix.vmlinux_opt }} \
              init=/root/iperf3.sh \
             | tee output/${{ matrix.testname }}-iperf3.dat
      - uses: actions/upload-artifact@v7
        with:
          name: test-result-${{ matrix.testname }}
          path: output/${{ matrix.testname }}*

  checkpatch:
    runs-on: ubuntu-22.04
    name: checkpatch and co
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1
    steps:
      - name: Set env
        shell: bash
        run: |
          printf '%s\n' \
            /usr/lib/ccache/bin \
            /usr/lib/ccache \
            "${GITHUB_WORKSPACE}/bin" >> "$GITHUB_PATH"
          echo "export PATH=/usr/lib/ccache/bin:/usr/lib/ccache:${{ github.workspace }}/bin:$PATH" >> $HOME/.bashrc
      - name: Checkout
        with:
          fetch-depth: 0
        uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-checkpatch-ccache-build-${{ github.sha }}
          restore-keys: ${{ runner.os }}-checkpatch-ccache-build-
      - name: Install packages
        run: |
           sudo pip install ply GitPython mypy
           sudo apt update -y
           sudo apt install -y aspell ccache sparse
           git clone https://github.com/daxtens/smart-sparse-diff
      - name: Install native benchmark dependencies
        run: sudo apt install -y libtirpc-dev
      - name: Install native network benchmark dependencies
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: sudo apt install -y iperf3 netperf
      - name: Build lmbench for native benchmark
        run: |
          git clone --depth 1 --branch "$LMBENCH_REF" https://github.com/thehajime/lmbench-NoMMU.git lmbench
          patch --forward --fuzz=0 -d lmbench -p1 < .github/workflows/patches/lmbench-lat-udp-signal-handler.patch
          cat > "$RUNNER_TEMP/lmbench-gcc" <<'EOF'
          #!/bin/sh
          exec gcc "$@" -ltirpc
          EOF
          chmod +x "$RUNNER_TEMP/lmbench-gcc"
          lmbench_bin="$GITHUB_WORKSPACE/lmbench/bin/x86_64-linux-gnulibc1"
          mkdir -p "$lmbench_bin"
          lmbench_cflags="-O2 -std=gnu17 -D_GNU_SOURCE -DCONFIG_NOMMU -DHAVE_socklen_t -I/usr/include/tirpc -include string.h"
          if printf '#include <stdio.h>\nint main(void) { off64_t n = 0; return (int)n; }\n' | \
            gcc -D_GNU_SOURCE -x c -fsyntax-only - >/dev/null 2>&1; then
            lmbench_cflags="$lmbench_cflags -DHAVE_off64_t"
          fi
          make -C lmbench/src OS=Linux CC="$RUNNER_TEMP/lmbench-gcc" \
            O="$lmbench_bin" BINDIR="$lmbench_bin" \
            CFLAGS="$lmbench_cflags"
      - name: Run native benchmarks
        run: |
          mkdir -p output
          LMBENCH_BIN_DIR="$GITHUB_WORKSPACE/lmbench/bin/x86_64-linux-gnulibc1" \
            LMBENCH_PROCESS_METHOD=both \
            sh .github/workflows/lmbench_run.sh |& tee output/native.dat
          gcc -o do_getpid .github/workflows/do_getpid.c
          ./do_getpid -c 100 | tee -a output/native.dat
      - name: Run native network benchmarks
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          mkdir -p output
          if ! ss -ltnH 'sport = :12865' | grep -q LISTEN; then
            sudo service netperf start
          fi
          for attempt in {1..10}; do
            ss -ltnH 'sport = :12865' | grep -q LISTEN && break
            sleep 1
          done
          if ! ss -ltnH 'sport = :12865' | grep -q LISTEN; then
            echo "netperf service did not open TCP port 12865" >&2
            sudo ss -ltnp 'sport = :12865' || true
            exit 1
          fi
          sudo ss -ltnp 'sport = :12865'
          iperf3 -s &
          iperf_server_pid=$!
          trap 'kill "$iperf_server_pid" 2>/dev/null || true' EXIT
          iperf3 -c 127.0.0.1 -fm | tee output/native-iperf3.dat
          iperf3 -c 127.0.0.1 -fm -R | tee -a output/native-iperf3.dat
          bash .github/workflows/netperf-bench.sh 127.0.0.1 netperf | tee -a output/native-iperf3.dat
      - name: Upload native benchmark measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-result-native
          path: output/native*.dat
          if-no-files-found: warn
      #- name: Setup tmate session
      #  uses: mxschmitt/action-tmate@v3
      #  with:
      #    detached: true
      - name: Fetch UML next for range checks
        run: |
           git remote add uml git://git.kernel.org/pub/scm/linux/kernel/git/uml/linux.git
           git fetch uml next:refs/remotes/uml/next
      #- name: build (sparse)
      #  run: |
      #     make ARCH=um W=1 C=2 CF='-fdiagnostic-prefix -D__CHECK_ENDIAN__ -fmax-errors=unlimited -fmax-warnings=unlimited' defconfig O=build-sparse
      #     make ARCH=um W=1 C=2 CF='-fdiagnostic-prefix -D__CHECK_ENDIAN__ -fmax-errors=unlimited -fmax-warnings=unlimited' O=build-sparse clean
      #     make ARCH=um W=1 C=2 CF='-fdiagnostic-prefix -D__CHECK_ENDIAN__ -fmax-errors=unlimited -fmax-warnings=unlimited' O=build-sparse -j8 2> old-sparse.log 1> /dev/null
      #     git checkout zpoline-nommu-v6.10
      #     git checkout HEAD~1
      #     make ARCH=um W=1 C=2 CF='-fdiagnostic-prefix -D__CHECK_ENDIAN__ -fmax-errors=unlimited -fmax-warnings=unlimited' O=build-sparse -j8 2> new-sparse.log 1> /dev/null
      #     ./smart-sparse-diff/smart-sparse-diff.py old-sparse.log new-sparse.log
      - name: check coding style
        continue-on-error: true
        run: |
           # The CI branch carries workflow and handoff commits without
           # Signed-off-by trailers. Check only commits that change kernel
           # sources; CI metadata is not an upstream kernel patch.
           git rev-list --reverse uml/next..HEAD | while read -r commit; do
             if git diff-tree --no-commit-id --name-only -r "$commit" |
               grep -qEv '^(\.github/workflows/|AGENTS\.md$)'; then
               git format-patch -1 -o p1 "$commit"
             fi
           done
           ./scripts/checkpatch.pl --summary-file --ignore FILE_PATH_CHANGES \
             --ignore AVOID_EXTERNS p1/*.patch
      - name: check spells on commit message
        run: |
           git log uml/next..HEAD |grep -v -E "^commit" > /tmp/a
           aspell list /tmp/a

  build_ltp:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    uses: ./.github/workflows/ci-docker-build.yml
    name: "LTP: build"
  test_ltp:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: [build_uml, build_ltp]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - displayTargetName: um-mmu
            image_name: uml-ci/alpine:edge-um-mmu
            image_artifact: uml-docker-image-um-mmu
            testname: um-mmu
            vmlinux_opt: ""
            name: um-mmu
          - displayTargetName: um-mmu-s
            image_name: uml-ci/alpine:edge-um-mmu
            image_artifact: uml-docker-image-um-mmu
            testname: um-mmu-seccomp
            vmlinux_opt: "seccomp=on"
            name: um-mmu
          - displayTargetName: um-nommu
            image_name: uml-ci/alpine:edge-um-nommu
            image_artifact: uml-docker-image-um-nommu
            testname: um-nommu
            vmlinux_opt: ""
            name: um-nommu
          - displayTargetName: um-nommu-s
            image_name: uml-ci/alpine:edge-um-nommu
            image_artifact: uml-docker-image-um-nommu
            testname: um-nommu-seccomp
            vmlinux_opt: "seccomp=on"
            name: um-nommu
          - displayTargetName: qemu-riscv-nommu
            image_name: ghcr.io/thehajime/linux-private-riscv64-buildroot:sha-dfebc378bc04da60d0bb9ec86989b56f7f1e3909
            image_artifact: ''
            testname: riscv-nommu
            vmlinux_opt: ""
            name: riscv-nommu
          - displayTargetName: native
            image_name: mirror.gcr.io/library/alpine:edge
            image_artifact: ''
            testname: native
            vmlinux_opt: ""
            name: um-mmu
            docker_opt: "-v /lib/modules:/lib/modules"
          - displayTargetName: um-nommu-sas-s
            image_name: uml-ci/alpine:edge-um-nommu-sas
            image_artifact: uml-docker-image-um-nommu-sas
            testname: um-nommu-sas-seccomp
            vmlinux_opt: ""
            name: um-nommu
          - displayTargetName: um-nommu-sas-z
            image_name: uml-ci/alpine:edge-um-nommu-sas
            image_artifact: uml-docker-image-um-nommu-sas
            testname: um-nommu-sas-zpoline
            vmlinux_opt: "zpoline=1"
            name: um-nommu
    name: "LTP: test-${{ matrix.testname }}"
    steps:
      - name: Download local test image
        if: matrix.image_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image_artifact }}
          path: ${{ runner.temp }}/local-image
      - name: Load local test image
        if: matrix.image_artifact != ''
        run: docker load -i "$(find "$RUNNER_TEMP/local-image" -maxdepth 1 -name '*.tar' -print -quit)"
      - name: Log in to ghcr.io for RISC-V test image
        if: matrix.testname == 'riscv-nommu'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt RISC-V test image
        if: matrix.testname == 'riscv-nommu'
        run: docker pull "${{ matrix.image_name }}"
      - name: Pull native Alpine test image
        if: matrix.testname == 'native'
        run: docker pull mirror.gcr.io/library/alpine:edge
      - uses: actions/checkout@v6
      - name: Checkout LTP test support files
        uses: actions/checkout@v6
        with:
          repository: thehajime/ltp
          ref: fix-nommu
          path: ltp-source
          submodules: recursive
      - name: Prepare RISC-V LTP build cache
        if: matrix.testname == 'riscv-nommu'
        run: mkdir -p "$RUNNER_TEMP/ltp-riscv-artifact" "$RUNNER_TEMP/ltp-home"
      - name: Build RISC-V LTP install tree in the prebuilt image
        if: matrix.testname == 'riscv-nommu'
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/ltp-source:/work-buildroot/ltp" \
            --volume "$GITHUB_WORKSPACE/.github/workflows/build-ltp-riscv.sh:/build-ltp-riscv.sh:ro" \
            --volume "$RUNNER_TEMP/ltp-home:/github/home" \
            --volume "$RUNNER_TEMP/ltp-riscv-artifact:/run-artifacts" \
            --workdir /work-buildroot/ltp \
            --entrypoint /bin/bash \
            "${{ matrix.image_name }}" /build-ltp-riscv.sh
      - uses: actions/download-artifact@v7
        if: matrix.testname != 'riscv-nommu'
        with:
          name: ltp-alpine-${{ matrix.name }}.tar.gz
          path: ${{ runner.temp }}/ltp-install
      - name: Extract LTP install tree on the runner
        run: |
          mkdir -p "$RUNNER_TEMP/ltp-root"
          if [ "${{ matrix.testname }}" = riscv-nommu ]; then
            archive="$RUNNER_TEMP/ltp-riscv-artifact/ltp-alpine-riscv-nommu.tar.gz"
          else
            archive="$RUNNER_TEMP/ltp-install/ltp-alpine-${{ matrix.name }}.tar.gz"
          fi
          tar -xzf "$archive" \
            -C "$RUNNER_TEMP/ltp-root"
          test -x "$RUNNER_TEMP/ltp-root/opt/ltp/kirk"
      - name: Create local test container
        env:
          LTP_TESTNAME: ${{ matrix.testname }}
        run: |
          install -d "$RUNNER_TEMP/ltp-home"
          docker_args=(
            --name ltp-test --privileged -t
            -v /boot:/boot -v /home:/home -v /dev:/dev
            ${{ matrix.docker_opt }}
            -v "$GITHUB_WORKSPACE:/github/workspace"
            -v "$RUNNER_TEMP/ltp-root/opt/ltp:/opt/ltp"
            -v "$RUNNER_TEMP/ltp-home:/github/home"
            -v "$GITHUB_WORKSPACE/ltp-source:/ltp-source:ro"
          )
          if [[ "$LTP_TESTNAME" == um-nommu* ]]; then
            docker create "${docker_args[@]}" \
              --entrypoint /tmp/busybox-host "${{ matrix.image_name }}" \
              sh -c 'exec /tmp/busybox-host sleep infinity'
          else
            docker create "${docker_args[@]}" \
              --entrypoint /bin/sh "${{ matrix.image_name }}" -c 'sleep infinity'
          fi
          docker start ltp-test
      - name: Monitor UML host process mappings
        if: ${{ matrix.testname == 'um-nommu-sas-zpoline' }}
        run: |
          mkdir -p output/ltp/uml-python-debug
          docker exec -d ltp-test /bin/sh \
            /github/workspace/.github/workflows/capture-uml-python-maps.sh host
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
        with:
          detached: true
      - name: Extract test programs and run LTP
        env:
          LTP_TESTNAME: ${{ matrix.testname }}
          LTP_ARTIFACT_NAME: ${{ matrix.name }}
          UML_OPTIONS: ${{ matrix.vmlinux_opt }}
          LTP_TIMEOUT_MUL: 10
          LTP_INSTALL_PREEXTRACTED: 1
        run: |
          set -euo pipefail
          case "$LTP_TESTNAME" in
            um-nommu*)
              mkdir -p output/ltp
              docker exec -t \
                -e PATH=/tmp/busybox-host-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                -e LTP_TESTNAME -e LTP_ARTIFACT_NAME -e UML_OPTIONS -e LTP_TIMEOUT_MUL \
                -e LTP_INSTALL_PREEXTRACTED ltp-test \
                /tmp/busybox-host sh -x /github/workspace/.github/workflows/run-ltp-job.sh \
                | tee "output/ltp/${LTP_TESTNAME}-ltp.dat"
              test -s "output/ltp/ltp-result-${LTP_TESTNAME}.html"
              ;;
            *)
              docker exec -e LTP_TESTNAME -e LTP_ARTIFACT_NAME -e UML_OPTIONS -e LTP_TIMEOUT_MUL \
                -e LTP_INSTALL_PREEXTRACTED ltp-test \
                /bin/sh -c 'if command -v bash >/dev/null 2>&1; then \
                  exec bash -x /github/workspace/.github/workflows/run-ltp-job.sh; \
                else \
                  exec /bin/sh -x /github/workspace/.github/workflows/run-ltp-job.sh; \
                fi'
              ;;
          esac
      - name: Collect UML Python mappings and exact ELF files
        if: ${{ always() && matrix.testname == 'um-nommu-sas-zpoline' }}
        run: |
          set +e
          diag=output/ltp/uml-python-debug
          sudo chown -R "$(id -u):$(id -g)" "$diag" 2>/dev/null || true
          mkdir -p "$diag/elf"
          : > "$diag/collection.log"
          find "$diag" -type f \
            \( -path '*/guest-processes/*' -o -path '*/host-processes/*' \) \
            -print 2>/dev/null | sort > "$diag/captured-files.txt"
          find "$diag/guest-processes" -name auxv -type f -print 2>/dev/null |
          while read -r auxv; do
            od -An -tx8 "$auxv" > "$auxv.hex" 2>> "$diag/collection.log"
          done
          if ! find "$diag/guest-processes" -name maps -type f -print -quit \
              2>/dev/null | grep -q .; then
            echo 'No guest Python process maps captured' > "$diag/collection-status.txt"
          fi
          for path in /usr/bin/python3.14 /usr/lib/libpython3.14.so.1.0 \
                      /lib/ld-musl-x86_64.so.1; do
            source=$(docker exec ltp-test readlink -f "$path" 2>> "$diag/collection.log")
            [ -n "$source" ] || continue
            name=$(basename "$path")
            if ! docker cp "ltp-test:$source" "$diag/elf/$name" \
                2>> "$diag/collection.log"; then
              echo "Failed to copy $source" >> "$diag/collection.log"
            fi
          done
          find "$diag" -type f \
            \( -path '*/guest-processes/*/maps' -o \
               -path '*/host-processes/*/maps' \) -print 2>/dev/null |
          while read -r maps; do
            awk '$6 ~ /^\// {print $6}' "$maps" | sort -u
          done | while read -r path; do
            [ -n "$path" ] || continue
            path=${path%\ (deleted)}
            id=$(printf '%s' "$path" | sha256sum | cut -c1-12)
            name=$(basename "$path")
            if docker cp "ltp-test:$path" "$diag/elf/$id-$name" \
                2>> "$diag/collection.log"; then
              printf '%s\t%s\n' "$id-$name" "$path" >> "$diag/mapped-files.tsv"
            fi
          done
          for elf in "$diag"/elf/*; do
            [ -f "$elf" ] || continue
            sha256sum "$elf" >> "$diag/elf-metadata.txt"
            readelf -n "$elf" >> "$diag/elf-metadata.txt" 2>&1
            readelf -l "$elf" >> "$diag/elf-metadata.txt" 2>&1
          done
      - name: Upload SAS Python fault diagnostics
        if: ${{ always() && matrix.testname == 'um-nommu-sas-zpoline' }}
        uses: actions/upload-artifact@v4
        with:
          name: sas-python-fault-debug
          path: output/ltp/uml-python-debug/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local test container
        if: always()
        run: docker rm -f ltp-test || true
      - name: Restore runner ownership of LTP results
        if: always()
        run: |
          if [ -d output/ltp ]; then
            sudo chown -R "$(id -u):$(id -g)" output/ltp
          fi

      - uses: actions/upload-artifact@v7
        id: upload_html
        with:
          name: ltp-result-${{ matrix.testname }}.html
          path: output/ltp/ltp-result-${{ matrix.testname }}.html
          archive: false
      - name: retrieve artifact URL
        run: |
          echo "${{ matrix.testname }} report: ${{ steps.upload_html.outputs.artifact-url }}" > \
             output/ltp/${{ matrix.testname }}-url.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-result-ltp-${{ matrix.testname }}
          path: output/ltp/*

  bench-result:
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    name: bench-result
    needs: [build_uml,benchmark,test_ltp,checkpatch,nginx_swmmu_benchmark]
    permissions:
      actions: read
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
            path: output
            pattern: test-result-*
            merge-multiple: true
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
            path: output/kunit-results
            pattern: kunit-results-*
      - name: Download UML nginx matrix results
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nginx-um-*-w*-c*
          path: ${{ runner.temp }}/nginx-matrix
          merge-multiple: false
      - name: Download SWMMU rootfs diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: swmmu-nginx-rootfs-diagnostics
          path: ${{ runner.temp }}/swmmu-nginx-rootfs-diagnostics
      - name: Display structure of downloaded files
        run: mkdir -p output && ls -R output || true
      - name: Install packages
        if: ${{ needs.benchmark.result == 'success' || github.event_name == 'workflow_dispatch' }}
        run: sudo apt update -y && sudo apt install -y gnuplot jq
      - name: Aggregate UML nginx results
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p output/nginx
          python3 .github/workflows/aggregate-swmmu-nginx-results.py \
            "$RUNNER_TEMP/nginx-matrix" output/nginx
          plotted=0
          for profile in um-mmu um-mmu-seccomp um-nommu um-nommu-seccomp \
            um-nommu-sas-seccomp um-nommu-sas-zpoline; do
            csv="output/nginx/throughput-${profile}.csv"
            if python3 - "$csv" <<'PY'
          import csv
          import math
          import sys
          with open(sys.argv[1], newline="") as stream:
              for row in csv.DictReader(stream):
                  for field in ("workers_1", "workers_4"):
                      try:
                          if math.isfinite(float(row[field])):
                              sys.exit(0)
                      except (TypeError, ValueError):
                          pass
          sys.exit(1)
          PY
            then
              gnuplot -e "data_file='${csv}'; output_file='output/nginx/throughput-${profile}.png'; profile_label='${profile}'" \
                .github/workflows/plot-swmmu-nginx.gnuplot
              mkdir -p output/out
              cp "output/nginx/throughput-${profile}.png" "output/out/nginx-${profile}.png"
              printf '%s\n' 'Plot generated from available matrix measurements.' \
                > "output/nginx/${profile}-plot-status.txt"
              plotted=1
            else
              printf '%s\n' 'Plot omitted: no successful matrix measurements.' \
                > "output/nginx/${profile}-plot-status.txt"
            fi
          done
          if [ "$plotted" -eq 0 ]; then
            printf '%s\n' 'No profile had any successful measurements.' > output/nginx/plot-status.txt
          fi
          if [ -d "$RUNNER_TEMP/swmmu-nginx-rootfs-diagnostics" ]; then
            cp -a "$RUNNER_TEMP/swmmu-nginx-rootfs-diagnostics" \
              output/nginx/rootfs-diagnostics
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        with:
          name: nginx-aggregate-plot
          path: output/nginx
          if-no-files-found: warn
      - name: bench data parse/out
        if: ${{ needs.benchmark.result == 'success' }}
        run: |
          bash .github/workflows/um-nommu-plot.sh output |& tee um-nommu.log
          bash .github/workflows/netperf-plot.sh output |& tee -a um-nommu.log
      - name: Load previous result snapshot
        uses: actions/github-script@v9
        env:
          SNAPSHOT_PATH: ${{ runner.temp }}/previous-results.json
        with:
          script: |
            const fs = require('fs');
            const zlib = require('zlib');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4,
              per_page: 100
            });
            let snapshot = null;
            for (const comment of comments.reverse()) {
              const match = comment.body.match(/<!-- uml-ci-result-snapshot:v1\n([A-Za-z0-9+/=\r\n]+)\n-->/);
              if (!match) continue;
              snapshot = JSON.parse(zlib.gunzipSync(Buffer.from(match[1].replace(/\s/g, ''), 'base64')).toString());
              break;
            }
            fs.writeFileSync(process.env.SNAPSHOT_PATH, JSON.stringify(snapshot));
            core.info(snapshot ? `Loaded baseline from ${snapshot.run_url}` : 'No prior report snapshot found');
      - name: Create comparison report
        env:
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_SHA: ${{ github.sha }}
          TESTED_REF: ${{ inputs.kernel_ref || (github.ref_name == 'ci/uml-nommu' && 'feature-swmmu-nommu') || github.ref_name }}
          BUILD_STATUS: ${{ needs.build_uml.result }}
          BENCHMARK_STATUS: ${{ needs.benchmark.result }}
          LTP_STATUS: ${{ needs.test_ltp.result }}
        run: |
          python3 .github/workflows/result-report.py \
            --data-dir output \
            --previous "$RUNNER_TEMP/previous-results.json" \
            --snapshot "$RUNNER_TEMP/result-snapshot.json" \
            --report "$RUNNER_TEMP/comparison-report.md" \
            --run-url "$REPORT_URL" \
            --sha "$REPORT_SHA" \
            --tested-ref "$TESTED_REF" \
            --build-status "$BUILD_STATUS" \
            --benchmark-status "$BENCHMARK_STATUS" \
            --ltp-status "$LTP_STATUS"
      - name: Render comparison benchmark plots
        if: ${{ needs.benchmark.result == 'success' }}
        run: |
          python3 .github/workflows/plot-benchmark-results.py \
            --snapshot "$RUNNER_TEMP/result-snapshot.json" \
            --output output/out
      - name: Publish immutable benchmark chart assets
        id: publish_chart_assets
        if: ${{ needs.benchmark.result == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_BRANCH: uml-ci-report-assets
          CHART_DIR: output/out
        run: bash .github/workflows/publish-chart-assets.sh
      - uses: actions/upload-artifact@v7
        if: ${{ needs.benchmark.result == 'success' }}
        with:
          name: test-result-all
          path: output/out/*
      - name: Build GitHub Pages report
        run: |
          python3 .github/workflows/result-page.py \
            --snapshot "$RUNNER_TEMP/result-snapshot.json" \
            --report "$RUNNER_TEMP/comparison-report.md" \
            --charts output/out \
            --output "$RUNNER_TEMP/site"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy report to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
      - name: prepare action post
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          ASSET_BASE_URL: ${{ steps.publish_chart_assets.outputs.asset_base_url }}
        run: |
          {
            cat um-nommu.log 2>/dev/null || true
            if [ -n "$PAGE_URL" ]; then
              printf '\n### Benchmark charts and result data\n\n[Open this run\x27s report on GitHub Pages](%s)\n\n' "$PAGE_URL"
            else
              printf '\n### Benchmark charts and result data\n\nGitHub Pages deployment did not return a URL; see the workflow artifacts.\n\n'
            fi
            for chart in lmbench.png iperf3.png tcp-stream.png nginx-um-mmu.png \
              nginx-um-mmu-seccomp.png nginx-um-nommu.png nginx-um-nommu-seccomp.png \
              nginx-um-nommu-sas-seccomp.png nginx-um-nommu-sas-zpoline.png; do
              if [ -f "$RUNNER_TEMP/site/$chart" ]; then
                if [ -n "$ASSET_BASE_URL" ]; then
                  printf '![%s](%s/%s)\n\n' "${chart%.png}" "$ASSET_BASE_URL" "$chart"
                elif [ -n "$PAGE_URL" ]; then
                  printf '> ⚠️ Permanent chart storage failed; this image link may change on a later Pages deployment.\n\n'
                  printf '![%s](%s%s)\n\n' "${chart%.png}" "${PAGE_URL%/}/" "$chart"
                fi
              fi
            done
            cat "$RUNNER_TEMP/comparison-report.md"
          } > "$RUNNER_TEMP/comment.md"
      - uses: actions/upload-artifact@v7
        with:
          name: uml-ci-comparison-report
          path: |
            ${{ runner.temp }}/comment.md
            ${{ runner.temp }}/result-snapshot.json
            ${{ runner.temp }}/site
      - uses: actions/github-script@v9
        env:
          COMMENT_BODY_FILE: ${{ runner.temp }}/comment.md
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              issue_number: 4,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync(process.env.COMMENT_BODY_FILE, 'utf8')
            })
