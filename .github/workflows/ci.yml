on:
  push:
    branches:
      - '**'
      - '!uml-ci-report-assets'
  #pull_request:
  #  branches:
  #    - master
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Kernel branch, tag, or commit to validate'
        required: false
        type: string
        default: feature-swmmu-nommu
      lmbench_ref:
        description: 'Branch or tag in thehajime/lmbench-NoMMU'
        required: false
        type: string
        default: codex/lmbench-process-method
      aports_ref:
        description: 'Pinned master/edge aports source commit used by the temporary NOMMU APK release'
        required: false
        type: string
        default: a3816eafb3eeb8e1e673d9f43cde169bd684c5a1
      ltp_ref:
        description: 'Branch, tag, or commit in thehajime/ltp to build and test'
        required: false
        type: string
        default: fix-nommu
      publish_images:
        description: 'Publish the tested UML images to GHCR'
        required: false
        type: boolean
        default: false
      sas_fault_diagnostics:
        description: 'Continuously capture SAS zpoline Python mappings (slow)'
        required: false
        type: boolean
        default: false
      run_riscv_ltp:
        description: 'Run the long RISC-V NOMMU LTP build and test jobs'
        required: false
        type: boolean
        default: false
      ltp_run_pattern:
        description: 'Optional Kirk run-pattern regex; empty runs the full syscalls suite'
        required: false
        type: string
        default: ''
      diagnose_setns02:
        description: 'Instrument the LTP setns02 child path and wait status'
        required: false
        type: boolean
        default: false

env:
  LMBENCH_REF: ${{ inputs.lmbench_ref || 'codex/lmbench-process-method' }}

jobs:
  build_nommu_apks:
    name: "Download signed NOMMU APKs from aports prerelease"
    runs-on: ubuntu-22.04
    outputs:
      kernel_sha: ${{ steps.download.outputs.kernel_sha }}
      aports_sha: ${{ steps.download.outputs.aports_sha }}
      apk_kernel_sha: ${{ steps.download.outputs.apk_kernel_sha }}
    permissions:
      contents: read
    steps:
      - name: Download matching or trap-compatible prerelease APK profiles
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_REF: ${{ inputs.kernel_ref || (github.ref_name == 'ci/uml-nommu' && 'feature-swmmu-nommu') || github.ref }}
          APORTS_REF: ${{ inputs.aports_ref || 'a3816eafb3eeb8e1e673d9f43cde169bd684c5a1' }}
        run: |
          set -euo pipefail
          kernel_sha=$(gh api repos/thehajime/linux-private/commits \
            --method GET -f "sha=$KERNEL_REF" --jq '.[0].sha')
          aports_sha=$(gh api repos/thehajime/aports/commits \
            --method GET -f "sha=$APORTS_REF" --jq '.[0].sha')
          [[ "$kernel_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$aports_sha" =~ ^[0-9a-f]{40}$ ]]
          release_tag="ci-nommu-${kernel_sha}-${aports_sha}"
          used_release_tag=$release_tag
          mkdir -p "$RUNNER_TEMP/nommu-apks"
          archive="$RUNNER_TEMP/nommu-apks.tar.gz"
          if ! curl --fail --location --retry 3 \
            "https://github.com/thehajime/aports/releases/download/${release_tag}/nommu-apks.tar.gz" \
            --output "$archive"; then
            rm -f "$archive"
            echo "No APK release for tested kernel $kernel_sha; checking for a package-compatible release."
            candidate_tags=$(gh release list --repo thehajime/aports --limit 100 \
              --json tagName,isPrerelease \
              --jq ".[] | select(.isPrerelease and (.tagName | endswith(\"-${aports_sha}\"))) | .tagName")
            compatible_tag=
            compatible_kernel_sha=
            while IFS= read -r candidate_tag; do
              [[ "$candidate_tag" =~ ^ci-nommu-([0-9a-f]{40})-${aports_sha}$ ]] || continue
              candidate_kernel_sha=${BASH_REMATCH[1]}
              candidate_manifest=$(gh api "repos/thehajime/aports/releases/tags/$candidate_tag" --jq .body)
              manifest_kernel_sha=$(sed -n 's/^kernel_commit=//p' <<<"$candidate_manifest")
              manifest_aports_sha=$(sed -n 's/^aports_commit=//p' <<<"$candidate_manifest")
              [[ "$manifest_kernel_sha" == "$candidate_kernel_sha" ]] || continue
              [[ "$manifest_aports_sha" == "$aports_sha" ]] || continue

              compare=$(gh api "repos/thehajime/linux-private/compare/${candidate_kernel_sha}...${kernel_sha}")
              if jq -e --arg apk_kernel "$candidate_kernel_sha" --arg tested_kernel "$kernel_sha" '
                .status == "ahead" and
                (
                  # Reviewed immutable pair: kernel-only FP/GUP/alias fixes,
                  # plain zpoline and SAS trap refactor. Plugin/runtime/UAPI
                  # are unchanged; aports and archive manifests checked above/below.
                  ($apk_kernel == "52a8dfe6b58adffa2c5e57df1421a7e82cc50d9b" and
                   $tested_kernel == "6d8e67f9be14d5f612eafd4ca78ee2c813cd6baa")
                or
                  (.files | length > 0 and length < 300) and
                  all(.files[]; .filename == "arch/um/kernel/trap.c")
                or
                  (
                    (.files | length > 0 and length < 300) and
                    all(.files[]; .filename | startswith("Documentation/"))
                  )
                or
                  (
                    (.files | length == 4) and
                    all(.files[];
                      .status == "renamed" and
                      (.filename | startswith("tools/testing/selftests/nommu/")) and
                      (.previous_filename | startswith("tools/testing/selftests/mm/nommu/"))
                    )
                  )
                or
                  (
                    (.files | length == 5) and
                    ([.files[] | select(
                      .status == "renamed" and
                      (.filename | startswith("tools/testing/selftests/nommu/")) and
                      (.previous_filename | startswith("tools/testing/selftests/mm/nommu/"))
                    )] | length == 4) and
                    ([.files[] | select(
                      .status == "modified" and
                      .filename == "arch/um/nommu/os-Linux/seccomp.c"
                    )] | length == 1)
                  )
                or
                  (
                    (.files | length == 2) and
                    ([.files[] | select(
                      .status == "modified" and
                      .filename == "arch/um/nommu/os-Linux/seccomp.c"
                    )] | length == 1) and
                    ([.files[] | select(
                      .status == "modified" and
                      .filename == "tools/testing/selftests/nommu/Makefile"
                    )] | length == 1)
                  )
                or
                  (
                    (.files | length == 3) and
                    ([.files[] | select(
                      .status == "modified" and
                      .filename == "arch/um/nommu/os-Linux/seccomp.c"
                    )] | length == 1) and
                    ([.files[] | select(
                      .status == "modified" and
                      .filename == "tools/testing/selftests/nommu/Makefile"
                    )] | length == 1) and
                    ([.files[] | select(
                      .status == "modified" and
                      .filename == "mm/nommu_swmmu.c"
                    )] | length == 1)
                  )
                or
                  (
                    (.files | length == 3) and
                    all(.files[];
                      .status == "modified" and
                      (
                        .filename == "arch/x86/um/nommu/zpoline.c" or
                        .filename == "mm/gup.c" or
                        .filename == "mm/nommu_swmmu.c"
                      )
                    )
                  )
                or
                  (
                    # The same kernel-only fixes plus async-signal-safe
                    # host termination; no plugin or userspace ABI changes.
                    (.files | length == 4) and
                    all(.files[];
                      .status == "modified" and
                      (
                        .filename == "arch/x86/um/nommu/zpoline.c" or
                        .filename == "mm/gup.c" or
                        .filename == "mm/nommu_swmmu.c" or
                        .filename == "arch/um/os-Linux/main.c"
                      )
                    )
                  )
                or
                  (
                    # Reviewed private-backing rewrite and its kernel-only
                    # declarations/tests/docs, plus the preceding fixes.
                    # No plugin, runtime or UAPI source is changed.
                    ((.files | length == 12) or (.files | length == 14) or
                     (.files | length == 19)) and
                    all(.files[];
                      if (.filename == "tools/testing/selftests/nommu/nommu_zpoline_test.c" or
                          .filename == "tools/testing/selftests/nommu/nommu_shared_file_test.c")
                      then .status == "added"
                      else .status == "modified" and
                        (
                          .filename == "Documentation/mm/swmmu.rst" or
                          .filename == "Documentation/mm/swmmu-kselftest-build.rst" or
                          .filename == "arch/um/kernel/physmem.c" or
                          .filename == "arch/um/include/asm/processor-generic.h" or
                          .filename == "arch/um/os-Linux/main.c" or
                          .filename == "arch/x86/um/nommu/do_syscall_64.c" or
                          .filename == "arch/x86/um/nommu/syscalls.h" or
                          .filename == "arch/x86/um/nommu/entry_64.S" or
                          .filename == "arch/x86/um/nommu/syscalls_64.c" or
                          .filename == "arch/x86/um/signal.c" or
                          .filename == "mm/nommu.c" or
                          .filename == "arch/x86/um/nommu/zpoline.c" or
                          .filename == "include/linux/nommu_swmmu.h" or
                          .filename == "mm/gup.c" or
                          .filename == "mm/nommu_swmmu.c" or
                          .filename == "mm/tests/nommu_swmmu_kunit.c" or
                          .filename == "tools/testing/selftests/nommu/Makefile"
                        )
                      end
                    )
                  )
                or
                  (
                    (.files | length == 6) and
                    all(.files[];
                      .status == "modified" and
                      (
                        .filename == "arch/um/include/shared/os.h" or
                        .filename == "arch/um/os-Linux/internal.h" or
                        .filename == "arch/x86/um/Kconfig" or
                        .filename == "arch/um/nommu/os-Linux/seccomp.c" or
                        .filename == "mm/nommu_swmmu.c" or
                        .filename == "tools/testing/selftests/nommu/Makefile"
                      )
                    )
                  )
                )
              ' <<<"$compare" >/dev/null; then
                compatible_tag=$candidate_tag
                compatible_kernel_sha=$candidate_kernel_sha
                break
              fi
            done <<<"$candidate_tags"

            [[ -n "$compatible_tag" ]] || {
              echo "No APK release with identical aports sources and a package-compatible kernel delta is available." >&2
              exit 1
            }
            echo "Reusing $compatible_tag: kernel delta is limited to trap.c, the SWMMU seccomp bound fix, plain-NOMMU SMP Kconfig/TLS guards, the selftest directory/build rules, or their exact recognized combinations, and aports SHA is unchanged."
            used_release_tag=$compatible_tag
            mkdir -p "$RUNNER_TEMP/apk-reuse"
            gh release download "$compatible_tag" --repo thehajime/aports \
              --pattern nommu-apks.tar.gz --dir "$RUNNER_TEMP/apk-reuse"
            mv "$RUNNER_TEMP/apk-reuse/nommu-apks.tar.gz" "$archive"
          else
            compatible_kernel_sha=$kernel_sha
          fi
          tar -xzf "$archive" -C "$RUNNER_TEMP/nommu-apks"
          test -s "$RUNNER_TEMP/nommu-apks/manifest.txt"
          archived_kernel_sha=$(sed -n 's/^kernel_commit=//p' "$RUNNER_TEMP/nommu-apks/manifest.txt")
          archived_aports_sha=$(sed -n 's/^aports_commit=//p' "$RUNNER_TEMP/nommu-apks/manifest.txt")
          [[ "$archived_kernel_sha" == "$compatible_kernel_sha" ]]
          [[ "$archived_aports_sha" == "$aports_sha" ]]
          printf 'release_tag=%s\n' "$used_release_tag" >> "$GITHUB_OUTPUT"
          printf 'kernel_sha=%s\n' "$kernel_sha" >> "$GITHUB_OUTPUT"
          printf 'aports_sha=%s\n' "$aports_sha" >> "$GITHUB_OUTPUT"
          printf 'apk_kernel_sha=%s\n' "$archived_kernel_sha" >> "$GITHUB_OUTPUT"
      - name: Upload signed NOMMU APK profiles and public key
        uses: actions/upload-artifact@v4
        with:
          name: aports-nommu-apks
          path: ${{ runner.temp }}/nommu-apks
          if-no-files-found: error

  build_uml:
    needs: [build_nommu_apks]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - displayTargetName: um-mmu(p)
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"
            kunit_opts: --kconfig_add CONFIG_KUNIT_UML_PCI=n ### XXX
            testname: um-mmu
            mode: um-mmu
            userspace_profile: alpine
            base_image: mirror.gcr.io/library/alpine:edge
          - displayTargetName: um-mmu-tt(s)
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"
            kunit_opts: --kconfig_add CONFIG_KUNIT_UML_PCI=n --kconfig_add CONFIG_RAID6_PQ_BENCHMARK=n --kconfig_add CONFIG_UML_TIME_TRAVEL_SUPPORT=y --kconfig_add CONFIG_UML_MAX_USERSPACE_ITERATIONS=100000 --kernel_args time-travel
            testname: um-mmu-tt
            mode: um-mmu
            userspace_profile: alpine
            base_image: mirror.gcr.io/library/alpine:edge
            runtime_opts: time-travel
          - displayTargetName: um-nommu-tt(s)
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"
            kunit_opts: --kconfig_add CONFIG_MMU=n --kconfig_add CONFIG_NOMMU_SWMMU=n --kconfig_add CONFIG_NOMMU_SWMMU_DEFAULT_ON=n --kconfig_add CONFIG_KUNIT_UML_PCI=n --kconfig_add CONFIG_RAID6_PQ_BENCHMARK=n --kconfig_add CONFIG_UML_TIME_TRAVEL_SUPPORT=y --kconfig_add CONFIG_UML_MAX_USERSPACE_ITERATIONS=100000 --kernel_args time-travel
            testname: um-nommu-tt
            mode: um-nommu
            userspace_profile: nommu-plain
            base_image: mirror.gcr.io/library/alpine:edge
            runtime_opts: time-travel
          - displayTargetName: um-nommu-sas(s)
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"
            kunit_opts: --kconfig_add CONFIG_MMU=n --kconfig_add CONFIG_NOMMU_SWMMU=n --kconfig_add CONFIG_NOMMU_SWMMU_DEFAULT_ON=n --kconfig_add CONFIG_KUNIT_UML_PCI=n --kconfig_add CONFIG_UML_NOMMU_SAS=y
            testname: um-nommu-plain-sas
            mode: um-nommu
            userspace_profile: nommu-plain
            base_image: mirror.gcr.io/library/alpine:edge
          - displayTargetName: um-nommu(p)
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"
            kunit_opts: --kconfig_add CONFIG_MMU=n --kconfig_add CONFIG_NOMMU_SWMMU=n --kconfig_add CONFIG_NOMMU_SWMMU_DEFAULT_ON=n --kconfig_add CONFIG_KUNIT_UML_PCI=n
            testname: um-nommu
            mode: um-nommu
            userspace_profile: nommu-plain
            base_image: mirror.gcr.io/library/alpine:edge
          - displayTargetName: um-nommu-sas-swmmu(s)
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"
            kunit_opts: --kconfig_add CONFIG_MMU=n --kconfig_add CONFIG_KUNIT_UML_PCI=n --kconfig_add CONFIG_UML_NOMMU_SAS=y
            testname: um-nommu-sas
            mode: um-nommu
            userspace_profile: nommu-swmmu
            base_image: mirror.gcr.io/library/alpine:edge
    name: "UML: build (${{ matrix.displayTargetName }})"
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1

    defaults:
       run:
         shell: ${{ matrix.shell }}

    steps:
      - name: Set env
        shell: bash
        run: |
          printf '%s\n' \
            /usr/lib/ccache/bin \
            /usr/lib/ccache \
            "${GITHUB_WORKSPACE}/bin" >> "$GITHUB_PATH"
          echo "export PATH=/usr/lib/ccache/bin:/usr/lib/ccache:${{ github.workspace }}/bin:$PATH" >> $HOME/.bashrc
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build_nommu_apks.outputs.kernel_sha }}
      - name: Checkout canonical CI support files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: ci-config
          sparse-checkout: .github/workflows
      - name: Install canonical CI support files
        run: |
          mkdir -p .github/workflows
          cp -a ci-config/.github/workflows/. .github/workflows/
      - name: Download signed NOMMU APKs
        uses: actions/download-artifact@v4
        with:
          name: aports-nommu-apks
          path: .github/workflows/aports-artifacts
      - uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.testname }}-ccache-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-${{ matrix.testname }}-ccache-build-
      - name: Install packages
        run: |
          sudo apt update -y
          sudo apt install -y ccache iperf3 netperf libcap-dev libcap-ng-dev libmnl-dev libmbedtls-dev liburing-dev libnuma-dev
      - name: Verify compiler cache wrapper
        run: |
          compiler=$(command -v gcc)
          echo "gcc resolves to: $compiler"
          case "$compiler" in
            /usr/lib/ccache/*) ;;
            *) echo "gcc is not routed through the ccache wrapper" >&2; exit 1 ;;
          esac
          ccache --zero-stats
      - name: Prepare pinned Alpine apk.static from the official CDN
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/apk-tools-static.apk"
          install_dir="$RUNNER_TEMP/alpine-apk"
          curl --fail --location --retry 3 --retry-all-errors \
            https://dl-cdn.alpinelinux.org/alpine/v3.22/main/x86_64/apk-tools-static-2.14.12-r0.apk \
            --output "$package"
          echo 'f44523ae4ded143b3d85e16be4bf7ff386fc052406c3b22f87f045efb0aa4305  '"$package" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$package" -C "$install_dir" sbin/apk.static
          install -m 0755 "$install_dir/sbin/apk.static" "$RUNNER_TEMP/apk"
      - name: Setup latest Alpine Linux
        uses: jirutka/setup-alpine@v1
        with:
           apk-tools-url: https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.12/x86_64/apk.static#!sha256!034d28bbf3d97d90fd76e572ab8ae74a038da0e7593e9d412eabccf69ccd3553
           branch: edge
           packages: >
             alpine-sdk
             gmp-dev
             mpfr-dev
             mpc1-dev
             doas
             libtirpc-dev
             linux-headers
             autoconf
             automake
             bash
             bison
             flex
             bc
             numactl-dev
             libcap-dev
             rsync
             coreutils
             ccache
             liburing-dev
             git
             libcap-ng-dev
             iproute2
      - name: build bench tools
        run: |
          git clone --depth 1 --branch "$LMBENCH_REF" https://github.com/thehajime/lmbench-NoMMU.git lmbench
          patch --forward --fuzz=0 -d lmbench -p1 < .github/workflows/patches/lmbench-lat-udp-signal-handler.patch
          git clone https://github.com/HewlettPackard/netperf
          patch --forward --fuzz=0 -d netperf -p1 < .github/workflows/patches/netperf-portable-cpu-affinity.patch
          cat > "$RUNNER_TEMP/lmbench-gcc" <<'EOF'
          #!/bin/sh
          exec gcc "$@" -ltirpc
          EOF
          chmod +x "$RUNNER_TEMP/lmbench-gcc"
          lmbench_bin="$GITHUB_WORKSPACE/lmbench/bin/x86_64-linux-gnulibc1"
          mkdir -p "$lmbench_bin"
          lmbench_cflags="-O2 -std=gnu17 -D_GNU_SOURCE -DHAVE_socklen_t -I/usr/include/tirpc -include string.h"
          if [[ "${{ matrix.userspace_profile }}" == nommu-plain ]]; then
            # benchmp itself needs CLONE_VM on kernels without private fork;
            # selecting lat_proc --vfork only changes the measured operation.
            lmbench_cflags="$lmbench_cflags -DCONFIG_NOMMU"
          fi
          if printf '#include <stdio.h>\nint main(void) { off64_t n = 0; return (int)n; }\n' | \
            gcc -D_GNU_SOURCE -x c -fsyntax-only - >/dev/null 2>&1; then
            lmbench_cflags="$lmbench_cflags -DHAVE_off64_t"
          fi
          make -C lmbench/src OS=Linux CC="$RUNNER_TEMP/lmbench-gcc" \
            O="$lmbench_bin" BINDIR="$lmbench_bin" \
            CFLAGS="$lmbench_cflags"
          cd netperf
          sh autogen.sh
          ./configure && make -C src CFLAGS="-O2 -fcommon -D_GNU_SOURCE -std=gnu17"
          cd ..
          make -C .github/workflows/ MASTER_CC=gcc
        shell: alpine.sh {0}
      # --root {0}
      - name: Setup faketty
        uses: Yuri6037/Action-FakeTTY@v1.1
      - name: setup tap interface
        run: |
           set -x
           sudo ip tuntap add dev tap100 mode tap user ${USER}
           sudo ip add add 192.168.122.1/24 dev tap100
           sudo ip link set up dev tap100
           iperf3 -s &
      - name: (FIXME) defconfig rewrite for nommu
        if: matrix.testname == 'um-nommu' || matrix.testname == 'um-nommu-tt'
        run: |
          echo "# CONFIG_MMU is not set" >> arch/um/configs/x86_64_defconfig
          echo "# CONFIG_NOMMU_SWMMU_DEFAULT_ON is not set" >> arch/um/configs/x86_64_defconfig
      - name: (FIXME) defconfig rewrite for plain nommu-sas
        if: matrix.testname == 'um-nommu-plain-sas'
        run: |
          echo "# CONFIG_MMU is not set" >> arch/um/configs/x86_64_defconfig
          echo "# CONFIG_NOMMU_SWMMU_DEFAULT_ON is not set" >> arch/um/configs/x86_64_defconfig
          echo "CONFIG_UML_NOMMU_SAS=y" >> arch/um/configs/x86_64_defconfig
      - name: (FIXME) defconfig rewrite for nommu-sas
        if: matrix.testname == 'um-nommu-sas'
        run: |
          echo "# CONFIG_MMU is not set" >> arch/um/configs/x86_64_defconfig
          echo "CONFIG_UML_NOMMU_SAS=y" >> arch/um/configs/x86_64_defconfig
      - name: build-0 (static)
        run: |
          cat .github/workflows/ltp-kernel.config >> arch/um/configs/${{ matrix.defconfig }}
          make ARCH=um ${{ matrix.defconfig }} O=build
          for option in CONFIG_BLK_DEV_LOOP CONFIG_IKCONFIG CONFIG_IKCONFIG_PROC \
                        CONFIG_EXT4_FS CONFIG_KEYS CONFIG_FANOTIFY \
                        CONFIG_FANOTIFY_ACCESS_PERMISSIONS CONFIG_PID_NS CONFIG_USER_NS; do
            grep -q "^${option}=y$" build/.config || {
              echo "Required LTP kernel option ${option}=y is missing" >&2
              exit 1
            }
          done
          if [[ "${{ matrix.testname }}" == "um-nommu" || \
                "${{ matrix.testname }}" == "um-nommu-tt" || \
                "${{ matrix.testname }}" == "um-nommu-plain-sas" ]]; then
            scripts/config --file build/.config --disable NOMMU_SWMMU_DEFAULT_ON
            scripts/config --file build/.config --disable NOMMU_SWMMU
            make ARCH=um O=build olddefconfig
            ! grep -q '^CONFIG_NOMMU_SWMMU_DEFAULT_ON=y$' build/.config
            ! grep -q '^CONFIG_NOMMU_SWMMU=y$' build/.config
            ! grep -q '^CONFIG_GCC_PLUGIN_SWMMU=y$' build/.config
            if [[ "${{ matrix.testname }}" == "um-nommu" ]]; then
              scripts/config --file build/.config --enable SMP --set-val NR_CPUS 4
              make ARCH=um O=build olddefconfig
              grep -q '^CONFIG_SMP=y$' build/.config
              grep -q '^CONFIG_NR_CPUS=4$' build/.config
            fi
            if [[ "${{ matrix.testname }}" == "um-nommu-plain-sas" ]]; then
              grep -q '^CONFIG_UML_NOMMU_SAS=y$' build/.config
            fi
          elif [[ "${{ matrix.testname }}" == "um-nommu-sas" ]]; then
            scripts/config --file build/.config --enable NOMMU_SWMMU
            scripts/config --file build/.config --enable NOMMU_SWMMU_DEFAULT_ON
            scripts/config --file build/.config --enable UML_NOMMU_SAS
            make ARCH=um O=build olddefconfig
            grep -q '^CONFIG_NOMMU_SWMMU=y$' build/.config
            grep -q '^CONFIG_UML_NOMMU_SAS=y$' build/.config
          elif [[ "${{ matrix.testname }}" == "um-mmu" ]]; then
            scripts/config --file build/.config --enable SMP --set-val NR_CPUS 4
            make ARCH=um O=build olddefconfig
            grep -q '^CONFIG_SMP=y$' build/.config
            grep -q '^CONFIG_NR_CPUS=4$' build/.config
          fi
          if [[ "${{ matrix.testname }}" == *-tt ]]; then
            scripts/config --file build/.config --disable SMP \
              --disable RAID6_PQ_BENCHMARK \
              --enable UML_TIME_TRAVEL_SUPPORT \
              --set-val UML_MAX_USERSPACE_ITERATIONS 100000
            make ARCH=um O=build olddefconfig
            grep -q '^CONFIG_UML_TIME_TRAVEL_SUPPORT=y$' build/.config
            grep -q '^CONFIG_UML_MAX_USERSPACE_ITERATIONS=100000$' build/.config
            ! grep -q '^CONFIG_SMP=y$' build/.config
            ! grep -q '^CONFIG_RAID6_PQ_BENCHMARK=y$' build/.config
          fi
          cat build/.config | sed "s/.*CONFIG_STATIC_LINK.*/CONFIG_STATIC_LINK=y/" > /tmp/a; mv /tmp/a build/.config
          make -j8 ARCH=um O=build ${{ matrix.add_configs }}
      - name: Report ccache statistics after build-0
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          else
            echo "ccache statistics unavailable: setup did not complete"
          fi
      - name: prep for docker build
        run: |
           make -j8 ARCH=um O=build modules_install INSTALL_MOD_PATH=`pwd`/.github/workflows
           cp build/vmlinux .github/workflows/
           cp -rpf lmbench .github/workflows/
           cp netperf/src/netperf .github/workflows/
           ls .github/workflows/
           ls .github/workflows/lib/modules
      - name: Build and push Docker image (no push)
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .github/workflows
          build-args: |
            MODE=${{ matrix.mode }}
            USERSPACE_PROFILE=${{ matrix.userspace_profile }}
            BASE_IMAGE=${{ matrix.base_image }}
          push: false
          load: true
          tags: |
            uml-ci/alpine:edge-${{ matrix.testname }}
      - name: Save tested UML image for downstream jobs
        run: docker save uml-ci/alpine:edge-${{ matrix.testname }} -o "$RUNNER_TEMP/uml-image.tar"
      - name: Upload tested UML image
        uses: actions/upload-artifact@v4
        with:
          name: uml-docker-image-${{ matrix.testname }}
          path: ${{ runner.temp }}/uml-image.tar
          if-no-files-found: error
      - name: image for test
        run: |
          docker create --name alpine-nommu uml-ci/alpine:edge-${{ matrix.testname }}
          docker start alpine-nommu
          docker wait alpine-nommu
          docker logs alpine-nommu
          docker export alpine-nommu > alpine.tar
          docker rm alpine-nommu
          mnt=$(mktemp -d)
          dd if=/dev/zero of=alpine.ext4 bs=1 count=0 seek=1G
          sudo chmod og+wr "alpine.ext4"
          yes 2>/dev/null | mkfs.ext4 "alpine.ext4" || true
          sudo mount "alpine.ext4" $mnt
          sudo tar -xf alpine.tar -C $mnt
          sudo umount $mnt
          mkdir -p rootfs
          sudo tar -xf alpine.tar -C rootfs
          sudo chown -R ${USER} rootfs
      - name: test-0 (static)
        run: |
          sudo sh -c "echo 0 > /proc/sys/vm/mmap_min_addr"
          set +e
          timeout --signal=TERM 30s faketty ./build/vmlinux vec0:transport=tap,ifname=tap100,depth=128,gro=1 ubd0=./alpine.ext4 rw mem=2048m loglevel=8 console=tty ${{ matrix.runtime_opts }} init=/sbin/init 2>&1 | tee /tmp/log.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [[ $rc -ne 0 && $rc -ne 124 && $rc -ne 143 ]]; then exit "$rc"; fi
          if [[ "${{ matrix.testname }}" == "um-nommu" || \
                "${{ matrix.testname }}" == "um-nommu-tt" || \
                "${{ matrix.testname }}" == "um-nommu-plain-sas" ]]; then
            grep -q 'NOMMU_USERSPACE_READY' /tmp/log.txt
          fi
          echo "========="
          cat /tmp/log.txt
      - name: kunit test
        run: |
          mkdir -p output/kunit
          for config in `find . -path './ci-config' -prune -o -name .kunitconfig -print | grep -v -E "kfence|sunrpc|handshake|kcsan|gpu|damon|rust|android|sound|hid|firewire|iommu|nvme|mac80211|irqchip|spi" `; do \
            echo "==" $config "==" ; \
            result_name=$(printf '%s' "$config" | sed 's#[^A-Za-z0-9._-]#_#g'); \
            ./tools/testing/kunit/kunit.py run --json="output/kunit/kunit-${{ matrix.testname }}-${result_name}.json" --kunitconfig="$config" ${{ matrix.kunit_opts }}
          done
      - name: Upload KUnit result data
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: kunit-results-${{ matrix.testname }}
          path: output/kunit/*.json
          if-no-files-found: warn
      - name: build-1
        run: |
          cat .github/workflows/ltp-kernel.config >> arch/um/configs/${{ matrix.defconfig }}
          make ARCH=um ${{ matrix.defconfig }}
          for option in CONFIG_BLK_DEV_LOOP CONFIG_IKCONFIG CONFIG_IKCONFIG_PROC \
                        CONFIG_EXT4_FS CONFIG_KEYS CONFIG_FANOTIFY \
                        CONFIG_FANOTIFY_ACCESS_PERMISSIONS CONFIG_PID_NS CONFIG_USER_NS; do
            grep -q "^${option}=y$" .config || {
              echo "Required LTP kernel option ${option}=y is missing" >&2
              exit 1
            }
          done
          if [[ "${{ matrix.testname }}" == "um-nommu" || \
                "${{ matrix.testname }}" == "um-nommu-tt" || \
                "${{ matrix.testname }}" == "um-nommu-plain-sas" ]]; then
            scripts/config --disable NOMMU_SWMMU_DEFAULT_ON --disable NOMMU_SWMMU
            make ARCH=um olddefconfig
            ! grep -q '^CONFIG_NOMMU_SWMMU_DEFAULT_ON=y$' .config
            ! grep -q '^CONFIG_NOMMU_SWMMU=y$' .config
            ! grep -q '^CONFIG_GCC_PLUGIN_SWMMU=y$' .config
            if [[ "${{ matrix.testname }}" == "um-nommu" ]]; then
              scripts/config --enable SMP --set-val NR_CPUS 4
              make ARCH=um olddefconfig
              grep -q '^CONFIG_SMP=y$' .config
              grep -q '^CONFIG_NR_CPUS=4$' .config
            fi
            if [[ "${{ matrix.testname }}" == "um-nommu-plain-sas" ]]; then
              grep -q '^CONFIG_UML_NOMMU_SAS=y$' .config
            fi
          elif [[ "${{ matrix.testname }}" == "um-nommu-sas" ]]; then
            scripts/config --enable NOMMU_SWMMU --enable NOMMU_SWMMU_DEFAULT_ON --enable UML_NOMMU_SAS
            make ARCH=um olddefconfig
            grep -q '^CONFIG_NOMMU_SWMMU=y$' .config
            grep -q '^CONFIG_UML_NOMMU_SAS=y$' .config
          elif [[ "${{ matrix.testname }}" == "um-mmu" ]]; then
            scripts/config --enable SMP --set-val NR_CPUS 4
            make ARCH=um olddefconfig
            grep -q '^CONFIG_SMP=y$' .config
            grep -q '^CONFIG_NR_CPUS=4$' .config
          fi
          if [[ "${{ matrix.testname }}" == *-tt ]]; then
            scripts/config --disable SMP \
              --disable RAID6_PQ_BENCHMARK \
              --enable UML_TIME_TRAVEL_SUPPORT \
              --set-val UML_MAX_USERSPACE_ITERATIONS 100000
            make ARCH=um olddefconfig
            grep -q '^CONFIG_UML_TIME_TRAVEL_SUPPORT=y$' .config
            grep -q '^CONFIG_UML_MAX_USERSPACE_ITERATIONS=100000$' .config
            ! grep -q '^CONFIG_SMP=y$' .config
            ! grep -q '^CONFIG_RAID6_PQ_BENCHMARK=y$' .config
          fi
          make -j8 ARCH=um ${{ matrix.add_configs }}
      - name: Install UML UAPI headers for SWMMU kselftest
        if: matrix.testname == 'um-nommu-sas'
        run: |
          mkdir -p build/kselftest/uapi output/kselftest rootfs/tests
          make ARCH=um INSTALL_HDR_PATH=build/kselftest/uapi headers_install
      - name: Build NOMMU regression selftests
        if: matrix.testname == 'um-nommu-sas'
        shell: alpine.sh {0}
        run: |
          make -C tools/testing/selftests/nommu \
            OUTPUT="$GITHUB_WORKSPACE/build/kselftest" \
            SWMMU_SRCTREE="$GITHUB_WORKSPACE" \
            SWMMU_BUILD_PLUGIN=1 \
            SWMMU_PLUGIN="$GITHUB_WORKSPACE/build/kselftest/swmmu_plugin.so" \
            SWMMU_ALL_ACCESS=1 \
            SWMMU_HOSTCXX=g++ \
            KHDR_INCLUDES="-isystem $GITHUB_WORKSPACE/build/kselftest/uapi/include" \
            USERCFLAGS="-O2 -fPIE -include sys/prctl.h" \
            USERLDFLAGS="-static-pie -Wl,--no-relax" \
            all
      - name: Stage NOMMU kselftest init and binaries
        if: matrix.testname == 'um-nommu-sas'
        run: |
          install -m 0755 build/kselftest/nommu_swmmu_test rootfs/tests/nommu_swmmu_test
          for test in nommu_zpoline_test nommu_shared_file_test; do
            if [ -x "build/kselftest/$test" ]; then
              install -m 0755 "build/kselftest/$test" "rootfs/tests/$test"
            fi
          done
          install -m 0755 .github/workflows/swmmu-kselftest-init.sh \
            rootfs/sbin/swmmu-kselftest-init
      - name: Run NOMMU kselftests in both zpoline modes
        if: matrix.testname == 'um-nommu-sas'
        run: |
          mkdir -p output/kselftest
          for mode in 0 1; do
            set +e
            timeout --signal=TERM --kill-after=5s 120s faketty ./vmlinux \
              root=/dev/root rootflags="$GITHUB_WORKSPACE/rootfs" rootfstype=hostfs rw \
              mem=2048m loglevel=8 console=tty zpoline="$mode" \
              init=/sbin/swmmu-kselftest-init 2>&1 | \
              tee "output/kselftest/uml-console-z$mode.log"
            rc=${PIPESTATUS[0]}
            set -e
            printf 'uml_exit=%s\n' "$rc" > "output/kselftest/uml-z$mode.exit"
            for test in nommu_swmmu_test nommu_zpoline_test nommu_shared_file_test; do
              [ -x "rootfs/tests/$test" ] || continue
              cp "rootfs/tests/$test-z$mode.tap" "rootfs/tests/$test-z$mode.exit" output/kselftest/
              cat "rootfs/tests/$test-z$mode.tap"
              grep -qx '0' "rootfs/tests/$test-z$mode.exit"
              grep -q '^# Totals: pass:' "rootfs/tests/$test-z$mode.tap"
              ! grep -q '^not ok ' "rootfs/tests/$test-z$mode.tap"
            done
            test "$rc" -eq 0
            grep -q 'Power down' "output/kselftest/uml-console-z$mode.log"
          done
      - name: Upload direct SWMMU kselftest diagnostics
        if: ${{ always() && matrix.testname == 'um-nommu-sas' }}
        uses: actions/upload-artifact@v7
        with:
          name: swmmu-kselftest-${{ matrix.testname }}
          path: |
            output/kselftest
            rootfs/tests/*.tap
            rootfs/tests/*.exit
          if-no-files-found: warn
      - name: test-1
        run: |
          set +e
          timeout --signal=TERM 30s faketty ./vmlinux vec0:transport=tap,ifname=tap100,depth=128,gro=1 ubd0=./alpine.ext4 rw mem=2048m loglevel=8 console=tty ${{ matrix.runtime_opts }} init=/sbin/init 2>&1 | tee /tmp/log.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [[ $rc -ne 0 && $rc -ne 124 && $rc -ne 143 ]]; then exit "$rc"; fi
          if [[ "${{ matrix.testname }}" == "um-nommu" ]]; then
            grep -q 'NOMMU_USERSPACE_READY' /tmp/log.txt
          fi
          echo "========="
          cat /tmp/log.txt
      - name: Pack tested image context
        run: tar -czf "$RUNNER_TEMP/uml-image-context.tar.gz" -C .github/workflows .
      - name: Upload tested image context
        uses: actions/upload-artifact@v4
        with:
          name: uml-image-context-${{ matrix.testname }}
          path: ${{ runner.temp }}/uml-image-context.tar.gz
          if-no-files-found: error

  publish_uml_images:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images
    needs: [build_uml]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - testname: um-mmu
            mode: um-mmu
            userspace_profile: alpine
            base_tag: edge
          - testname: um-nommu
            mode: um-nommu
            userspace_profile: nommu-plain
            base_tag: edge
          - testname: um-nommu-sas
            mode: um-nommu
            userspace_profile: nommu-swmmu
            base_tag: edge
    steps:
      - name: Download tested image context
        uses: actions/download-artifact@v4
        with:
          name: uml-image-context-${{ matrix.testname }}
          path: ${{ runner.temp }}/image-context
      - name: Extract tested image context
        run: mkdir image-context && tar -xzf "$RUNNER_TEMP/image-context/uml-image-context.tar.gz" -C image-context
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested UML image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: image-context
          build-args: |
            MODE=${{ matrix.mode }}
            USERSPACE_PROFILE=${{ matrix.userspace_profile }}
            BASE_IMAGE=mirror.gcr.io/library/alpine:${{ matrix.base_tag }}
          push: true
          tags: ghcr.io/thehajime/alpine:${{ matrix.base_tag }}-${{ matrix.testname }}

  build_nginx_rootfs:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Build shared nginx rootfs images once
    needs: [build_nommu_apks]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out CI support files
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/workflows
      - name: Download the signed SWMMU APK package set
        uses: actions/download-artifact@v4
        with:
          name: aports-nommu-apks
          path: ${{ github.workspace }}/.swmmu-nginx/aport-artifacts
      - name: Prepare pinned Alpine apk.static from the official CDN
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/apk-tools-static.apk"
          install_dir="$RUNNER_TEMP/alpine-apk"
          curl --fail --location --retry 3 --retry-all-errors \
            https://dl-cdn.alpinelinux.org/alpine/v3.22/main/x86_64/apk-tools-static-2.14.12-r0.apk \
            --output "$package"
          echo 'f44523ae4ded143b3d85e16be4bf7ff386fc052406c3b22f87f045efb0aa4305  '"$package" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$package" -C "$install_dir" sbin/apk.static
          install -m 0755 "$install_dir/sbin/apk.static" "$RUNNER_TEMP/apk"
      - name: Set up minimal Alpine rootfs tooling
        uses: jirutka/setup-alpine@v1
        with:
          apk-tools-url: https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.12/x86_64/apk.static#!sha256!034d28bbf3d97d90fd76e572ab8ae74a038da0e7593e9d412eabccf69ccd3553
          branch: edge
          packages: >
            bash
            ca-certificates
            coreutils
            openssl
            tar
      - name: Assemble one shared guest rootfs from signed SWMMU APKs
        shell: alpine.sh --root {0}
        env:
          SWMMU_APK_DIR: ${{ github.workspace }}/.swmmu-nginx/aport-artifacts
          SWMMU_KERNEL_SHA: ${{ needs.build_nommu_apks.outputs.kernel_sha }}
          SWMMU_APK_KERNEL_SHA: ${{ needs.build_nommu_apks.outputs.apk_kernel_sha }}
          SWMMU_APORTS_SHA: ${{ needs.build_nommu_apks.outputs.aports_sha }}
          SWMMU_INIT_SCRIPT: ${{ github.workspace }}/.github/workflows/swmmu-nginx-init.sh
          SWMMU_WORK: ${{ github.workspace }}/.swmmu-nginx
        run: |
          set +e
          mkdir -p "$SWMMU_WORK/logs"
          bash "$GITHUB_WORKSPACE/.github/workflows/build-swmmu-nginx-rootfs.sh" \
            > "$SWMMU_WORK/logs/rootfs-build.log" 2>&1
          build_status=$?
          cat "$SWMMU_WORK/logs/rootfs-build.log"
          exit "$build_status"
      - name: Assemble shared MMU and plain NOMMU nginx rootfses
        shell: alpine.sh --root {0}
        env:
          NGINX_APK_DIR: ${{ github.workspace }}/.swmmu-nginx/aport-artifacts
          NGINX_INIT_SCRIPT: ${{ github.workspace }}/.github/workflows/nginx-matrix-init.sh
          NGINX_WORK: ${{ github.workspace }}/.nginx-rootfs
          NGINX_KERNEL_SHA: ${{ needs.build_nommu_apks.outputs.kernel_sha }}
          NGINX_APORTS_SHA: ${{ needs.build_nommu_apks.outputs.aports_sha }}
        run: |
          set -euo pipefail
          for profile in mmu nommu; do
            NGINX_PROFILE="$profile" NGINX_WORK="$NGINX_WORK/$profile" \
              bash "$GITHUB_WORKSPACE/.github/workflows/build-generic-nginx-rootfs.sh"
          done
      - name: Restore runner ownership of SWMMU rootfs files
        if: always()
        run: |
          if [ -d .swmmu-nginx ]; then
            sudo chown -R "$(id -u):$(id -g)" .swmmu-nginx
          fi
          if [ -d .nginx-rootfs ]; then
            sudo chown -R "$(id -u):$(id -g)" .nginx-rootfs
          fi
      - name: Upload shared rootfs, signed APKs, and manifest
        uses: actions/upload-artifact@v4
        with:
          name: nginx-rootfs-sas
          path: .swmmu-nginx/artifact
          if-no-files-found: error
      - name: Upload shared MMU nginx rootfs
        uses: actions/upload-artifact@v4
        with:
          name: nginx-rootfs-mmu
          path: .nginx-rootfs/mmu/artifact
          if-no-files-found: error
      - name: Upload shared plain NOMMU nginx rootfs
        uses: actions/upload-artifact@v4
        with:
          name: nginx-rootfs-nommu
          path: .nginx-rootfs/nommu/artifact
          if-no-files-found: error
      - name: Upload rootfs build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-sas-rootfs-diagnostics
          path: .swmmu-nginx/logs
          if-no-files-found: warn

  # Keep one reusable-workflow call in the graph; the callee owns the matrix.
  nginx_benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "nginx benchmark"
    needs: [build_uml, build_nginx_rootfs]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/nginx-benchmark.yml

  native_nginx_benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "native nginx benchmark"
    permissions:
      contents: read
    uses: ./.github/workflows/native-nginx-benchmark.yml
  benchmark:
    runs-on: ${{ matrix.runs_on }}
    needs: [build_uml]
    strategy:
      fail-fast: false
      matrix:
        include:
          - displayTargetName: um-mmu(p)
            image_name: um-mmu
            testname: um-mmu
            vmlinux_opt: ""
            runs_on: ubuntu-22.04
          - displayTargetName: um-mmu(s)
            image_name: um-mmu
            testname: um-mmu-seccomp
            vmlinux_opt: "seccomp=on"
            runs_on: ubuntu-22.04
          - displayTargetName: um-mmu-tt(s)
            image_name: um-mmu-tt
            testname: um-mmu-tt-seccomp
            vmlinux_opt: "time-travel seccomp=on"
            runs_on: ubuntu-22.04
          - displayTargetName: um-nommu(p)
            image_name: um-nommu
            testname: um-nommu
            vmlinux_opt: ""
            runs_on: ubuntu-22.04
            base_tag: edge
          - displayTargetName: um-nommu(s)
            image_name: um-nommu
            testname: um-nommu-seccomp
            vmlinux_opt: "seccomp=on"
            runs_on: ubuntu-22.04
            base_tag: edge
          - displayTargetName: um-nommu-tt(s)
            image_name: um-nommu-tt
            testname: um-nommu-tt-seccomp
            vmlinux_opt: "time-travel seccomp=on"
            runs_on: ubuntu-22.04
            base_tag: edge
          - displayTargetName: um-nommu-sas(s)
            image_name: um-nommu-plain-sas
            testname: um-nommu-plain-sas
            vmlinux_opt: "seccomp=on"
            runs_on: ubuntu-22.04
            base_tag: edge
          - displayTargetName: um-nommu-sas(z)
            image_name: um-nommu-plain-sas
            testname: um-nommu-plain-sas-zpoline
            vmlinux_opt: "zpoline=1"
            runs_on: ubuntu-22.04
            base_tag: edge
          - displayTargetName: um-nommu-sas-swmmu(s)
            image_name: um-nommu-sas
            testname: um-nommu-sas-seccomp
            vmlinux_opt: "zpoline=0 swmmu_direct=1"
            runs_on: ubuntu-22.04
            base_tag: edge
          - displayTargetName: um-nommu-sas-swmmu(z)
            image_name: um-nommu-sas
            testname: um-nommu-sas-zpoline
            vmlinux_opt: "zpoline=1 swmmu_direct=1"
            runs_on: ubuntu-22.04
            base_tag: edge
    name: "UML: bench (${{ matrix.displayTargetName }}) "
    timeout-minutes: 100
    steps:
      - name: Check out CI benchmark helpers
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/workflows
      - name: Download tested UML image
        uses: actions/download-artifact@v4
        with:
          name: uml-docker-image-${{ matrix.image_name }}
          path: ${{ runner.temp }}/uml-image
      - name: Load tested UML image
        run: docker load -i "$RUNNER_TEMP/uml-image/uml-image.tar"
      - name: Setup faketty
        uses: Yuri6037/Action-FakeTTY@v1.1
      - name: setup iperf3/netperf server
        run: |
           set -x
           sudo apt update -y
           sudo apt install -y iperf3 netperf tcpdump
           if ! ss -ltnH 'sport = :12865' | grep -q LISTEN; then
             sudo service netperf start || true
           fi
           if ! ss -ltnH 'sport = :12865' | grep -q LISTEN; then
             sudo netserver -4 -p 12865
           fi
           for attempt in {1..10}; do
             ss -ltnH 'sport = :12865' | grep -q LISTEN && break
             sleep 1
           done
           if ! ss -ltnH 'sport = :12865' | grep -q LISTEN; then
             echo "netserver did not open TCP port 12865" >&2
             sudo ss -ltnp 'sport = :12865' || true
             exit 1
           fi
           if ! ss -ltnH 'sport = :5201' | grep -q LISTEN; then
             iperf3 -s -D
           fi
           ip ad
           ps aux |grep netserver
           ps aux |grep iperf3
           cat /proc/sys/kernel/exec-shield || true
           echo 0 > /proc/sys/kernel/exec-shield || true
      - name: benchmark-1
        continue-on-error: true
        run: |
           set -uo pipefail
           mkdir -p output
           sudo sh -c "echo 0 > /proc/sys/vm/mmap_min_addr"
           docker_caps=()
           if [[ "${{ matrix.vmlinux_opt }}" == *zpoline=1* ]]; then
             docker_caps+=(--cap-add SYS_RAWIO)
           fi
           container_name=uml-benchmark-1-${{ matrix.testname }}
           if bash .github/workflows/run-uml-benchmark-container.sh \
             "$container_name" "output/${{ matrix.testname }}.dat" \
             faketty docker run "${docker_caps[@]}" --name "$container_name" --rm \
               -it -v /dev/shm:/dev/shm --entrypoint /root/vmlinux \
               uml-ci/alpine:edge-${{ matrix.image_name }} mem=2G \
               root=/dev/root rootflags=/ rootfstype=hostfs rw loglevel=8 \
               ${{ matrix.vmlinux_opt }} init=/bench.sh; then
             benchmark1_status=0
           else
             benchmark1_status=$?
           fi
           printf '%s\n' "$benchmark1_status" > "output/${{ matrix.testname }}-benchmark-1.status"
           exit "$benchmark1_status"
      - name: benchmark-2
        # Run network benchmarks for all profiles on a full manual dispatch.
        if: ${{ !cancelled() && (success() || github.event_name == 'workflow_dispatch') }}
        run: |
           set -o pipefail
           mkdir -p output
           netperf_log="output/${{ matrix.testname }}-iperf3.dat"
           netperf_pcap="output/${{ matrix.testname }}-64-TCP_STREAM.pcap"
           netperf_pcap_text="output/${{ matrix.testname }}-64-TCP_STREAM-packets.txt"
           netperf_pcap_log="output/${{ matrix.testname }}-64-TCP_STREAM-tcpdump.log"
           netperf_pcap_status="output/${{ matrix.testname }}-64-TCP_STREAM-pcap.status"
           netperf_pcap_pid="output/${{ matrix.testname }}-64-TCP_STREAM-tcpdump.pid"
           ## dynamic build failed at iperf -R
           echo "===========================non-static build may fail...==========================="
           docker_caps=()
           if [[ "${{ matrix.vmlinux_opt }}" == *zpoline=1* ]]; then
             docker_caps+=(--cap-add SYS_RAWIO)
           fi
           #faketty ./vmlinux vec0:transport=raw,ifname=eth0,depth=128,gro=1 mem=2048m \
           #  root=/dev/root rootflags=`pwd`/rootfs rootfstype=hostfs rw \
           #  loglevel=8 console=tty init=/root/iperf3.sh \
           #  | tee output/${{ matrix.testname }}-seccomp-iperf3.dat
           container_name=uml-benchmark-2-${{ matrix.testname }}
           bash .github/workflows/run-uml-benchmark-container.sh \
              "$container_name" "$netperf_log" \
              faketty docker run "${docker_caps[@]}" --name "$container_name" --rm \
                -it -v /dev/shm:/dev/shm --entrypoint /root/vmlinux \
                uml-ci/alpine:edge-${{ matrix.image_name }} mem=2G \
                vec0:transport=raw,ifname=eth0,depth=128,gro=1 \
                root=/dev/root rootflags=/ rootfstype=hostfs rw loglevel=8 \
                ${{ matrix.vmlinux_opt }} \
                init=/root/iperf3.sh &
           bench_pid=$!
           if [[ "${{ startsWith(matrix.testname, 'um-nommu-sas-') }}" == true ]]; then
             printf 'WAITING_FOR_64_TCP_STREAM\n' >"$netperf_pcap_status"
           else
             printf 'SKIP\n' >"$netperf_pcap_status"
           fi
           (
             capture_pid=
             capture_launcher_pid=
             capture_attempted=0
             stop_capture() {
               if [[ -n "$capture_pid" ]]; then
                 sudo kill -INT "$capture_pid" 2>/dev/null || true
                 for _ in {1..50}; do
                   sudo kill -0 "$capture_pid" 2>/dev/null || break
                   sleep 0.1
                 done
                 if sudo kill -0 "$capture_pid" 2>/dev/null; then
                   printf 'FAIL: tcpdump did not stop after SIGINT; sending SIGTERM\n' >>"$netperf_pcap_log"
                   sudo kill -TERM "$capture_pid" 2>/dev/null || true
                   for _ in {1..20}; do
                     sudo kill -0 "$capture_pid" 2>/dev/null || break
                     sleep 0.1
                   done
                 fi
                 if sudo kill -0 "$capture_pid" 2>/dev/null; then
                   printf 'FAIL: tcpdump did not stop after SIGTERM; sending SIGKILL\n' >>"$netperf_pcap_log"
                   sudo kill -KILL "$capture_pid" 2>/dev/null || true
                 fi
                 capture_pid=
                 if [[ -n "$capture_launcher_pid" ]]; then
                   for _ in {1..20}; do
                     kill -0 "$capture_launcher_pid" 2>/dev/null || break
                     sleep 0.1
                   done
                   if ! kill -0 "$capture_launcher_pid" 2>/dev/null; then
                     wait "$capture_launcher_pid" 2>/dev/null || true
                   else
                     kill "$capture_launcher_pid" 2>/dev/null || true
                     printf 'FAIL: tcpdump launcher did not exit promptly\n' >>"$netperf_pcap_log"
                   fi
                   capture_launcher_pid=
                 fi
                 if [[ -s "$netperf_pcap" ]]; then
                   if timeout --foreground 10s sudo tcpdump -nn -tttt -c 1000 -r "$netperf_pcap" >"$netperf_pcap_text" 2>>"$netperf_pcap_log"; then
                     printf 'PASS: packet text limited to 1000; pcap capture capped at 1000000 packets\n' >"$netperf_pcap_status"
                   else
                     printf 'FAIL: could not decode pcap within 10s\n' >"$netperf_pcap_status"
                   fi
                 else
                   printf 'FAIL: pcap file is empty\n' >"$netperf_pcap_status"
                 fi
               elif [[ "${{ startsWith(matrix.testname, 'um-nommu-sas-') }}" == true && \
                       "$(cat "$netperf_pcap_status")" == WAITING_FOR_64_TCP_STREAM ]]; then
                 printf 'SKIP: 64-byte TCP_STREAM did not start\n' >"$netperf_pcap_status"
               fi
             }
             trap stop_capture EXIT
             while kill -0 "$bench_pid" 2>/dev/null; do
               if [[ "$capture_attempted" == 0 && "${{ startsWith(matrix.testname, 'um-nommu-sas-') }}" == true ]] && \
                  grep -Fq 'netperf case start: 64-TCP_STREAM' "$netperf_log"; then
                 capture_attempted=1
                 rm -f "$netperf_pcap_pid"
                 sudo bash -c 'printf "%s\\n" "$$" >"$1"; shift; exec "$@"' _ "$netperf_pcap_pid" \
                   tcpdump -n -i any -U -s 128 -c 1000000 -w "$netperf_pcap" 'tcp and host 172.17.0.1' \
                   >"$netperf_pcap_log" 2>&1 &
                 capture_launcher_pid=$!
                 for _ in {1..50}; do
                   [[ -s "$netperf_pcap_pid" ]] && break
                   kill -0 "$capture_launcher_pid" 2>/dev/null || break
                   sleep 0.1
                 done
                 capture_pid=$(cat "$netperf_pcap_pid" 2>/dev/null || true)
                 if [[ -z "$capture_pid" ]] || ! sudo kill -0 "$capture_pid" 2>/dev/null; then
                   kill -KILL "$capture_launcher_pid" 2>/dev/null || true
                   capture_launcher_pid=
                   capture_pid=
                   printf 'FAIL: could not start tcpdump\n' >"$netperf_pcap_status"
                 else
                   printf 'RUNNING\n' >"$netperf_pcap_status"
                 fi
               fi
               if [[ -n "$capture_pid" ]] && \
                  grep -Fq 'netperf case end: 64-TCP_STREAM' "$netperf_log"; then
                 stop_capture
               fi
               sleep 1
             done
             stop_capture
           ) >"output/${{ matrix.testname }}-pcap-monitor.log" 2>&1 &
           capture_probe_pid=$!
           (
             while kill -0 "$bench_pid" 2>/dev/null; do
               date -Ins
               cat /proc/loadavg
               ps -eo pid,ppid,stat,pcpu,time,wchan:32,comm,args |
                 grep -E '(^ *PID|vmlinux|netserver|netperf)' | grep -v grep || true
               echo "host netperf sockets:"
               sudo ss -ntpi '( sport = :12865 or dport = :12865 )' 2>&1 || true
               sleep 5
             done
           ) > "output/${{ matrix.testname }}-host-probe.log" 2>&1 &
           probe_pid=$!
           if wait "$bench_pid"; then
             bench_status=0
           else
             bench_status=$?
           fi
           kill "$probe_pid" 2>/dev/null || true
           wait "$probe_pid" 2>/dev/null || true
           wait "$capture_probe_pid" 2>/dev/null || true
           exit "$bench_status"
      - name: Check benchmark-1 guest status
        if: ${{ always() }}
        run: |
          status_file="output/${{ matrix.testname }}-benchmark-1.status"
          if [[ ! -s "$status_file" ]]; then
            echo "benchmark-1 status file is missing: $status_file" >&2
            exit 1
          fi
          status=$(cat "$status_file")
          if [[ "$status" != 0 ]]; then
            echo "benchmark-1 guest failed with status $status" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-result-${{ matrix.testname }}
          path: output/${{ matrix.testname }}*

  checkpatch:
    runs-on: ubuntu-22.04
    name: checkpatch and co
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1
    steps:
      - name: Set env
        shell: bash
        run: |
          printf '%s\n' \
            /usr/lib/ccache/bin \
            /usr/lib/ccache \
            "${GITHUB_WORKSPACE}/bin" >> "$GITHUB_PATH"
          echo "export PATH=/usr/lib/ccache/bin:/usr/lib/ccache:${{ github.workspace }}/bin:$PATH" >> $HOME/.bashrc
      - name: Checkout
        with:
          fetch-depth: 0
          filter: blob:none
        uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-checkpatch-ccache-build-${{ github.sha }}
          restore-keys: ${{ runner.os }}-checkpatch-ccache-build-
      - name: Install packages
        run: |
           sudo pip install ply GitPython mypy
           sudo apt update -y
           sudo apt install -y aspell ccache sparse
           git clone https://github.com/daxtens/smart-sparse-diff
      - name: Install native benchmark dependencies
        run: sudo apt install -y libtirpc-dev
      - name: Install native network benchmark dependencies
        run: sudo apt install -y iperf3 netperf
      - name: Build lmbench for native benchmark
        run: |
          git clone --depth 1 --branch "$LMBENCH_REF" https://github.com/thehajime/lmbench-NoMMU.git lmbench
          patch --forward --fuzz=0 -d lmbench -p1 < .github/workflows/patches/lmbench-lat-udp-signal-handler.patch
          cat > "$RUNNER_TEMP/lmbench-gcc" <<'EOF'
          #!/bin/sh
          exec gcc "$@" -ltirpc
          EOF
          chmod +x "$RUNNER_TEMP/lmbench-gcc"
          lmbench_bin="$GITHUB_WORKSPACE/lmbench/bin/x86_64-linux-gnulibc1"
          mkdir -p "$lmbench_bin"
          # This benchmark executes on the native Linux host.  Do not define
          # CONFIG_NOMMU here: it selects lmbench's clone-based NOMMU pipe
          # worker and leaves bw_pipe_64k hanging during teardown.
          lmbench_cflags="-O2 -std=gnu17 -D_GNU_SOURCE -DHAVE_socklen_t -I/usr/include/tirpc -include string.h"
          if printf '#include <stdio.h>\nint main(void) { off64_t n = 0; return (int)n; }\n' | \
            gcc -D_GNU_SOURCE -x c -fsyntax-only - >/dev/null 2>&1; then
            lmbench_cflags="$lmbench_cflags -DHAVE_off64_t"
          fi
          make -C lmbench/src OS=Linux CC="$RUNNER_TEMP/lmbench-gcc" \
            O="$lmbench_bin" BINDIR="$lmbench_bin" \
            CFLAGS="$lmbench_cflags"
      - name: Run native benchmarks
        run: |
          set -o pipefail
          mkdir -p output
          LMBENCH_BIN_DIR="$GITHUB_WORKSPACE/lmbench/bin/x86_64-linux-gnulibc1" \
            LMBENCH_MEASUREMENT_TIMEOUT_SECONDS=120 \
            LMBENCH_PROCESS_METHOD=both \
            sh .github/workflows/lmbench_run.sh |& tee output/native.dat
          gcc -o do_getpid .github/workflows/do_getpid.c
          ./do_getpid -c 100 | tee -a output/native.dat
      - name: Run native network benchmarks
        id: run_native_network_benchmarks
        run: |
          mkdir -p output
          if ! ss -ltnH 'sport = :12865' | grep -q LISTEN; then
            sudo service netperf start
          fi
          for attempt in {1..10}; do
            ss -ltnH 'sport = :12865' | grep -q LISTEN && break
            sleep 1
          done
          if ! ss -ltnH 'sport = :12865' | grep -q LISTEN; then
            echo "netperf service did not open TCP port 12865" >&2
            sudo ss -ltnp 'sport = :12865' || true
            exit 1
          fi
          sudo ss -ltnp 'sport = :12865'
          set -euo pipefail
          iperf3 -s >output/native-iperf3-server.log 2>&1 &
          iperf_server_pid=$!
          trap 'kill "$iperf_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            if ss -ltnH 'sport = :5201' | grep -q LISTEN; then break; fi
            sleep 1
          done
          if ! ss -ltnH 'sport = :5201' | grep -q LISTEN; then
            cat output/native-iperf3-server.log >&2
            echo 'iperf3 server did not open TCP port 5201' >&2
            exit 1
          fi
          forward_status=0
          iperf3 -c 127.0.0.1 -fm >output/native-iperf3-forward.dat 2>&1 || forward_status=$?
          cat output/native-iperf3-forward.dat
          reverse_status=0
          iperf3 -c 127.0.0.1 -fm -R >output/native-iperf3-reverse.dat 2>&1 || reverse_status=$?
          cat output/native-iperf3-reverse.dat
          printf 'forward_exit=%s\nreverse_exit=%s\n' \
            "$forward_status" "$reverse_status" >output/native-iperf3-status.txt
          bash .github/workflows/netperf-bench.sh 127.0.0.1 netperf | tee output/native-netperf.dat
          if (( forward_status != 0 || reverse_status != 0 )); then
            echo "iperf3 failed: forward=$forward_status reverse=$reverse_status" >&2
            echo "iperf3 forward=$forward_status reverse=$reverse_status" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload native benchmark measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-result-native
          path: |
            output/native*.dat
            output/native-iperf3-status.txt
            output/native-iperf3-server.log
          if-no-files-found: warn
      - name: Preserve native network benchmark failure
        if: ${{ always() && steps.run_native_network_benchmarks.outcome == 'failure' }}
        run: exit 1
      - name: Fetch UML next for range checks
        run: |
           git remote add uml git://git.kernel.org/pub/scm/linux/kernel/git/uml/linux.git
           git fetch uml next:refs/remotes/uml/next
      #- name: build (sparse)
      #  run: |
      #     make ARCH=um W=1 C=2 CF='-fdiagnostic-prefix -D__CHECK_ENDIAN__ -fmax-errors=unlimited -fmax-warnings=unlimited' defconfig O=build-sparse
      #     make ARCH=um W=1 C=2 CF='-fdiagnostic-prefix -D__CHECK_ENDIAN__ -fmax-errors=unlimited -fmax-warnings=unlimited' O=build-sparse clean
      #     make ARCH=um W=1 C=2 CF='-fdiagnostic-prefix -D__CHECK_ENDIAN__ -fmax-errors=unlimited -fmax-warnings=unlimited' O=build-sparse -j8 2> old-sparse.log 1> /dev/null
      #     git checkout zpoline-nommu-v6.10
      #     git checkout HEAD~1
      #     make ARCH=um W=1 C=2 CF='-fdiagnostic-prefix -D__CHECK_ENDIAN__ -fmax-errors=unlimited -fmax-warnings=unlimited' O=build-sparse -j8 2> new-sparse.log 1> /dev/null
      #     ./smart-sparse-diff/smart-sparse-diff.py old-sparse.log new-sparse.log
      - name: check coding style
        continue-on-error: true
        run: |
           # The CI branch carries workflow and handoff commits without
           # Signed-off-by trailers. Check only commits that change kernel
           # sources; CI metadata is not an upstream kernel patch.
           git rev-list --reverse uml/next..HEAD | while read -r commit; do
             if git diff-tree --no-commit-id --name-only -r "$commit" |
               grep -qEv '^(\.github/workflows/|AGENTS\.md$)'; then
               git format-patch -1 -o p1 "$commit"
             fi
           done
           ./scripts/checkpatch.pl --summary-file --ignore FILE_PATH_CHANGES \
             --ignore AVOID_EXTERNS p1/*.patch
      - name: check spells on commit message
        run: |
           git log uml/next..HEAD |grep -v -E "^commit" > /tmp/a
           aspell list /tmp/a

  build_ltp:
    uses: ./.github/workflows/ci-docker-build.yml
    name: "LTP: build"
    with:
      ltp_ref: ${{ inputs.ltp_ref || 'fix-nommu' }}
      diagnose_setns02: ${{ inputs.diagnose_setns02 || false }}
  build_ltp_riscv:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_riscv_ltp }}
    runs-on: ubuntu-latest
    name: "LTP: build-riscv-nommu"
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt RISC-V test image
        run: docker pull ghcr.io/thehajime/linux-private-riscv64-buildroot:sha-dfebc378bc04da60d0bb9ec86989b56f7f1e3909
      - uses: actions/checkout@v6
      - name: Checkout LTP source
        uses: actions/checkout@v6
        with:
          repository: thehajime/ltp
          ref: ${{ inputs.ltp_ref || 'fix-nommu' }}
          path: ltp-source
          submodules: recursive
      - name: Build RISC-V LTP install tree
        run: |
          mkdir -p "$RUNNER_TEMP/ltp-riscv-artifact" "$RUNNER_TEMP/ltp-home"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/ltp-source:/work-buildroot/ltp" \
            --volume "$GITHUB_WORKSPACE/.github/workflows/build-ltp-riscv.sh:/build-ltp-riscv.sh:ro" \
            --volume "$RUNNER_TEMP/ltp-home:/github/home" \
            --volume "$RUNNER_TEMP/ltp-riscv-artifact:/run-artifacts" \
            --workdir /work-buildroot/ltp \
            --entrypoint /bin/bash \
            ghcr.io/thehajime/linux-private-riscv64-buildroot:sha-dfebc378bc04da60d0bb9ec86989b56f7f1e3909 \
            /build-ltp-riscv.sh
      - name: Upload RISC-V LTP install tree
        uses: actions/upload-artifact@v7
        with:
          name: ltp-alpine-riscv-nommu.tar.gz
          path: ${{ runner.temp }}/ltp-riscv-artifact/ltp-alpine-riscv-nommu.tar.gz
          if-no-files-found: error
  test_ltp:
    if: ${{ always() && needs.build_uml.result == 'success' && needs.build_ltp.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [build_uml, build_ltp, build_ltp_riscv]
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 240 || 60 }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - displayTargetName: um-mmu(p)
            image_name: uml-ci/alpine:edge-um-mmu
            image_artifact: uml-docker-image-um-mmu
            testname: um-mmu
            vmlinux_opt: ""
            name: um-mmu
          - displayTargetName: um-mmu(s)
            image_name: uml-ci/alpine:edge-um-mmu
            image_artifact: uml-docker-image-um-mmu
            testname: um-mmu-seccomp
            vmlinux_opt: "seccomp=on"
            name: um-mmu
          - displayTargetName: um-mmu-tt(s)
            image_name: uml-ci/alpine:edge-um-mmu-tt
            image_artifact: uml-docker-image-um-mmu-tt
            testname: um-mmu-tt-seccomp
            vmlinux_opt: "time-travel seccomp=on"
            name: um-mmu
          - displayTargetName: um-nommu(p)
            image_name: uml-ci/alpine:edge-um-nommu
            image_artifact: uml-docker-image-um-nommu
            testname: um-nommu
            vmlinux_opt: ""
            name: um-nommu
          - displayTargetName: um-nommu(s)
            image_name: uml-ci/alpine:edge-um-nommu
            image_artifact: uml-docker-image-um-nommu
            testname: um-nommu-seccomp
            vmlinux_opt: "seccomp=on"
            name: um-nommu
          - displayTargetName: um-nommu-tt(s)
            image_name: uml-ci/alpine:edge-um-nommu-tt
            image_artifact: uml-docker-image-um-nommu-tt
            testname: um-nommu-tt-seccomp
            vmlinux_opt: "time-travel seccomp=on"
            name: um-nommu
          - displayTargetName: um-nommu-sas(s)
            image_name: uml-ci/alpine:edge-um-nommu-plain-sas
            image_artifact: uml-docker-image-um-nommu-plain-sas
            testname: um-nommu-plain-sas
            vmlinux_opt: "seccomp=on"
            name: um-nommu
          - displayTargetName: um-nommu-sas(z)
            image_name: uml-ci/alpine:edge-um-nommu-plain-sas
            image_artifact: uml-docker-image-um-nommu-plain-sas
            testname: um-nommu-plain-sas-zpoline
            vmlinux_opt: "zpoline=1"
            name: um-nommu
          - displayTargetName: um-nommu-sas-swmmu(s)
            image_name: uml-ci/alpine:edge-um-nommu-sas
            image_artifact: uml-docker-image-um-nommu-sas
            testname: um-nommu-sas-seccomp
            vmlinux_opt: "swmmu_direct=1"
            name: um-nommu
          - displayTargetName: um-nommu-sas-swmmu(z)
            image_name: uml-ci/alpine:edge-um-nommu-sas
            image_artifact: uml-docker-image-um-nommu-sas
            testname: um-nommu-sas-zpoline
            vmlinux_opt: "zpoline=1 swmmu_direct=1"
            name: um-nommu
          - displayTargetName: (native)
            image_name: mirror.gcr.io/library/alpine:edge
            image_artifact: ''
            testname: native
            vmlinux_opt: ""
            name: um-mmu
            docker_opt: "-v /lib/modules:/lib/modules"
          - displayTargetName: qemu-riscv-nommu
            image_name: ghcr.io/thehajime/linux-private-riscv64-buildroot:sha-dfebc378bc04da60d0bb9ec86989b56f7f1e3909
            image_artifact: ''
            testname: riscv-nommu
            vmlinux_opt: ""
            name: riscv-nommu
    name: "LTP: test-${{ matrix.displayTargetName }}"
    steps:
      - name: Download local test image
        if: matrix.image_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image_artifact }}
          path: ${{ runner.temp }}/local-image
      - name: Load local test image
        if: matrix.image_artifact != ''
        run: docker load -i "$(find "$RUNNER_TEMP/local-image" -maxdepth 1 -name '*.tar' -print -quit)"
      - name: Log in to ghcr.io for RISC-V test image
        if: ${{ matrix.testname == 'riscv-nommu' && inputs.run_riscv_ltp }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt RISC-V test image
        if: ${{ matrix.testname == 'riscv-nommu' && inputs.run_riscv_ltp }}
        run: docker pull "${{ matrix.image_name }}"
      - name: Pull native Alpine test image
        if: matrix.testname == 'native'
        run: docker pull mirror.gcr.io/library/alpine:edge
      - uses: actions/checkout@v6
      - name: Checkout LTP test support files
        if: ${{ matrix.testname != 'riscv-nommu' || inputs.run_riscv_ltp }}
        uses: actions/checkout@v6
        with:
          repository: thehajime/ltp
          ref: ${{ inputs.ltp_ref || 'fix-nommu' }}
          path: ltp-source
          submodules: recursive
      - uses: actions/download-artifact@v7
        if: ${{ matrix.testname != 'riscv-nommu' || inputs.run_riscv_ltp }}
        with:
          name: ltp-alpine-${{ matrix.name }}.tar.gz
          path: ${{ runner.temp }}/ltp-install
      - name: Extract LTP install tree on the runner
        if: ${{ matrix.testname != 'riscv-nommu' || inputs.run_riscv_ltp }}
        run: |
          mkdir -p "$RUNNER_TEMP/ltp-root"
          archive="$RUNNER_TEMP/ltp-install/ltp-alpine-${{ matrix.name }}.tar.gz"
          tar -xzf "$archive" \
            -C "$RUNNER_TEMP/ltp-root"
          test -x "$RUNNER_TEMP/ltp-root/opt/ltp/kirk"
      - name: Create local test container
        if: ${{ matrix.testname != 'riscv-nommu' || inputs.run_riscv_ltp }}
        env:
          LTP_TESTNAME: ${{ matrix.testname }}
        run: |
          install -d "$RUNNER_TEMP/ltp-home"
          docker_args=(
            --name ltp-test --privileged -t
            -v /boot:/boot -v /home:/home -v /dev:/dev
            ${{ matrix.docker_opt }}
            -v "$GITHUB_WORKSPACE:/github/workspace"
            -v "$RUNNER_TEMP/ltp-root/opt/ltp:/opt/ltp"
            -v "$RUNNER_TEMP/ltp-home:/github/home"
            -v "$GITHUB_WORKSPACE/ltp-source:/ltp-source:ro"
          )
          if [[ "$LTP_TESTNAME" == native ]]; then
            # bind02 requires the Linux privileged-port boundary. Docker's
            # default of zero permits unprivileged binding to every port.
            docker_args+=(--sysctl net.ipv4.ip_unprivileged_port_start=1024)
          fi
          if [[ "$LTP_TESTNAME" == um-nommu* ]]; then
            docker create "${docker_args[@]}" \
              --entrypoint /opt/uml-host-tools/busybox "${{ matrix.image_name }}" \
              sh -c 'exec /opt/uml-host-tools/busybox sleep infinity'
          else
            docker create "${docker_args[@]}" \
              --entrypoint /bin/sh "${{ matrix.image_name }}" -c 'sleep infinity'
          fi
          docker start ltp-test
      - name: Monitor UML host process mappings
        if: ${{ matrix.testname == 'um-nommu-sas-zpoline' && inputs.sas_fault_diagnostics }}
        run: |
          mkdir -p output/ltp/uml-python-debug
          docker exec -d \
            -e PATH=/opt/uml-host-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            ltp-test /opt/uml-host-tools/busybox sh \
            /github/workspace/.github/workflows/capture-uml-python-maps.sh host
      - name: Run LTP
        if: ${{ matrix.testname != 'riscv-nommu' || inputs.run_riscv_ltp }}
        env:
          LTP_TESTNAME: ${{ matrix.testname }}
          LTP_ARTIFACT_NAME: ${{ matrix.name }}
          UML_OPTIONS: ${{ matrix.vmlinux_opt }}
          LTP_FULL_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.ltp_run_pattern == '' }}
          LTP_RUN_PATTERN_OVERRIDE: ${{ inputs.ltp_run_pattern || '' }}
          LTP_TIMEOUT_MUL: 10
          LTP_INSTALL_PREEXTRACTED: 1
          SAS_CAPTURE_PYTHON_MAPS: ${{ inputs.sas_fault_diagnostics || false }}
        run: |
          set -euo pipefail
          case "$LTP_TESTNAME" in
            um-nommu*)
              mkdir -p output/ltp
              docker exec -t \
                -e PATH=/opt/uml-host-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                -e LTP_TESTNAME -e LTP_ARTIFACT_NAME -e UML_OPTIONS -e LTP_FULL_RUN -e LTP_RUN_PATTERN_OVERRIDE -e LTP_TIMEOUT_MUL \
                -e LTP_INSTALL_PREEXTRACTED -e SAS_CAPTURE_PYTHON_MAPS ltp-test \
                /opt/uml-host-tools/busybox sh -x /github/workspace/.github/workflows/run-ltp-job.sh \
                | tee "output/ltp/${LTP_TESTNAME}-ltp.dat"
              test -s "output/ltp/ltp-result-${LTP_TESTNAME}.html"
              ;;
            *)
              docker exec -e LTP_TESTNAME -e LTP_ARTIFACT_NAME -e UML_OPTIONS -e LTP_FULL_RUN -e LTP_RUN_PATTERN_OVERRIDE -e LTP_TIMEOUT_MUL \
                -e LTP_INSTALL_PREEXTRACTED ltp-test \
                /bin/sh -c 'if command -v bash >/dev/null 2>&1; then \
                  exec bash -x /github/workspace/.github/workflows/run-ltp-job.sh; \
                else \
                  exec /bin/sh -x /github/workspace/.github/workflows/run-ltp-job.sh; \
                fi'
              ;;
          esac
      - name: Collect UML Python mappings and exact ELF files
        if: ${{ always() && matrix.testname == 'um-nommu-sas-zpoline' && inputs.sas_fault_diagnostics }}
        run: |
          set +e
          diag=output/ltp/uml-python-debug
          sudo chown -R "$(id -u):$(id -g)" "$diag" 2>/dev/null || true
          mkdir -p "$diag/elf"
          : > "$diag/collection.log"
          find "$diag" -type f \
            \( -path '*/guest-processes/*' -o -path '*/host-processes/*' \) \
            -print 2>/dev/null | sort > "$diag/captured-files.txt"
          find "$diag/guest-processes" -name auxv -type f -print 2>/dev/null |
          while read -r auxv; do
            od -An -tx8 "$auxv" > "$auxv.hex" 2>> "$diag/collection.log"
          done
          if ! find "$diag/guest-processes" -name maps -type f -print -quit \
              2>/dev/null | grep -q .; then
            echo 'No guest Python process maps captured' > "$diag/collection-status.txt"
          fi
          for path in /usr/bin/python3.14 /usr/lib/libpython3.14.so.1.0 \
                      /lib/ld-musl-x86_64.so.1; do
            source=$(docker exec ltp-test /opt/uml-host-tools/busybox readlink -f "$path" \
              2>> "$diag/collection.log")
            [ -n "$source" ] || continue
            name=$(basename "$path")
            if ! docker cp "ltp-test:$source" "$diag/elf/$name" \
                2>> "$diag/collection.log"; then
              echo "Failed to copy $source" >> "$diag/collection.log"
            fi
          done
          find "$diag" -type f \
            \( -path '*/guest-processes/*/maps' -o \
               -path '*/host-processes/*/maps' \) -print 2>/dev/null |
          while read -r maps; do
            awk '$6 ~ /^\// {print $6}' "$maps" | sort -u
          done | while read -r path; do
            [ -n "$path" ] || continue
            path=${path%\ (deleted)}
            id=$(printf '%s' "$path" | sha256sum | cut -c1-12)
            name=$(basename "$path")
            if docker cp "ltp-test:$path" "$diag/elf/$id-$name" \
                2>> "$diag/collection.log"; then
              printf '%s\t%s\n' "$id-$name" "$path" >> "$diag/mapped-files.tsv"
            fi
          done
          for elf in "$diag"/elf/*; do
            [ -f "$elf" ] || continue
            sha256sum "$elf" >> "$diag/elf-metadata.txt"
            readelf -n "$elf" >> "$diag/elf-metadata.txt" 2>&1
            readelf -l "$elf" >> "$diag/elf-metadata.txt" 2>&1
          done
      - name: Upload SAS Python fault diagnostics
        if: ${{ always() && matrix.testname == 'um-nommu-sas-zpoline' && inputs.sas_fault_diagnostics }}
        uses: actions/upload-artifact@v4
        with:
          name: sas-python-fault-debug
          path: output/ltp/uml-python-debug/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local test container
        if: ${{ always() && (matrix.testname != 'riscv-nommu' || inputs.run_riscv_ltp) }}
        run: docker rm -f ltp-test || true
      - name: Restore runner ownership of LTP results
        if: ${{ always() && (matrix.testname != 'riscv-nommu' || inputs.run_riscv_ltp) }}
        run: |
          if [ -d output/ltp ]; then
            sudo chown -R "$(id -u):$(id -g)" output/ltp
          fi

      - uses: actions/upload-artifact@v7
        id: upload_html
        if: ${{ matrix.testname != 'riscv-nommu' || inputs.run_riscv_ltp }}
        with:
          name: ltp-result-${{ matrix.testname }}.html
          path: output/ltp/ltp-result-${{ matrix.testname }}.html
          archive: false
      - name: retrieve artifact URL
        if: ${{ matrix.testname != 'riscv-nommu' || inputs.run_riscv_ltp }}
        run: |
          echo "${{ matrix.testname }} report: ${{ steps.upload_html.outputs.artifact-url }}" > \
             output/ltp/${{ matrix.testname }}-url.txt
      - uses: actions/upload-artifact@v7
        if: ${{ always() && (matrix.testname != 'riscv-nommu' || inputs.run_riscv_ltp) }}
        with:
          name: test-result-ltp-${{ matrix.testname }}
          path: output/ltp/*

  bench-result:
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    name: bench-result
    needs: [build_uml,benchmark,test_ltp,checkpatch,nginx_benchmark,native_nginx_benchmark]
    permissions:
      actions: read
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: ${{ github.ref_name == 'ci/uml-nommu' && 'github-pages' || 'ci-report-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/workflows
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
            path: output
            pattern: test-result-*
            merge-multiple: true
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
            path: output/kunit-results
            pattern: kunit-results-*
      - name: Download direct SWMMU kselftest results
        if: ${{ always() && needs.build_uml.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: swmmu-kselftest-*
          path: output/kselftest-artifacts
      - name: Download UML nginx matrix results
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nginx-*-w*-n*-c*
          path: ${{ runner.temp }}/nginx-matrix
          merge-multiple: false
      - name: Download shared SAS rootfs diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: nginx-sas-rootfs-diagnostics
          path: ${{ runner.temp }}/nginx-sas-rootfs-diagnostics
      - name: Display structure of downloaded files
        run: mkdir -p output && ls -R output || true
      - name: Install packages
        if: ${{ needs.benchmark.result == 'success' || github.event_name == 'workflow_dispatch' }}
        run: sudo apt update -y && sudo apt install -y gnuplot jq python3-matplotlib
      - name: Aggregate UML nginx results
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p output/nginx
          python3 .github/workflows/aggregate-swmmu-nginx-results.py \
            "$RUNNER_TEMP/nginx-matrix" output/nginx
          python3 .github/workflows/plot-nginx-comparison.py \
            output/nginx/aggregate.json output/nginx
          mkdir -p output/out
          for workers in 1 4; do
            chart="nginx-workers-$workers.png"
            if [ -f "output/nginx/$chart" ]; then
              cp "output/nginx/$chart" "output/out/$chart"
            fi
          done
          if [ -d "$RUNNER_TEMP/nginx-sas-rootfs-diagnostics" ]; then
            cp -a "$RUNNER_TEMP/nginx-sas-rootfs-diagnostics" \
              output/nginx/rootfs-diagnostics
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        with:
          name: nginx-aggregate-plot
          path: output/nginx
          if-no-files-found: warn
      - name: bench data parse/out
        if: ${{ always() && needs.build_uml.result == 'success' && needs.benchmark.result != 'skipped' }}
        run: |
          bash .github/workflows/um-nommu-plot.sh output |& tee um-nommu.log
          bash .github/workflows/netperf-plot.sh output |& tee -a um-nommu.log
      - name: Load previous result snapshot
        if: ${{ always() }}
        uses: actions/github-script@v9
        env:
          SNAPSHOT_PATH: ${{ runner.temp }}/previous-results.json
        with:
          script: |
            const fs = require('fs');
            const zlib = require('zlib');
            let snapshot = null;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 4,
                per_page: 100
              });
              for (const comment of comments.reverse()) {
                const match = comment.body.match(/<!-- uml-ci-result-snapshot:v1\n([A-Za-z0-9+/=\r\n]+)\n-->/);
                if (!match) continue;
                snapshot = JSON.parse(zlib.gunzipSync(Buffer.from(match[1].replace(/\s/g, ''), 'base64')).toString());
                break;
              }
            } catch (error) {
              core.warning(`Could not load previous result snapshot: ${error.message}`);
            }
            fs.writeFileSync(process.env.SNAPSHOT_PATH, JSON.stringify(snapshot));
            core.info(snapshot ? `Loaded baseline from ${snapshot.run_url}` : 'No prior report snapshot found; writing null baseline');
      - name: Create comparison report
        id: create_report
        if: ${{ always() }}
        env:
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_SHA: ${{ github.sha }}
          TESTED_REF: ${{ inputs.kernel_ref || (github.ref_name == 'ci/uml-nommu' && 'feature-swmmu-nommu') || github.ref_name }}
          BUILD_STATUS: ${{ needs.build_uml.result }}
          BENCHMARK_STATUS: ${{ needs.benchmark.result }}
          LTP_STATUS: "not a report dependency; available LTP artifacts included"
        run: |
          disabled_targets=()
          if [[ "${{ inputs.run_riscv_ltp }}" != "true" ]]; then
            disabled_targets+=(riscv-nommu)
          fi
          python3 .github/workflows/result-report.py \
            --data-dir output \
            --previous "$RUNNER_TEMP/previous-results.json" \
            --snapshot "$RUNNER_TEMP/result-snapshot.json" \
            --report "$RUNNER_TEMP/comparison-report.md" \
            --run-url "$REPORT_URL" \
            --sha "$REPORT_SHA" \
            --tested-ref "$TESTED_REF" \
            --build-status "$BUILD_STATUS" \
            --benchmark-status "$BENCHMARK_STATUS" \
            --ltp-status "$LTP_STATUS" \
            --disabled-targets "${disabled_targets[@]}"
      - name: Render comparison benchmark plots
        if: ${{ always() && needs.build_uml.result == 'success' && needs.benchmark.result != 'skipped' }}
        run: |
          python3 .github/workflows/plot-benchmark-results.py \
            --snapshot "$RUNNER_TEMP/result-snapshot.json" \
            --output output/out
      - name: Publish immutable benchmark chart assets
        id: publish_chart_assets
        if: ${{ always() && needs.build_uml.result == 'success' && needs.benchmark.result != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_BRANCH: uml-ci-report-assets
          CHART_DIR: output/out
        run: bash .github/workflows/publish-chart-assets.sh
      - uses: actions/upload-artifact@v7
        if: ${{ always() && needs.build_uml.result == 'success' && needs.benchmark.result != 'skipped' }}
        with:
          name: test-result-all
          path: output/out/*
      - name: Build GitHub Pages report
        if: ${{ always() && steps.create_report.outcome == 'success' && needs.build_uml.result != 'skipped' && needs.benchmark.result != 'skipped' }}
        run: |
          python3 .github/workflows/result-page.py \
            --snapshot "$RUNNER_TEMP/result-snapshot.json" \
            --report "$RUNNER_TEMP/comparison-report.md" \
            --charts output/out \
            --output "$RUNNER_TEMP/site"
      - name: Upload GitHub Pages artifact
        id: upload_pages
        if: ${{ always() && steps.create_report.outcome == 'success' && needs.build_uml.result != 'skipped' && needs.benchmark.result != 'skipped' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy report to GitHub Pages
        id: deployment
        if: ${{ always() && github.ref_name == 'ci/uml-nommu' && steps.upload_pages.outcome == 'success' && needs.build_uml.result != 'skipped' && needs.benchmark.result != 'skipped' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
      - name: prepare action post
        if: ${{ always() && steps.create_report.outcome == 'success' && needs.build_uml.result != 'skipped' && needs.benchmark.result != 'skipped' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          ASSET_BASE_URL: ${{ steps.publish_chart_assets.outputs.asset_base_url }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          report_path = Path(os.environ["RUNNER_TEMP"]) / "comparison-report.md"
          comment_path = Path(os.environ["RUNNER_TEMP"]) / "comment.md"
          site_path = Path(os.environ["RUNNER_TEMP"]) / "site"
          page_url = os.environ.get("PAGE_URL", "")
          asset_base = os.environ.get("ASSET_BASE_URL", "").rstrip("/")
          report = report_path.read_text()
          descriptions = {
              "lmbench.png": "lmbench operation latency by UML profile; the logarithmic vertical axis uses microseconds.",
              "lmbench-bandwidth.png": "lmbench pipe and memory bandwidth by UML profile, in MB/s.",
              "iperf3.png": "iperf3 forward goodput is positive and reverse goodput is negative. Both directions for each profile share the same x coordinate and legend entry, in Gbit/s.",
              "tcp-stream.png": "netperf TCP_STREAM (positive) and TCP_MAERTS (negative) goodput by payload size. Both directions for a profile share the same x coordinate and legend entry. The vertical range is symmetric and includes native values when available.",
              "nginx-workers-1.png": "Nginx throughput versus online CPU count, with profile colors and separate client-connection panels. Boxes show repeated same-condition wrk runs; diamonds denote n=1. Native uses host CPU count on a separate runner.",
              "nginx-workers-4.png": "Nginx throughput versus online CPU count, with profile colors and separate client-connection panels. Boxes show repeated same-condition wrk runs; diamonds denote n=1. Native uses host CPU count on a separate runner.",
          }
          for filename, description in descriptions.items():
              marker = f"<!-- report-chart:{filename} -->"
              if marker not in report:
                  continue
              image = site_path / filename
              if not image.is_file():
                  report = report.replace(marker, "")
                  continue
              if asset_base:
                  image_url = f"{asset_base}/{filename}"
              elif page_url:
                  image_url = f"{page_url.rstrip('/')}/{filename}"
                  description += " (temporary Pages URL; see the workflow run artifacts if it expires.)"
              else:
                  report = report.replace(marker, f"{description} Chart file: `{filename}` is attached to the workflow run artifacts.")
                  continue
              embed = f"{description}\n\n![{filename.removesuffix('.png')}]({image_url})"
              report = report.replace(marker, embed)

          if page_url:
              report = f"[Open this run's full report on GitHub Pages]({page_url})\n\n" + report
          comment_path.write_text(report)
          PY
      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.create_report.outcome == 'success' }}
        with:
          name: uml-ci-comparison-report
          path: |
            ${{ runner.temp }}/comment.md
            ${{ runner.temp }}/result-snapshot.json
            ${{ runner.temp }}/site
      - uses: actions/github-script@v9
        if: ${{ always() && steps.create_report.outcome == 'success' && needs.build_uml.result != 'skipped' && needs.benchmark.result != 'skipped' }}
        env:
          COMMENT_BODY_FILE: ${{ runner.temp }}/comment.md
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              issue_number: 4,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync(process.env.COMMENT_BODY_FILE, 'utf8')
            })
