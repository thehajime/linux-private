on:
  push:
    branches:
      - '**'
  #pull_request:
  #  branches:
  #    - master
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Kernel branch, tag, or commit to validate'
        required: false
        type: string
        default: feature-swmmu-nommu
      publish_images:
        description: 'Publish the tested UML images to GHCR'
        required: false
        type: boolean
        default: false
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: true

jobs:
  build_nommu_apks:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v6
        with:
          ref: ci/uml-nommu
      - name: Checkout pinned aports source
        uses: actions/checkout@v6
        with:
          repository: thehajime/aports
          ref: f9ec9629f50634534a0ee89339ca5ed5633aa503
          path: aports-source
          sparse-checkout: |
            main/busybox
            main/musl
            scripts/swmmu-profile.sh
            scripts/swmmu-cc
      - name: Checkout kernel headers and SWMMU plugin source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.kernel_ref || (github.ref_name == 'ci/uml-nommu' && 'feature-swmmu-nommu') || github.ref }}
          path: kernel-source
      - name: Cache verified aports source archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/aports-distfiles
          key: aports-distfiles-${{ hashFiles('aports-source/main/busybox/APKBUILD', 'aports-source/main/musl/APKBUILD') }}
      - name: Build signed NOMMU APKs from aports
        run: |
          mkdir -p "$RUNNER_TEMP/nommu-apks"
          mkdir -p "$RUNNER_TEMP/aports-distfiles"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/aports-source:/src:ro" \
            --volume "$GITHUB_WORKSPACE/kernel-source:/kernel:ro" \
            --volume "$GITHUB_WORKSPACE/.github/workflows/build-nommu-apks.sh:/build.sh:ro" \
            --volume "$RUNNER_TEMP/nommu-apks:/out" \
            --volume "$RUNNER_TEMP/aports-distfiles:/var/cache/distfiles" \
            alpine:3.20.3 sh /build.sh
      - name: Upload signed NOMMU APK profiles and public key
        uses: actions/upload-artifact@v4
        with:
          name: aports-nommu-apks
          path: ${{ runner.temp }}/nommu-apks
          if-no-files-found: error

  build_uml:
    needs: [build_nommu_apks]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - displayTargetName: ubuntu-22.04
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"
            kunit_opts: --kconfig_add CONFIG_KUNIT_UML_PCI=n ### XXX
            testname: um-mmu
            mode: um-mmu
            userspace_profile: alpine
          - displayTargetName: ubuntu-22.04 (time-travel)
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR" CFLAGS+="-DCONFIG_UML_TIME_TRAVEL_SUPPORT" CFLAGS+="-DCONFIG_UML_MAX_USERSPACE_ITERATIONS=100000"
            kunit_opts: --kconfig_add CONFIG_KUNIT_UML_PCI=n ### XXX
            testname: um-mmu-tt
            mode: um-mmu
            userspace_profile: alpine
          - displayTargetName: ubuntu-22.04 (nommu)
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"
            kunit_opts: --kconfig_add CONFIG_MMU=n --kconfig_add CONFIG_KUNIT_UML_PCI=n
            testname: um-nommu
            mode: um-nommu
            userspace_profile: nommu-plain
          - displayTargetName: ubuntu-22.04 (nommu-sas)
            os: unix
            runs_on: ubuntu-22.04
            shell: bash
            defconfig: x86_64_defconfig
            add_configs: CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"
            kunit_opts: --kconfig_add CONFIG_MMU=n --kconfig_add CONFIG_KUNIT_UML_PCI=n --kconfig_add CONFIG_UML_NOMMU_SAS=y
            testname: um-nommu-sas
            mode: um-nommu
            userspace_profile: nommu-swmmu
    name: "UML: build (${{ matrix.testname }})"
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1

    defaults:
       run:
         shell: ${{ matrix.shell }}

    steps:
#      - name: Setup tmate session
#        uses: mxschmitt/action-tmate@v3
#        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled }}
#        with:
#          detached: true
      - name: Set env
        shell: bash
        run: |
          echo "/usr/lib/ccache/bin:/usr/lib/ccache:${{ github.workspace }}/bin" >> $GITHUB_PATH
          echo "export PATH=/usr/lib/ccache/bin:/usr/lib/ccache:${{ github.workspace }}/bin:$PATH" >> $HOME/.bashrc
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.kernel_ref || (github.ref_name == 'ci/uml-nommu' && 'feature-swmmu-nommu') || github.ref }}
      - name: Checkout canonical CI support files
        uses: actions/checkout@v6
        with:
          ref: ci/uml-nommu
          path: ci-config
      - name: Install canonical CI support files
        run: |
          mkdir -p .github/workflows
          cp -a ci-config/.github/workflows/. .github/workflows/
      - name: Download signed NOMMU APKs
        uses: actions/download-artifact@v4
        with:
          name: aports-nommu-apks
          path: .github/workflows/aports-artifacts
      - uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.testname }}-ccache-build #-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ matrix.testname }}-ccache-build #-
      - name: Install packages
        run: |
          sudo apt update -y
          sudo apt install -y ccache iperf3 netperf gdb valgrind libcap-dev libcap-ng-dev libmnl-dev libmbedtls-dev liburing-dev libnuma-dev
      - name: Setup latest Alpine Linux
        uses: jirutka/setup-alpine@v1
        with:
           branch: v3.20
           packages: >
             alpine-sdk
             doas
             libtirpc-dev
             linux-headers
             autoconf
             automake
             bash
             bison
             flex
             bc
             numactl-dev
             libcap-dev
             rsync
             coreutils
             ccache
             liburing-dev
             git
             libcap-ng-dev
             iproute2
      - name: build bench tools
        if: matrix.testname != 'um-mmu-tt'
        run: |
          git clone https://github.com/ricarkol/lmbench2.git
          git clone https://github.com/HewlettPackard/netperf
          cd lmbench2
          touch src/Makefile
          touch Makefile
          make
          cd ..
          cd netperf
          sh autogen.sh
          ./configure; make CFLAGS="-fcommon" || true
          cd ..
          make -C .github/workflows/ MASTER_CC=gcc
        shell: alpine.sh {0}
      # --root {0}
      - name: Setup faketty
        uses: Yuri6037/Action-FakeTTY@v1.1
      - name: setup tap interface
        run: |
           set -x
           sudo ip tuntap add dev tap100 mode tap user ${USER}
           sudo ip add add 192.168.122.1/24 dev tap100
           sudo ip link set up dev tap100
           cp .github/workflows/gdbinit ~/.gdbinit
           iperf3 -s &
      - name: (FIXME) defconfig rewrite for nommu
        if: matrix.testname == 'um-nommu'
        run: |
          echo "# CONFIG_MMU is not set" >> arch/um/configs/x86_64_defconfig
          echo "# CONFIG_NOMMU_SWMMU_DEFAULT_ON is not set" >> arch/um/configs/x86_64_defconfig
      - name: (FIXME) defconfig rewrite for nommu-sas
        if: matrix.testname == 'um-nommu-sas'
        run: |
          echo "# CONFIG_MMU is not set" >> arch/um/configs/x86_64_defconfig
          echo "CONFIG_UML_NOMMU_SAS=y" >> arch/um/configs/x86_64_defconfig
      - name: build-0 (static)
        run: |
          curl -L -O https://raw.githubusercontent.com/thehajime/ltp/refs/heads/fix-nommu/tools/buildroot/ltp-add.config
          cat ltp-add.config >> arch/um/configs/${{ matrix.defconfig }}
          make ARCH=um ${{ matrix.defconfig }} O=build
          if [[ "${{ matrix.testname }}" == "um-nommu" ]]; then
            scripts/config --file build/.config --disable NOMMU_SWMMU_DEFAULT_ON
            scripts/config --file build/.config --disable NOMMU_SWMMU
            make ARCH=um O=build olddefconfig
            ! grep -q '^CONFIG_NOMMU_SWMMU_DEFAULT_ON=y$' build/.config
            ! grep -q '^CONFIG_NOMMU_SWMMU=y$' build/.config
            ! grep -q '^CONFIG_GCC_PLUGIN_SWMMU=y$' build/.config
          elif [[ "${{ matrix.testname }}" == "um-nommu-sas" ]]; then
            scripts/config --file build/.config --enable NOMMU_SWMMU
            scripts/config --file build/.config --enable NOMMU_SWMMU_DEFAULT_ON
            scripts/config --file build/.config --enable UML_NOMMU_SAS
            make ARCH=um O=build olddefconfig
            grep -q '^CONFIG_NOMMU_SWMMU=y$' build/.config
            grep -q '^CONFIG_UML_NOMMU_SAS=y$' build/.config
          fi
          cat build/.config | sed "s/.*CONFIG_STATIC_LINK.*/CONFIG_STATIC_LINK=y/" > /tmp/a; mv /tmp/a build/.config
          make -j8 ARCH=um O=build ${{ matrix.add_configs }}
      - name: prep for docker build
        if: matrix.testname != 'um-mmu-tt'
        run: |
           make -j8 ARCH=um O=build modules_install INSTALL_MOD_PATH=`pwd`/.github/workflows
           cp build/vmlinux .github/workflows/
           cp -rpf lmbench2 .github/workflows/
           cp netperf/src/netperf .github/workflows/
           ls .github/workflows/
           ls .github/workflows/lib/modules
      - name: Build and push Docker image (no push)
        if: matrix.testname != 'um-mmu-tt'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .github/workflows
          build-args: |
            MODE=${{ matrix.mode }}
            USERSPACE_PROFILE=${{ matrix.userspace_profile }}
          push: false
          load: true
          tags: |
            uml-ci/alpine:3.20.3-${{ matrix.testname }}
      - name: Save tested UML image for downstream jobs
        if: matrix.testname != 'um-mmu-tt'
        run: docker save uml-ci/alpine:3.20.3-${{ matrix.testname }} -o "$RUNNER_TEMP/uml-image.tar"
      - name: Upload tested UML image
        if: matrix.testname != 'um-mmu-tt'
        uses: actions/upload-artifact@v4
        with:
          name: uml-docker-image-${{ matrix.testname }}
          path: ${{ runner.temp }}/uml-image.tar
          if-no-files-found: error
      - name: image for test
        if: matrix.testname != 'um-mmu-tt'
        run: |
          docker create --name alpine-nommu uml-ci/alpine:3.20.3-${{ matrix.testname }}
          docker start alpine-nommu
          docker wait alpine-nommu
          docker logs alpine-nommu
          docker export alpine-nommu > alpine.tar
          docker rm alpine-nommu
          mnt=$(mktemp -d)
          dd if=/dev/zero of=alpine.ext4 bs=1 count=0 seek=1G
          sudo chmod og+wr "alpine.ext4"
          yes 2>/dev/null | mkfs.ext4 "alpine.ext4" || true
          sudo mount "alpine.ext4" $mnt
          sudo tar -xf alpine.tar -C $mnt
          sudo umount $mnt
          mkdir -p rootfs
          sudo tar -xf alpine.tar -C rootfs
          sudo chown -R ${USER} rootfs
      - name: test-0 (static)
        if: matrix.testname != 'um-mmu-tt'
        run: |
          sudo sh -c "echo 0 > /proc/sys/vm/mmap_min_addr"
          set +e
          timeout --signal=TERM 30s faketty ./build/vmlinux vec0:transport=tap,ifname=tap100,depth=128,gro=1 ubd0=./alpine.ext4 rw mem=2048m loglevel=8 console=tty init=/sbin/init 2>&1 | tee /tmp/log.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [[ $rc -ne 0 && $rc -ne 124 && $rc -ne 143 ]]; then exit "$rc"; fi
          if [[ "${{ matrix.testname }}" == "um-nommu" ]]; then
            grep -q 'NOMMU_USERSPACE_READY' /tmp/log.txt
          fi
          echo "========="
          cat /tmp/log.txt
      - name: kunit test
        if: matrix.testname != 'um-mmu-tt'
        run: |
          mkdir -p output/kunit
          for config in `find . -path './ci-config' -prune -o -name .kunitconfig -print | grep -v -E "kfence|sunrpc|handshake|kcsan|gpu|damon|rust|android|sound|hid|firewire|iommu|nvme|mac80211|irqchip|spi" `; do \
            echo "==" $config "==" ; \
            result_name=$(printf '%s' "$config" | sed 's#[^A-Za-z0-9._-]#_#g'); \
            ./tools/testing/kunit/kunit.py run --json="output/kunit/kunit-${{ matrix.testname }}-${result_name}.json" --kunitconfig="$config" ${{ matrix.kunit_opts }}
          done
      - name: Upload KUnit result data
        if: ${{ always() && matrix.testname != 'um-mmu-tt' }}
        uses: actions/upload-artifact@v7
        with:
          name: kunit-results-${{ matrix.testname }}
          path: output/kunit/*.json
          if-no-files-found: warn
      - name: build-1
        run: |
          curl -L -O https://raw.githubusercontent.com/thehajime/ltp/refs/heads/fix-nommu/tools/buildroot/ltp-add.config
          cat ltp-add.config >> arch/um/configs/${{ matrix.defconfig }}
          make ARCH=um ${{ matrix.defconfig }}
          if [[ "${{ matrix.testname }}" == "um-nommu" ]]; then
            scripts/config --disable NOMMU_SWMMU_DEFAULT_ON --disable NOMMU_SWMMU
            make ARCH=um olddefconfig
            ! grep -q '^CONFIG_NOMMU_SWMMU_DEFAULT_ON=y$' .config
            ! grep -q '^CONFIG_NOMMU_SWMMU=y$' .config
            ! grep -q '^CONFIG_GCC_PLUGIN_SWMMU=y$' .config
          elif [[ "${{ matrix.testname }}" == "um-nommu-sas" ]]; then
            scripts/config --enable NOMMU_SWMMU --enable NOMMU_SWMMU_DEFAULT_ON --enable UML_NOMMU_SAS
            make ARCH=um olddefconfig
            grep -q '^CONFIG_NOMMU_SWMMU=y$' .config
            grep -q '^CONFIG_UML_NOMMU_SAS=y$' .config
          fi
          make -j8 ARCH=um ${{ matrix.add_configs }}
      - name: test-1
        if: matrix.testname != 'um-mmu-tt'
        run: |
          set +e
          timeout --signal=TERM 30s faketty ./vmlinux vec0:transport=tap,ifname=tap100,depth=128,gro=1 ubd0=./alpine.ext4 rw mem=2048m loglevel=8 console=tty init=/sbin/init 2>&1 | tee /tmp/log.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [[ $rc -ne 0 && $rc -ne 124 && $rc -ne 143 ]]; then exit "$rc"; fi
          if [[ "${{ matrix.testname }}" == "um-nommu" ]]; then
            grep -q 'NOMMU_USERSPACE_READY' /tmp/log.txt
          fi
          echo "========="
          cat /tmp/log.txt
      - name: Pack tested image context
        if: matrix.testname != 'um-mmu-tt'
        run: tar -czf "$RUNNER_TEMP/uml-image-context.tar.gz" -C .github/workflows .
      - name: Upload tested image context
        if: matrix.testname != 'um-mmu-tt'
        uses: actions/upload-artifact@v4
        with:
          name: uml-image-context-${{ matrix.testname }}
          path: ${{ runner.temp }}/uml-image-context.tar.gz
          if-no-files-found: error

  publish_uml_images:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images
    needs: [build_uml]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - testname: um-mmu
            mode: um-mmu
            userspace_profile: alpine
          - testname: um-nommu
            mode: um-nommu
            userspace_profile: nommu-plain
          - testname: um-nommu-sas
            mode: um-nommu
            userspace_profile: nommu-swmmu
    steps:
      - name: Download tested image context
        uses: actions/download-artifact@v4
        with:
          name: uml-image-context-${{ matrix.testname }}
          path: ${{ runner.temp }}/image-context
      - name: Extract tested image context
        run: mkdir image-context && tar -xzf "$RUNNER_TEMP/image-context/uml-image-context.tar.gz" -C image-context
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested UML image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: image-context
          build-args: |
            MODE=${{ matrix.mode }}
            USERSPACE_PROFILE=${{ matrix.userspace_profile }}
          push: true
          tags: ghcr.io/thehajime/alpine:3.20.3-${{ matrix.testname }}

  buildroot_riscv:
    runs-on: ubuntu-22.04
    name: "buildroot: build riscv64-nommu (local)"
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1
    steps:
      - name: LTP checkout
        run: git clone -b fix-nommu https://github.com/thehajime/ltp
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Build RISC-V NOMMU image locally
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: ltp/tools/buildroot/
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: uml-ci/buildroot-riscv64-nommu:0.1
      - name: Save local RISC-V image
        run: docker save uml-ci/buildroot-riscv64-nommu:0.1 -o "$RUNNER_TEMP/buildroot-riscv-image.tar"
      - name: Upload local RISC-V image
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-riscv64-nommu-image
          path: ${{ runner.temp }}/buildroot-riscv-image.tar
          if-no-files-found: error

  benchmark:
    runs-on: ${{ matrix.runs_on }}
    needs: [build_uml]
    strategy:
      fail-fast: false
      matrix:
        include:
          - displayTargetName: um-mmu
            image_name: um-mmu
            testname: um-mmu
            vmlinux_opt: ""
            runs_on: ubuntu-22.04
          - displayTargetName: um-mmu-s
            image_name: um-mmu
            testname: um-mmu-seccomp
            vmlinux_opt: "seccomp=on"
            runs_on: ubuntu-22.04
          - displayTargetName: um-nommu
            image_name: um-nommu
            testname: um-nommu
            vmlinux_opt: ""
            runs_on: ubuntu-22.04
          - displayTargetName: um-nommu-s
            image_name: um-nommu
            testname: um-nommu-seccomp
            vmlinux_opt: "seccomp=on"
            runs_on: ubuntu-22.04
          - displayTargetName: um-nommu-sas-s
            image_name: um-nommu-sas
            testname: um-nommu-sas-seccomp
            vmlinux_opt: ""
            runs_on: ubuntu-22.04
          - displayTargetName: um-nommu-sas-z
            image_name: um-nommu-sas
            testname: um-nommu-sas-zpoline
            vmlinux_opt: "zpoline=1"
            runs_on: ubuntu-22.04
    name: "UML: bench (${{ matrix.testname }}) "
    timeout-minutes: 100
    steps:
      - name: Download tested UML image
        uses: actions/download-artifact@v4
        with:
          name: uml-docker-image-${{ matrix.image_name }}
          path: ${{ runner.temp }}/uml-image
      - name: Load tested UML image
        run: docker load -i "$RUNNER_TEMP/uml-image/uml-image.tar"
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
        with:
          detached: true
      - name: Setup faketty
        uses: Yuri6037/Action-FakeTTY@v1.1
      - name: setup iperf3/netperf server
        run: |
           set -x
           sudo apt update -y
           sudo apt install -y iperf3 netperf
           iperf3 -s &
           ip ad
           ps aux |grep netserver
           ps aux |grep iperf3
           cat /proc/sys/kernel/exec-shield || true
           echo 0 > /proc/sys/kernel/exec-shield || true
      - name: benchmark-1
        run: |
           mkdir -p output
           sudo sh -c "echo 0 > /proc/sys/vm/mmap_min_addr"
           faketty docker run -it -v /dev/shm:/dev/shm --entrypoint /root/vmlinux \
              --rm uml-ci/alpine:3.20.3-${{ matrix.image_name }} \
              mem=2G root=/dev/root rootflags=/ rootfstype=hostfs rw loglevel=8 ${{ matrix.vmlinux_opt }} \
              init=/bench.sh \
             | tee output/${{ matrix.testname }}.dat &
             sleep 100 ; exit
      - name: benchmark-2
        run: |
           mkdir -p output
           ## dynamic build failed at iperf -R
           echo "===========================non-static build may fail...==========================="
           #faketty ./vmlinux vec0:transport=raw,ifname=eth0,depth=128,gro=1 mem=2048m \
           #  root=/dev/root rootflags=`pwd`/rootfs rootfstype=hostfs rw \
           #  loglevel=8 console=tty init=/root/iperf3.sh \
           #  | tee output/${{ matrix.testname }}-seccomp-iperf3.dat
           faketty docker run -it -v /dev/shm:/dev/shm --entrypoint /root/vmlinux \
              --rm uml-ci/alpine:3.20.3-${{ matrix.image_name }} mem=2G \
              vec0:transport=raw,ifname=eth0,depth=128,gro=1  \
              root=/dev/root rootflags=/ rootfstype=hostfs rw loglevel=8 ${{ matrix.bench1_opt }} \
              init=/root/iperf3.sh \
             | tee output/${{ matrix.testname }}-iperf3.dat &
             sleep 300 ; exit
      - uses: actions/upload-artifact@v7
        with:
          name: test-result-${{ matrix.testname }}
          path: output/${{ matrix.testname }}*

  checkpatch:
    runs-on: ubuntu-22.04
    name: checkpatch and co
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1
    steps:
      - name: Set env
        shell: bash
        run: |
          echo "/usr/lib/ccache/bin:/usr/lib/ccache:${{ github.workspace }}/bin" >> $GITHUB_PATH
          echo "export PATH=/usr/lib/ccache/bin:/usr/lib/ccache:${{ github.workspace }}/bin:$PATH" >> $HOME/.bashrc
      - name: Checkout
        with:
          fetch-depth: 0
        uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-checkpatch-ccache-build-${{ github.sha }}
          restore-keys: ${{ runner.os }}-checkpatch-ccache-build-
      - name: Install packages
        run: |
           sudo pip install ply GitPython mypy
           sudo apt update -y
           sudo apt install -y aspell ccache sparse
           git clone https://github.com/daxtens/smart-sparse-diff
      #- name: Setup tmate session
      #  uses: mxschmitt/action-tmate@v3
      #  with:
      #    detached: true
      - name: Fetch UML next for range checks
        run: |
           git remote add uml git://git.kernel.org/pub/scm/linux/kernel/git/uml/linux.git
           git fetch uml next:refs/remotes/uml/next
      #- name: build (sparse)
      #  run: |
      #     make ARCH=um W=1 C=2 CF='-fdiagnostic-prefix -D__CHECK_ENDIAN__ -fmax-errors=unlimited -fmax-warnings=unlimited' defconfig O=build-sparse
      #     make ARCH=um W=1 C=2 CF='-fdiagnostic-prefix -D__CHECK_ENDIAN__ -fmax-errors=unlimited -fmax-warnings=unlimited' O=build-sparse clean
      #     make ARCH=um W=1 C=2 CF='-fdiagnostic-prefix -D__CHECK_ENDIAN__ -fmax-errors=unlimited -fmax-warnings=unlimited' O=build-sparse -j8 2> old-sparse.log 1> /dev/null
      #     git checkout zpoline-nommu-v6.10
      #     git checkout HEAD~1
      #     make ARCH=um W=1 C=2 CF='-fdiagnostic-prefix -D__CHECK_ENDIAN__ -fmax-errors=unlimited -fmax-warnings=unlimited' O=build-sparse -j8 2> new-sparse.log 1> /dev/null
      #     ./smart-sparse-diff/smart-sparse-diff.py old-sparse.log new-sparse.log
      - name: check coding style
        continue-on-error: true
        run: |
           # The CI branch carries workflow and handoff commits without
           # Signed-off-by trailers. Check only commits that change kernel
           # sources; CI metadata is not an upstream kernel patch.
           git rev-list --reverse uml/next..HEAD | while read -r commit; do
             if git diff-tree --no-commit-id --name-only -r "$commit" |
               grep -qEv '^(\.github/workflows/|AGENTS\.md$)'; then
               git format-patch -1 -o p1 "$commit"
             fi
           done
           ./scripts/checkpatch.pl --summary-file --ignore FILE_PATH_CHANGES \
             --ignore AVOID_EXTERNS p1/*.patch
      - name: check spells on commit message
        run: |
           git log uml/next..HEAD |grep -v -E "^commit" > /tmp/a
           aspell list /tmp/a

  build_ltp:
    uses: ./.github/workflows/ci-docker-build.yml
    name: "LTP: build"
  build_ltp_riscv:
    runs-on: ubuntu-latest
    name: "LTP: build (RISC-V, local Buildroot image)"
    timeout-minutes: 100
    permissions:
      contents: read
    needs: [buildroot_riscv]
    steps:
      - name: Download local Buildroot image
        uses: actions/download-artifact@v4
        with:
          name: buildroot-riscv64-nommu-image
          path: ${{ runner.temp }}/buildroot-image
      - name: Load local Buildroot image
        run: docker load -i "$RUNNER_TEMP/buildroot-image/buildroot-riscv-image.tar"
      - name: Checkout canonical CI support files
        uses: actions/checkout@v6
        with:
          ref: ci/uml-nommu
          path: ci-config
      - name: Checkout LTP source
        uses: actions/checkout@v6
        with:
          repository: thehajime/ltp
          ref: fix-nommu
          path: ltp-source
          submodules: recursive
      - name: Build RISC-V LTP in local Buildroot image
        run: |
          mkdir -p "$RUNNER_TEMP/ltp-home" "$RUNNER_TEMP/ltp-riscv-artifact"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/ltp-source:/work-buildroot/ltp" \
            --volume "$GITHUB_WORKSPACE/ci-config/.github/workflows/build-ltp-riscv.sh:/build-ltp-riscv.sh:ro" \
            --volume "$RUNNER_TEMP/ltp-home:/github/home" \
            --volume "$RUNNER_TEMP/ltp-riscv-artifact:/run-artifacts" \
            --workdir /work-buildroot/ltp \
            --entrypoint /bin/bash \
            uml-ci/buildroot-riscv64-nommu:0.1 /build-ltp-riscv.sh
      - name: Upload RISC-V LTP install artifact
        uses: actions/upload-artifact@v4
        with:
          name: ltp-alpine-riscv-nommu.tar.gz
          path: ${{ runner.temp }}/ltp-riscv-artifact/ltp-alpine-riscv-nommu.tar.gz
          if-no-files-found: error
  test_ltp:
    runs-on: ubuntu-latest
    needs: [build_uml, build_ltp, build_ltp_riscv, buildroot_riscv]
    strategy:
      fail-fast: false
      matrix:
        include:
          - displayTargetName: um-mmu
            image_name: uml-ci/alpine:3.20.3-um-mmu
            image_artifact: uml-docker-image-um-mmu
            testname: um-mmu
            vmlinux_opt: ""
            name: um-mmu
          - displayTargetName: um-mmu-s
            image_name: uml-ci/alpine:3.20.3-um-mmu
            image_artifact: uml-docker-image-um-mmu
            testname: um-mmu-seccomp
            vmlinux_opt: "seccomp=on"
            name: um-mmu
          - displayTargetName: um-nommu
            image_name: uml-ci/alpine:3.20.3-um-nommu
            image_artifact: uml-docker-image-um-nommu
            testname: um-nommu
            vmlinux_opt: ""
            name: um-nommu
          - displayTargetName: um-nommu-s
            image_name: uml-ci/alpine:3.20.3-um-nommu
            image_artifact: uml-docker-image-um-nommu
            testname: um-nommu-seccomp
            vmlinux_opt: "seccomp=on"
            name: um-nommu
          - displayTargetName: qemu-riscv-nommu
            image_name: uml-ci/buildroot-riscv64-nommu:0.1
            image_artifact: buildroot-riscv64-nommu-image
            testname: riscv-nommu
            vmlinux_opt: ""
            name: riscv-nommu
          - displayTargetName: native
            image_name: alpine:3.20.3
            image_artifact: ''
            testname: native
            vmlinux_opt: ""
            name: um-mmu
            docker_opt: "-v /lib/modules:/lib/modules"
          - displayTargetName: um-nommu-sas-s
            image_name: uml-ci/alpine:3.20.3-um-nommu-sas
            image_artifact: uml-docker-image-um-nommu-sas
            testname: um-nommu-sas-seccomp
            vmlinux_opt: ""
            name: um-nommu
          - displayTargetName: um-nommu-sas-z
            image_name: uml-ci/alpine:3.20.3-um-nommu-sas
            image_artifact: uml-docker-image-um-nommu-sas
            testname: um-nommu-sas-zpoline
            vmlinux_opt: "zpoline=1"
            name: um-nommu
    name: "LTP: test-${{ matrix.testname }}"
    steps:
      - name: Download local test image
        if: matrix.image_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image_artifact }}
          path: ${{ runner.temp }}/local-image
      - name: Load local test image
        if: matrix.image_artifact != ''
        run: docker load -i "$(find "$RUNNER_TEMP/local-image" -maxdepth 1 -name '*.tar' -print -quit)"
      - name: Pull native Alpine test image
        if: matrix.testname == 'native'
        run: docker pull alpine:3.20.3
      - uses: actions/checkout@v6
      - name: Checkout LTP test support files
        uses: actions/checkout@v6
        with:
          repository: thehajime/ltp
          ref: fix-nommu
          path: ltp-source
          submodules: recursive
      - uses: actions/download-artifact@v7
        with:
          name: ltp-alpine-${{ matrix.name }}.tar.gz
          path: ${{ runner.temp }}/ltp-install
      - name: Create local test container
        run: |
          install -d "$RUNNER_TEMP/ltp-home"
          docker create --name ltp-test --privileged -t \
            -v /boot:/boot -v /home:/home -v /dev:/dev \
            ${{ matrix.docker_opt }} \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -v "$RUNNER_TEMP/ltp-install:/ltp-install-artifacts" \
            -v "$RUNNER_TEMP/ltp-home:/github/home" \
            -v "$GITHUB_WORKSPACE/ltp-source:/ltp-source:ro" \
            --entrypoint /bin/sh "${{ matrix.image_name }}" -c 'sleep infinity'
          docker start ltp-test
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
        with:
          detached: true
      - name: Extract test programs and run LTP
        env:
          LTP_TESTNAME: ${{ matrix.testname }}
          LTP_ARTIFACT_NAME: ${{ matrix.name }}
          UML_OPTIONS: ${{ matrix.vmlinux_opt }}
          LTP_TIMEOUT_MUL: 10
        run: |
          case "$LTP_TESTNAME" in
            um-nommu*)
              docker exec -e LTP_TESTNAME -e LTP_ARTIFACT_NAME -e UML_OPTIONS -e LTP_TIMEOUT_MUL ltp-test \
                /tmp/busybox-host sh -x /github/workspace/.github/workflows/run-ltp-job.sh
              ;;
            *)
              docker exec -e LTP_TESTNAME -e LTP_ARTIFACT_NAME -e UML_OPTIONS -e LTP_TIMEOUT_MUL ltp-test \
                /bin/sh -c 'if command -v bash >/dev/null 2>&1; then \
                  exec bash -x /github/workspace/.github/workflows/run-ltp-job.sh; \
                else \
                  exec /bin/sh -x /github/workspace/.github/workflows/run-ltp-job.sh; \
                fi'
              ;;
          esac
      - name: Stop local test container
        if: always()
        run: docker rm -f ltp-test || true

      - uses: actions/upload-artifact@v7
        id: upload_html
        with:
          name: ltp-result-${{ matrix.testname }}.html
          path: output/ltp/ltp-result-${{ matrix.testname }}.html
          archive: false
      - name: retrieve artifact URL
        run: |
          echo "${{ matrix.testname }} report: ${{ steps.upload_html.outputs.artifact-url }}" > \
             output/ltp/${{ matrix.testname }}-url.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-result-ltp-${{ matrix.testname }}
          path: output/ltp/*

  bench-result:
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    name: bench-result
    needs: [build_uml,benchmark,test_ltp]
    permissions:
      actions: read
      contents: read
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
            path: output
            pattern: test-result-*
            merge-multiple: true
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
            path: output/kunit-results
            pattern: kunit-results-*
      - name: Display structure of downloaded files
        run: mkdir -p output && ls -R output || true
      - name: Install packages
        if: ${{ needs.benchmark.result == 'success' }}
        run: |
          sudo apt update -y
          sudo apt install -y gnuplot lmbench iperf3 netperf jq
      - name: benchmark-host
        if: ${{ needs.benchmark.result == 'success' }}
        run: |
           mkdir -p output
           sudo ln -s /usr/include/x86_64-linux-gnu/sys /usr/include/sys
           sudo mkdir -p /var/tmp/lmbench/
           sudo chown ${USER} /var/tmp/lmbench/
           sh .github/workflows/lmbench_run.sh |& tee output/native.dat
           gcc -o do_getpid .github/workflows/do_getpid.c
           ./do_getpid -c 100 | tee -a output/native.dat
           iperf3 -s &
           iperf3 -c localhost -fm | tee output/native-iperf3.dat
           iperf3 -c localhost -fm -R | tee -a output/native-iperf3.dat
           bash .github/workflows/netperf-bench.sh localhost netperf | tee -a output/native-iperf3.dat
      - name: bench data parse/out
        if: ${{ needs.benchmark.result == 'success' }}
        run: |
          bash .github/workflows/um-nommu-plot.sh output |& tee um-nommu.log
          bash .github/workflows/netperf-plot.sh output |& tee -a um-nommu.log
      - uses: actions/upload-artifact@v7
        if: ${{ needs.benchmark.result == 'success' }}
        with:
          name: test-result-all
          path: output/out/*
      - name: Load previous result snapshot
        uses: actions/github-script@v9
        env:
          SNAPSHOT_PATH: ${{ runner.temp }}/previous-results.json
        with:
          script: |
            const fs = require('fs');
            const zlib = require('zlib');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4,
              per_page: 100
            });
            let snapshot = null;
            for (const comment of comments.reverse()) {
              const match = comment.body.match(/<!-- uml-ci-result-snapshot:v1\n([A-Za-z0-9+/=\r\n]+)\n-->/);
              if (!match) continue;
              snapshot = JSON.parse(zlib.gunzipSync(Buffer.from(match[1].replace(/\s/g, ''), 'base64')).toString());
              break;
            }
            fs.writeFileSync(process.env.SNAPSHOT_PATH, JSON.stringify(snapshot));
            core.info(snapshot ? `Loaded baseline from ${snapshot.run_url}` : 'No prior report snapshot found');
      - name: Create comparison report
        env:
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_SHA: ${{ github.sha }}
          TESTED_REF: ${{ inputs.kernel_ref || (github.ref_name == 'ci/uml-nommu' && 'feature-swmmu-nommu') || github.ref_name }}
          BUILD_STATUS: ${{ needs.build_uml.result }}
          BENCHMARK_STATUS: ${{ needs.benchmark.result }}
          LTP_STATUS: ${{ needs.test_ltp.result }}
        run: |
          python3 .github/workflows/result-report.py \
            --data-dir output \
            --previous "$RUNNER_TEMP/previous-results.json" \
            --snapshot "$RUNNER_TEMP/result-snapshot.json" \
            --report "$RUNNER_TEMP/comparison-report.md" \
            --run-url "$REPORT_URL" \
            --sha "$REPORT_SHA" \
            --tested-ref "$TESTED_REF" \
            --build-status "$BUILD_STATUS" \
            --benchmark-status "$BENCHMARK_STATUS" \
            --ltp-status "$LTP_STATUS"
      - name: Build GitHub Pages report
        run: |
          python3 .github/workflows/result-page.py \
            --snapshot "$RUNNER_TEMP/result-snapshot.json" \
            --report "$RUNNER_TEMP/comparison-report.md" \
            --charts output/out \
            --output "$RUNNER_TEMP/site"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy report to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
      - name: prepare action post
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            cat um-nommu.log 2>/dev/null || true
            if [ -n "$PAGE_URL" ]; then
              printf '\n### Benchmark charts and result data\n\n[Open this run\x27s report on GitHub Pages](%s)\n\n' "$PAGE_URL"
            else
              printf '\n### Benchmark charts and result data\n\nGitHub Pages deployment did not return a URL; see the workflow artifacts.\n\n'
            fi
            cat "$RUNNER_TEMP/comparison-report.md"
          } > "$RUNNER_TEMP/comment.md"
      - uses: actions/upload-artifact@v7
        with:
          name: uml-ci-comparison-report
          path: |
            ${{ runner.temp }}/comment.md
            ${{ runner.temp }}/result-snapshot.json
            ${{ runner.temp }}/site
      - uses: actions/github-script@v9
        env:
          COMMENT_BODY_FILE: ${{ runner.temp }}/comment.md
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              issue_number: 4,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync(process.env.COMMENT_BODY_FILE, 'utf8')
            })
