name: Diagnose NOMMU SWMMU setns02

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: CI run containing the kernel image and instrumented LTP build
        required: true
        type: string
        default: '39761233295'
      run_nginx:
        description: Run the SWMMU zpoline nginx TLS packet/GDB diagnostic
        required: false
        type: boolean
        default: false
      run_timer:
        description: Compare clock_gettime04 with and without UML virtualization override
        required: false
        type: boolean
        default: false
      swmmu_direct:
        description: Enable the SWMMU direct window for Kirk/Python profiling
        required: false
        type: boolean
        default: true
      nginx_source_run_id:
        description: CI run containing the candidate nginx rootfs and UML image
        required: false
        type: string
        default: '39753406782'
      timer_source_run_id:
        description: CI run containing the candidate UML image and uninstrumented LTP build
        required: false
        type: string
        default: '39753406782'

permissions:
  actions: read
  contents: read

jobs:
  setns02-gdb:
    if: ${{ !inputs.run_nginx && !inputs.run_timer }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Download candidate UML image
        uses: actions/download-artifact@v7
        with:
          name: uml-docker-image-um-nommu-sas
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/uml-image

      - name: Download instrumented LTP install tree
        uses: actions/download-artifact@v7
        with:
          name: ltp-alpine-um-nommu.tar.gz
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ltp-install

      - name: Extract UML kernel and LTP runtime
        run: |
          set -euo pipefail
          docker load -i "$(find "$RUNNER_TEMP/uml-image" -maxdepth 1 -name '*.tar' -print -quit)"
          image=uml-ci/alpine:edge-um-nommu-sas
          cid=$(docker create "$image")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/root/vmlinux" "$RUNNER_TEMP/vmlinux"
          docker rm "$cid" >/dev/null
          trap - EXIT
          chmod 0755 "$RUNNER_TEMP/vmlinux"
          mkdir -p "$RUNNER_TEMP/ltp-root" "$RUNNER_TEMP/ltp-home"
          tar -xzf "$RUNNER_TEMP/ltp-install/ltp-alpine-um-nommu.tar.gz" \
            -C "$RUNNER_TEMP/ltp-root"
          test -x "$RUNNER_TEMP/ltp-root/opt/ltp/kirk"

      - name: Install GDB
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb

      - name: Check out matching LTP reporting helpers
        uses: actions/checkout@v6
        with:
          repository: thehajime/ltp
          ref: hajime/nommu-runtime-upstream
          path: ltp-source
          submodules: recursive

      - name: Create privileged UML test container
        run: |
          set -euo pipefail
          docker_args=(
            --name ltp-setns-debug --privileged -t
            -v /boot:/boot -v /home:/home -v /dev:/dev
            -v "$GITHUB_WORKSPACE:/github/workspace"
            -v "$RUNNER_TEMP/ltp-root/opt/ltp:/opt/ltp"
            -v "$RUNNER_TEMP/ltp-home:/github/home"
            -v "$GITHUB_WORKSPACE/ltp-source:/ltp-source:ro"
          )
          docker create "${docker_args[@]}" \
            --entrypoint /opt/uml-host-tools/busybox \
            uml-ci/alpine:edge-um-nommu-sas \
            sh -c 'exec /opt/uml-host-tools/busybox sleep infinity'
          docker start ltp-setns-debug

      - name: Run Kirk setns02 under host GDB
        env:
          UML_OPTIONS: zpoline=1 swmmu_direct=1
        run: |
          set -uo pipefail
          mkdir -p output/ltp
          chmod 0755 .github/workflows/ltp-direct-exec.sh
          cat > "$RUNNER_TEMP/setns-gdb.cmd" <<'GDB'
          set pagination off
          set confirm off
          set breakpoint pending on
          handle SIGSYS nostop noprint pass
          break show_segv_info
          commands
            silent
            printf "GDB_UNHANDLED_USER_FAULT_PATH\n"
            info args
            p *regs
            bt 30
            continue
          end
          break sys_sethostname
          commands
            silent
            printf "GDB_SETHOSTNAME\n"
            info args
            bt 20
            continue
          end
          break sys_setns
          commands
            silent
            set $last_setns_fd = $rdi
            set $last_setns_flags = $rsi
            printf "GDB_SETNS_ENTRY fd=%d flags=0x%x\n", $rdi, $rsi
            info registers rip rsp rdi rsi rdx rax
            bt 12
            continue
          end
          break ../kernel/nsproxy.c:606
          commands
            silent
            printf "GDB_SETNS_RETURN fd=%d flags=0x%x result=%lld\n", $last_setns_fd, $last_setns_flags, $rax
            continue
          end
          continue
          GDB

          (
            while docker inspect ltp-setns-debug >/dev/null 2>&1; do
              pid=$(docker top ltp-setns-debug -eo pid,args 2>/dev/null |
                awk '$0 ~ /vmlinux/ && $0 !~ /awk/ {print $1; exit}')
              if [ -n "$pid" ]; then
                sudo timeout --foreground --signal=TERM --kill-after=3s 180s \
                  gdb -q -batch -x "$RUNNER_TEMP/setns-gdb.cmd" \
                  "$RUNNER_TEMP/vmlinux" -p "$pid"
                exit $?
              fi
              sleep 0.1
            done
            echo 'GDB monitor did not find UML vmlinux' >&2
            exit 1
          ) > output/ltp/setns02-gdb.log 2>&1 &
          gdb_monitor=$!

          timeout --foreground --signal=TERM --kill-after=5s 240s \
            docker exec -t ltp-setns-debug \
              /opt/uml-host-tools/busybox sh -c \
              'exec /root/vmlinux root=/dev/root rootflags=/ rootfstype=hostfs rw mem=2048m loglevel=8 console=tty zpoline=1 swmmu_direct=1 init=/github/workspace/.github/workflows/ltp-direct-exec.sh LTP_DIRECT_TEST=setns02 LTP_DIRECT_MODE=kirk PYTHONPROFILEIMPORTTIME=1' \
              2>&1 | tee output/ltp/setns02-ltp.log
          ltp_status=${PIPESTATUS[0]}
          wait "$gdb_monitor" || true
          if [ "$ltp_status" -ne 0 ]; then
            exit "$ltp_status"
          fi
          if ! jq -e '[.results[] | select(.test_fqn == "setns02" and .status == "pass")] | length == 1' \
            output/ltp/kirk-setns02.json >/dev/null; then
            echo 'Kirk did not report setns02 as passing' >&2
            jq -r '.results[] | select(.test_fqn == "setns02") | [.status, (.test.retval | join(",")), .test.log] | @tsv' \
              output/ltp/kirk-setns02.json 2>/dev/null || true
            exit 1
          fi
          exit "$ltp_status"

      - name: Upload setns02 result and GDB trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: setns02-gdb-diagnostics
          path: output/ltp/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop UML test container
        if: always()
        run: docker rm -f ltp-setns-debug || true

  nginx-tls-gdb-pcap:
    if: ${{ inputs.run_nginx }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Download candidate UML image
        uses: actions/download-artifact@v7
        with:
          name: uml-docker-image-um-nommu-sas
          run-id: ${{ inputs.nginx_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/uml-image

      - name: Download candidate nginx rootfs
        uses: actions/download-artifact@v7
        with:
          name: nginx-rootfs-sas
          run-id: ${{ inputs.nginx_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/nginx-rootfs-artifact

      - name: Extract exact candidate kernel and rootfs
        run: |
          set -euo pipefail
          docker load -i "$(find "$RUNNER_TEMP/uml-image" -maxdepth 1 -name '*.tar' -print -quit)"
          cid=$(docker create uml-ci/alpine:edge-um-nommu-sas)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/root/vmlinux" "$RUNNER_TEMP/vmlinux"
          docker rm "$cid" >/dev/null
          trap - EXIT
          chmod 0755 "$RUNNER_TEMP/vmlinux"
          mkdir -p rootfs
          tar -xzf "$RUNNER_TEMP/nginx-rootfs-artifact/rootfs.tar.gz" -C rootfs
          cat > rootfs/sbin/nginx-capture-maps <<'GUEST'
          #!/bin/sh
          sleep 1
          {
            printf 'NGINX_GUEST_PROC_MAPS\n'
            for proc in /proc/[0-9]*; do
              [ -r "$proc/comm" ] || continue
              [ "$(cat "$proc/comm")" = nginx ] || continue
              printf '\nPID %s (%s)\n' "${proc#/proc/}" "$(tr '\n' ' ' < "$proc/cmdline")"
              cat "$proc/maps"
            done
          } >> /run/nginx-runtime-probe.log
          GUEST
          chmod 0755 rootfs/sbin/nginx-capture-maps
          sed -i '/^nginx -c \/etc\/nginx\/nginx-swmmu.conf$/a /sbin/nginx-capture-maps' \
            rootfs/sbin/swmmu-nginx-init
          grep -q '^/sbin/nginx-capture-maps$' rootfs/sbin/swmmu-nginx-init

      - name: Install host tracing and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl gdb iproute2 libcap2-bin tcpdump wrk

      - name: Run one SWMMU SAS zpoline TLS diagnostic
        env:
          PROFILE: um-nommu-sas-zpoline
          WORKERS: '1'
          NCPUS: '1'
          CONNECTIONS: '4'
          THREADS: '2'
          NEEDS_RAWIO: 'true'
          KERNEL_ARGS: zpoline=1${{ inputs.swmmu_direct && ' swmmu_direct=1' || '' }}
          NGINX_WRK_TIMEOUT_SECONDS: '60'
          NGINX_WRK_WARMUP_TIMEOUT_SECONDS: '90'
          NGINX_TLS_CURL_TIMEOUT: '60'
        run: |
          set -euo pipefail
          kernel_sha=$(sed -n 's/^kernel_sha=//p' "$RUNNER_TEMP/nginx-rootfs-artifact/manifest.txt")
          aports_sha=$(sed -n 's/^aports_sha=//p' "$RUNNER_TEMP/nginx-rootfs-artifact/manifest.txt")
          gcc_version=$(sed -n 's/^gcc_version=//p' "$RUNNER_TEMP/nginx-rootfs-artifact/manifest.txt")
          bash .github/workflows/run-nginx-benchmark.sh \
            --kernel "$RUNNER_TEMP/vmlinux" --rootfs rootfs \
            --workers "$WORKERS" --ncpus "$NCPUS" --threads "$THREADS" \
            --connections "$CONNECTIONS" --duration 30 \
            --profile "$PROFILE" --kernel-args "$KERNEL_ARGS" \
            --needs-rawio "$NEEDS_RAWIO" --kernel-sha "$kernel_sha" \
            --aports-sha "$aports_sha" --gcc-version "$gcc_version" \
            --output output/nginx-tls-diagnostic

      - name: Upload TLS packet and GDB diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nginx-swmmu-zpoline-tls-diagnostics
          path: output/nginx-tls-diagnostic/
          if-no-files-found: warn
          retention-days: 14

  clock-gettime-virt-check:
    if: ${{ inputs.run_timer }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Download candidate UML image
        uses: actions/download-artifact@v7
        with:
          name: uml-docker-image-um-nommu-sas
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/uml-image

      - name: Download uninstrumented LTP build
        uses: actions/download-artifact@v7
        with:
          name: ltp-alpine-um-nommu.tar.gz
          run-id: ${{ inputs.timer_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ltp-install

      - name: Extract candidate UML kernel and LTP runtime
        run: |
          set -euo pipefail
          docker load -i "$(find "$RUNNER_TEMP/uml-image" -maxdepth 1 -name '*.tar' -print -quit)"
          cid=$(docker create uml-ci/alpine:edge-um-nommu-sas)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/root/vmlinux" "$RUNNER_TEMP/vmlinux"
          docker rm "$cid" >/dev/null
          trap - EXIT
          chmod 0755 "$RUNNER_TEMP/vmlinux"
          mkdir -p "$RUNNER_TEMP/ltp-root" "$RUNNER_TEMP/ltp-home"
          tar -xzf "$RUNNER_TEMP/ltp-install/ltp-alpine-um-nommu.tar.gz" \
            -C "$RUNNER_TEMP/ltp-root"
          test -x "$RUNNER_TEMP/ltp-root/opt/ltp/kirk"

      - name: Check out matching LTP reporting helpers
        uses: actions/checkout@v6
        with:
          repository: thehajime/ltp
          ref: hajime/nommu-runtime-upstream
          path: ltp-source
          submodules: recursive

      - name: Create privileged UML test container
        run: |
          set -euo pipefail
          docker_args=(
            --name ltp-clock-debug --privileged -t
            -v /boot:/boot -v /home:/home -v /dev:/dev
            -v "$GITHUB_WORKSPACE:/github/workspace"
            -v "$RUNNER_TEMP/ltp-root/opt/ltp:/opt/ltp"
            -v "$RUNNER_TEMP/ltp-home:/github/home"
            -v "$GITHUB_WORKSPACE/ltp-source:/ltp-source:ro"
          )
          docker create "${docker_args[@]}" \
            --entrypoint /opt/uml-host-tools/busybox \
            uml-ci/alpine:edge-um-nommu-sas \
            sh -c 'exec /opt/uml-host-tools/busybox sleep infinity'
          docker start ltp-clock-debug

      - name: Compare direct and Kirk runs for timing and setns cases
        env:
          UML_OPTIONS: zpoline=1
          SWMMU_DIRECT: ${{ inputs.swmmu_direct }}
        run: |
          set -uo pipefail
          mkdir -p output/ltp
          chmod 0755 .github/workflows/ltp-direct-exec.sh
          direct_arg=
          if [ "${SWMMU_DIRECT:-true}" = true ]; then
            direct_arg=swmmu_direct=1
          fi
          run_guest() {
            local override=${1:-}
            local label=${2:-default}
            local test_name=${3:-clock_gettime04}
            local mode=${4:-direct}
            local status=0
            local virt_arg=
            local profile_arg=
            local timeout_seconds=120
            if [ -n "$override" ]; then
              virt_arg="LTP_VIRT_OVERRIDE=$override"
            fi
            if [ "$mode" = kirk ]; then
              profile_arg=PYTHONPROFILEIMPORTTIME=1
              timeout_seconds=360
            fi
            timeout --foreground --signal=TERM --kill-after=5s "${timeout_seconds}s" \
              docker exec -t ltp-clock-debug \
                /opt/uml-host-tools/busybox sh -c \
                "/root/vmlinux root=/dev/root rootflags=/ rootfstype=hostfs rw mem=2048m loglevel=8 console=tty zpoline=1 $direct_arg init=/github/workspace/.github/workflows/ltp-direct-exec.sh LTP_DIRECT_TEST=$test_name LTP_DIRECT_MODE=$mode $virt_arg $profile_arg" \
                2>&1 | tee "output/ltp/${test_name}-${label}-${mode}.log" || status=${PIPESTATUS[0]}
            return "$status"
          }

          run_guest '' default clock_gettime04 direct || true
          run_guest other uml-override clock_gettime04 direct || true
          run_guest '' kirk clock_gettime04 kirk || true
          run_guest '' zpoline nanosleep01 direct || true
          run_guest '' kirk nanosleep01 kirk || true
          run_guest '' kirk-setns setns02 kirk || true
          missing=0
          for result in direct-clock_gettime04.status kirk-clock_gettime04.status \
            direct-nanosleep01.status \
            kirk-nanosleep01.status kirk-setns02.status; do
            if [ ! -s "output/ltp/$result" ]; then
              echo "Missing diagnostic test status: $result" >&2
              missing=1
            elif [ "$(cat "output/ltp/$result")" != 0 ]; then
              echo "Diagnostic test failed: $result=$(cat "output/ltp/$result")" >&2
              missing=1
            fi
          done
          for test_name in clock_gettime04 nanosleep01 setns02; do
            result="output/ltp/kirk-${test_name}.json"
            if ! jq -e --arg test "$test_name" \
              '[.results[] | select(.test_fqn == $test and .status == "pass")] | length == 1' \
              "$result" >/dev/null; then
              echo "Kirk test did not pass: $test_name" >&2
              missing=1
            fi
          done
          grep -nE 'LTP_DIRECT_|Running in a virtual machine|TFAIL:|TBROK:|TPASS:|Summary:' \
            output/ltp/clock_gettime04-*.log output/ltp/nanosleep01-*.log \
            output/ltp/setns02-*.log
          exit "$missing"

      - name: Upload clock_gettime04 comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clock-gettime04-uml-override-diagnostic
          path: output/ltp/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop UML test container
        if: always()
        run: docker rm -f ltp-clock-debug || true
