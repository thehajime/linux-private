name: nginx benchmark matrix

on:
  workflow_call:
    inputs:
      source_run_id:
        type: string
        default: ''
      profile:
        type: string
        default: ''
      capture_diagnostics:
        type: boolean
        default: false
      control_channel:
        type: string
        default: auto
      single_cell:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed kernel/rootfs artifacts to reuse without rebuilding'
        type: string
        required: true
      profile:
        type: choice
        default: um-nommu-sas-zpoline
        options: [um-mmu, um-mmu-seccomp, um-nommu, um-nommu-seccomp, um-nommu-plain-sas, um-nommu-plain-sas-zpoline, um-nommu-sas-seccomp, um-nommu-sas-zpoline]
      capture_diagnostics:
        type: boolean
        default: true
      control_channel:
        type: choice
        default: auto
        options: [auto, legacy, serial]
      single_cell:
        description: 'Run only CPUs=1, workers=1, connections=1 for focused diagnosis'
        type: boolean
        default: false

jobs:
  nginx_benchmark:
    name: "nginx ${{ matrix.profile == 'um-mmu' && 'um-mmu(p)' || matrix.profile == 'um-mmu-seccomp' && 'um-mmu(s)' || matrix.profile == 'um-nommu' && 'um-nommu(p)' || matrix.profile == 'um-nommu-seccomp' && 'um-nommu(s)' || matrix.profile == 'um-nommu-plain-sas' && 'um-nommu-sas(s)' || matrix.profile == 'um-nommu-plain-sas-zpoline' && 'um-nommu-sas(z)' || matrix.profile == 'um-nommu-sas-seccomp' && 'um-nommu-sas-swmmu(s)' || 'um-nommu-sas-swmmu(z)' }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ inputs.profile && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["um-mmu", "um-mmu-seccomp", "um-nommu", "um-nommu-seccomp", "um-nommu-plain-sas", "um-nommu-plain-sas-zpoline", "um-nommu-sas-seccomp", "um-nommu-sas-zpoline"]') }}
    env:
      NGINX_DIAGNOSTICS: ${{ inputs.capture_diagnostics && '1' || '0' }}
      NGINX_CONTROL_CHANNEL: ${{ inputs.control_channel || 'auto' }}
      NGINX_SINGLE_CELL: ${{ inputs.single_cell && '1' || '0' }}
      NGINX_PROFILE: ${{ matrix.profile }}
      NGINX_IMAGE_NAME: ${{ (matrix.profile == 'um-nommu-sas-seccomp' || matrix.profile == 'um-nommu-sas-zpoline') && 'um-nommu-sas' || startsWith(matrix.profile, 'um-mmu') && 'um-mmu' || (matrix.profile == 'um-nommu-plain-sas' || matrix.profile == 'um-nommu-plain-sas-zpoline') && 'um-nommu-plain-sas' || 'um-nommu' }}
      NGINX_ROOTFS_ARTIFACT: ${{ (matrix.profile == 'um-nommu-sas-seccomp' || matrix.profile == 'um-nommu-sas-zpoline') && 'nginx-rootfs-sas' || startsWith(matrix.profile, 'um-mmu') && 'nginx-rootfs-mmu' || 'nginx-rootfs-nommu' }}
    steps:
      - name: Check out CI benchmark helpers
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/workflows
      - name: Create profile output directory
        run: mkdir -p "output/${{ matrix.profile }}"
      - name: Download the shared profile rootfs
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.NGINX_ROOTFS_ARTIFACT }}
          path: ${{ runner.temp }}/nginx-rootfs
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the tested UML image
        uses: actions/download-artifact@v4
        with:
          name: uml-docker-image-${{ env.NGINX_IMAGE_NAME }}
          path: ${{ runner.temp }}/uml-image
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract the tested kernel
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/uml-image/uml-image.tar"
          cid=$(docker create "uml-ci/alpine:edge-${NGINX_IMAGE_NAME}")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/root/vmlinux" "$RUNNER_TEMP/vmlinux"
          docker rm "$cid" >/dev/null
          trap - EXIT
          chmod 0755 "$RUNNER_TEMP/vmlinux"
          test -s "$RUNNER_TEMP/nginx-rootfs/rootfs.tar.gz"
      - name: Install UML host networking and capability tools
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          sudo apt-get update
          host_tools=(iproute2 libcap2-bin curl wrk)
          if [[ "$NGINX_DIAGNOSTICS" == 1 || "$PROFILE" == um-nommu-sas-* ]]; then
            host_tools+=(tcpdump gdb strace)
          fi
          sudo apt-get install -y --no-install-recommends "${host_tools[@]}"
      - name: Run worker, connection and CPU combinations for this profile
        env:
          NGINX_SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
          NGINX_HELPER_COMMIT: ${{ github.sha }}
          NGINX_WRK_TIMEOUT_SECONDS: ${{ (matrix.profile == 'um-nommu-sas-seccomp' || matrix.profile == 'um-nommu-sas-zpoline') && '60' || '30' }}
          NGINX_WRK_WARMUP_TIMEOUT_SECONDS: ${{ (matrix.profile == 'um-nommu-sas-seccomp' || matrix.profile == 'um-nommu-sas-zpoline') && '90' || '60' }}
        run: |
          bash .github/workflows/run-nginx-profile-matrix.sh \
            '${{ matrix.profile }}' "$RUNNER_TEMP/vmlinux" \
            "$RUNNER_TEMP/nginx-rootfs/rootfs.tar.gz" output
      - name: Show this profile's results
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -uo pipefail
          find "output/$PROFILE" -name measurement.json -print0 | sort -z | \
            while IFS= read -r -d '' result; do
              python3 - "$result" >>"$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(f"### nginx: {result.get('profile')} / CPUs={result.get('ncpus')} / workers={result.get('workers')} / connections={result.get('connections')}")
          print(f"\n**Status:** {result.get('status')}  ")
          print(f"**Requests/sec:** {result.get('requests_per_second')}  ")
          print(f"**Mean latency (ms):** {result.get('average_latency_ms')}  ")
          if result.get('observed_workers') is not None:
              print(f"**Observed nginx processes:** {result.get('observed_workers')}  ")
          print(f"**HTTP/TLS smoke:** {result.get('smoke_http')} / {result.get('smoke_tls')}")
          for failure in result.get('failures') or []:
              print(f"- {failure}")
          PY
            done
      - name: Upload this profile's raw logs and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-result-${{ matrix.profile }}
          path: output/${{ matrix.profile }}
          if-no-files-found: error
