name: Focused UML ccache validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_0:
    name: "UML build-0 (${{ matrix.testname }})"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - testname: um-mmu
            defconfig: x86_64_defconfig
            add_configs: 'CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"'
          - testname: um-mmu-tt
            defconfig: x86_64_defconfig
            add_configs: 'CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR" CFLAGS+="-DCONFIG_UML_TIME_TRAVEL_SUPPORT" CFLAGS+="-DCONFIG_UML_MAX_USERSPACE_ITERATIONS=100000"'
          - testname: um-nommu
            defconfig: x86_64_defconfig
            add_configs: 'CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"'
          - testname: um-nommu-sas
            defconfig: x86_64_defconfig
            add_configs: 'CONFIG_UML_NET_VECTOR=y CFLAGS+="-DCONFIG_UML_NET_VECTOR"'
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1
    steps:
      - uses: actions/checkout@v6
        with:
          repository: thehajime/linux-private
          ref: feature-swmmu-nommu
      - name: Configure compiler cache path
        run: echo "/usr/lib/ccache/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.testname }}-ccache-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-${{ matrix.testname }}-ccache-build-
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache bc bison build-essential flex libcap-dev libcap-ng-dev libelf-dev libmnl-dev libmbedtls-dev libnuma-dev libssl-dev liburing-dev
      - name: Confirm ccache compiler routing
        run: |
          compiler=$(command -v gcc)
          echo "gcc resolves to: $compiler"
          case "$compiler" in /usr/lib/ccache/*) ;; *) echo "gcc bypasses ccache" >&2; exit 1 ;; esac
          ccache --zero-stats
      - name: Prepare NOMMU config
        if: matrix.testname == 'um-nommu' || matrix.testname == 'um-nommu-sas'
        run: |
          echo "# CONFIG_MMU is not set" >> arch/um/configs/${{ matrix.defconfig }}
          if [[ "${{ matrix.testname }}" == um-nommu-sas ]]; then
            echo "CONFIG_UML_NOMMU_SAS=y" >> arch/um/configs/${{ matrix.defconfig }}
          else
            echo "# CONFIG_NOMMU_SWMMU_DEFAULT_ON is not set" >> arch/um/configs/${{ matrix.defconfig }}
          fi
      - name: build-0 (static)
        id: build
        run: |
          started=$(date +%s)
          curl --fail --location --retry 3 -o ltp-add.config https://raw.githubusercontent.com/thehajime/ltp/refs/heads/fix-nommu/tools/buildroot/ltp-add.config
          cat ltp-add.config >> arch/um/configs/${{ matrix.defconfig }}
          make ARCH=um ${{ matrix.defconfig }} O=build
          if [[ "${{ matrix.testname }}" == um-nommu ]]; then
            scripts/config --file build/.config --disable NOMMU_SWMMU_DEFAULT_ON --disable NOMMU_SWMMU
            make ARCH=um O=build olddefconfig
            ! grep -q '^CONFIG_NOMMU_SWMMU_DEFAULT_ON=y$' build/.config
            ! grep -q '^CONFIG_NOMMU_SWMMU=y$' build/.config
            ! grep -q '^CONFIG_GCC_PLUGIN_SWMMU=y$' build/.config
          elif [[ "${{ matrix.testname }}" == um-nommu-sas ]]; then
            scripts/config --file build/.config --enable NOMMU_SWMMU --enable NOMMU_SWMMU_DEFAULT_ON --enable UML_NOMMU_SAS
            make ARCH=um O=build olddefconfig
            grep -q '^CONFIG_NOMMU_SWMMU=y$' build/.config
            grep -q '^CONFIG_UML_NOMMU_SAS=y$' build/.config
          fi
          sed 's/.*CONFIG_STATIC_LINK.*/CONFIG_STATIC_LINK=y/' build/.config > /tmp/config
          mv /tmp/config build/.config
          make -j8 ARCH=um O=build ${{ matrix.add_configs }}
          elapsed=$(($(date +%s) - started))
          echo "seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "build-0 elapsed: ${elapsed}s"
          if (( elapsed >= 60 )); then
            echo "build-0 exceeded the 60-second cache effectiveness threshold" >&2
            exit 1
          fi
      - name: Report ccache statistics
        if: always()
        run: ccache --show-stats
      - name: Save build timing and cache statistics
        if: always()
        run: |
          mkdir -p output
          printf 'profile=%s\nbuild0_seconds=%s\n' '${{ matrix.testname }}' '${{ steps.build.outputs.seconds }}' > output/${{ matrix.testname }}.txt
          ccache --show-stats >> output/${{ matrix.testname }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ccache-${{ matrix.testname }}
          path: output/${{ matrix.testname }}.txt
          if-no-files-found: warn
