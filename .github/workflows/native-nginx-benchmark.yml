name: native nginx benchmark matrix

on:
  workflow_call:

jobs:
  native_nginx_benchmark:
    name: "native nginx benchmark"
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 4]
        connections: [4, 16, 64]
        wrk_threads: [2]
    steps:
      - name: Check out benchmark helper
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/workflows
      - name: Install native nginx benchmark tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nginx wrk curl openssl
      - name: Measure native nginx
        env:
          WORKERS: ${{ matrix.workers }}
          THREADS: ${{ matrix.wrk_threads }}
          CONNECTIONS: ${{ matrix.connections }}
        run: |
          bash .github/workflows/run-native-nginx-benchmark.sh \
            --workers "$WORKERS" --threads "$THREADS" \
            --connections "$CONNECTIONS" --duration 30 \
            --output "output/native/w${WORKERS}-n1-c${CONNECTIONS}"
      - name: Ensure a structured result exists after setup failures
        if: always()
        env:
          WORKERS: ${{ matrix.workers }}
          THREADS: ${{ matrix.wrk_threads }}
          CONNECTIONS: ${{ matrix.connections }}
        run: |
          out="output/native/w${WORKERS}-n1-c${CONNECTIONS}"
          mkdir -p "$out"
          if [[ ! -s "$out/measurement.json" ]]; then
            for file in nginx.conf nginx.log nginx-stdout.log nginx-test.log certificate.log smoke-http.log smoke-tls.log wrk-warmup.log wrk.log; do
              [[ -e "$out/$file" ]] || : >"$out/$file"
            done
            printf 'FAIL\n' >"$out/harness.status"
            printf 'FAIL\n' >"$out/smoke-http.status"
            printf 'FAIL\n' >"$out/smoke-tls.status"
            printf 'FAIL\n' >"$out/wrk-warmup.status"
            printf '125\n' >"$out/wrk.exit-code"
            python3 - "$out" "$WORKERS" "$THREADS" "$CONNECTIONS" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          workers, threads, connections = map(int, sys.argv[2:])
          result = {"schema_version": 1, "status": "FAIL", "failures": ["native nginx benchmark setup failed before measurement"], "warnings": [], "profile": "native", "workers": workers, "ncpus": 1, "host_cpu_count": None, "wrk_threads": threads, "connections": connections, "duration_seconds": 30, "warmup_status": "FAIL", "kernel_sha": "native-runner", "aports_sha": "system-packages", "gcc_version": "system-nginx", "requests_per_second": None, "average_latency_ms": None, "socket_errors": None, "smoke_http": False, "smoke_tls": False, "raw_logs": ["nginx.conf", "nginx.log", "nginx-stdout.log", "nginx-test.log", "wrk-warmup.log", "wrk.log", "smoke-http.log", "smoke-tls.log"]}
          (out / "measurement.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY
          fi
      - name: Show native nginx result
        if: always()
        run: |
          python3 - "output/native/w${{ matrix.workers }}-n1-c${{ matrix.connections }}/measurement.json" >>"$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(f"### nginx: native / workers={result.get('workers')} / connections={result.get('connections')}")
          print(f"\n**Status:** {result.get('status')}  ")
          print(f"**Requests/sec:** {result.get('requests_per_second')}  ")
          print(f"**Mean latency (ms):** {result.get('average_latency_ms')}  ")
          print(f"**Host CPUs:** {result.get('host_cpu_count')}  ")
          print(f"**HTTP/TLS smoke:** {result.get('smoke_http')} / {result.get('smoke_tls')}")
          for failure in result.get("failures", []): print(f"- {failure}")
          PY
      - name: Upload native nginx raw logs and measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-native-w${{ matrix.workers }}-n1-c${{ matrix.connections }}
          path: output/native/w${{ matrix.workers }}-n1-c${{ matrix.connections }}
          if-no-files-found: error