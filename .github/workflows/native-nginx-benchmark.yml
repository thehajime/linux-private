name: native nginx benchmark

on:
  workflow_call:

jobs:
  native_nginx_benchmark:
    name: "nginx native"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out benchmark helper
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/workflows
      - name: Install native nginx benchmark tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nginx wrk curl openssl
      - name: Measure the native profile matrix
        run: |
          set -uo pipefail
          status=0
          for workers in 1 4 8 16; do
            for connections in 1 4 8 16; do
              out="output/native/w${workers}-n1-c${connections}"
              if ! bash .github/workflows/run-native-nginx-benchmark.sh \
                --workers "$workers" --threads 2 \
                --connections "$connections" --duration 30 \
                --output "$out"; then
                status=1
              fi
            done
          done
          exit "$status"
      - name: Show native nginx results
        if: always()
        run: |
          set -uo pipefail
          find output/native -name measurement.json -print0 | sort -z | \
            while IFS= read -r -d '' result; do
              python3 - "$result" >>"$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(f"### nginx: native / workers={result.get('workers')} / connections={result.get('connections')}")
          print(f"\n**Status:** {result.get('status')}  ")
          print(f"**Requests/sec:** {result.get('requests_per_second')}  ")
          print(f"**Mean latency (ms):** {result.get('average_latency_ms')}  ")
          print(f"**Host CPUs:** {result.get('host_cpu_count')}  ")
          for failure in result.get('failures') or []:
              print(f"- {failure}")
          PY
            done
      - name: Upload native nginx raw logs and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-result-native
          path: output/native
          if-no-files-found: error
